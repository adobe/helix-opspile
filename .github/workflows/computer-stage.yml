      - 'src/resolve.js'
      - 'src/response-model.js'
      - 'src/rethread.js'
      - 'src/roles.js'
      - 'src/rules.js'
      - 'src/search.js'
      - 'src/scripttools.js'
      - 'src/shares.js'
      - 'src/shortcodes.js'
      - 'src/sidebar.js'
      - 'src/slackurl.js'
      - 'src/sources.js'
      - 'src/stack.js'
      - 'src/standing.js'
      - 'src/stacktech.js'
      - 'src/suggest.js'
      - 'src/teamprofile.js'
      - 'src/teamsbot.js'
      - 'src/teamsfiles.js'
      - 'src/techid.js'
      - 'src/threadfiles.js'
      - 'src/threadlinks.js'
      - 'src/threads.js'
      - 'src/toolrequests.js'
      - 'src/topicindex.js'
      - 'src/translate.js'
      - 'src/trends.js'
      - 'src/ui-markdown.js'
      - 'src/vectors.js'
      - 'src/vendors.js'
  workflow_dispatch:
    inputs:
      measure:
        description: "The image caches to measure: default, or MiB in all/of one file (48/24), comma-separated"
        default: default

permissions:
  contents: read

# One stage Worker for every branch: one run at a time.
concurrency:
  group: computer-stage
  cancel-in-progress: false

env:
  CF_SEND_TELEMETRY: 'false'
  WRANGLER_SEND_METRICS: 'false'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CONFIG: scripts/dev-computer/wrangler.json

jobs:
  computer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --silent

      - name: Make the buckets
        run: |
          for b in helix-opspile-computer-stage-images helix-opspile-computer-stage-files; do
            npx wrangler r2 bucket info "$b" > /dev/null 2>&1 || npx wrangler r2 bucket create "$b"
          done

      - name: Make this run's token
        run: |
          token=$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')
          echo "::add-mask::$token"
          echo "COMPUTER_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Deploy
        id: deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          umask 077
          printf '{"COMPUTER_TOKEN":"%s","GITHUB_TOKEN":"%s"}' "$COMPUTER_TOKEN" "$GITHUB_TOKEN" \
            > "$RUNNER_TEMP/secrets.json"
          status=0
          npx wrangler deploy -c "$CONFIG" --env stage --secrets-file "$RUNNER_TEMP/secrets.json" \
            > "$RUNNER_TEMP/deploy.log" 2>&1 || status=$?
          rm -f "$RUNNER_TEMP/secrets.json"
          url=$(grep -o 'https://[^ ]*\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          [ -n "$url" ] && echo "::add-mask::$url"
          sed -E 's#https://[^ ]+#<url>#g' "$RUNNER_TEMP/deploy.log"
          [ "$status" = 0 ] && [ -n "$url" ] || { echo "the deploy failed, or named no workers.dev address"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # check.mjs waits for the Worker to answer with this run's token first (two minutes at
      # most), and tries a request again when the network or Cloudflare fails it.
      - name: Put the images, and run their programs
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: npm run computer:check -- --images "$URL"

      # What an agent of the GitHub image costs, for the step summary: measured, not checked
      # (a size too large fails a step on the memory limit, which does not fail the run).
      - name: Measure an agent's memory
        if: always() && steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          URL: ${{ steps.deploy.outputs.url }}
          MEASURE: ${{ inputs.measure || 'default' }}
        run: npm run computer:check -- --measure "$MEASURE" "$URL"

      - name: Lock it again
        if: always() && steps.deploy.outcome != 'skipped'
        run: |
          node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))' \
            | npx wrangler secret put COMPUTER_TOKEN -c "$CONFIG" --env stage > /dev/null 2>&1 \
            || echo "::warning::could not replace the stage computer's token"
          npx wrangler secret delete GITHUB_TOKEN -c "$CONFIG" --env stage < /dev/null > /dev/null 2>&1 \
            || echo "::warning::could not delete the stage computer's GITHUB_TOKEN"
