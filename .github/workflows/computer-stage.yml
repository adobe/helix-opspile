name: Computer on stage

# Deploys an agent's computer by itself (scripts/dev-computer/worker.mjs, the real ThreadAgent
# with its shells, without a model, an inbox or D1) to Cloudflare as
# helix-opspile-computer-stage, puts the images of scripts/computer-images.mjs into its bucket,
# and runs their programs there (scripts/dev-computer/check.mjs): where local workerd does not
# hold them to Dynamic Workers' limits (128 MB of memory, module sizes, 10 at once). On a push
# to any branch but main (which deploys production instead, ci.yml) that changes the computer:
# not the pages, nor what the Worker does not import.
#
# The Worker is a shell on the internet: it answers only requests with the secret
# COMPUTER_TOKEN, which each run makes, masks and keeps nowhere, and replaces with one nobody
# knows when it ends. Its address names the account, so the logs and the summary leave it out.

on:
  push:
    branches-ignore: [main]
    # What the computer is made of: this workflow, the packages (the kernel, the images'
    # programs), the images and the checks, and every file of src/ that the Worker imports.
    # test/computer-stage-paths.test.js keeps the list to the imports, both ways.
    paths:
      - '.github/workflows/computer-stage.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/computer-images.mjs'
      - 'scripts/dev-computer/**'
      - 'src/agent/**'
      - '!src/agent/stub.js'
      - 'src/accounts.js'
      - 'src/attach.js'
      - 'src/bashrequests.js'
      - 'src/channels.js'
      - 'src/channelurl.js'
      - 'src/clickhouse.js'
      - 'src/cogs/meter.js'
      - 'src/cogs/prices.js'
      - 'src/deadjobs.js'
      - 'src/discord.js'
      - 'src/draftevents.js'
      - 'src/drafts.js'
      - 'src/emoji.js'
      - 'src/emojinames.js'
      - 'src/experiments.js'
      - 'src/expertevents.js'
      - 'src/expertise.js'
      - 'src/experts.js'
      - 'src/extract.js'
      - 'src/favicons.js'
      - 'src/filecache.js'
      - 'src/fulltext.js'
      - 'src/github.js'
      - 'src/graph.js'
      - 'src/har.js'
      - 'src/http.js'
      - 'src/ico.js'
      - 'src/invite.js'
      - 'src/kb.js'
      - 'src/label.js'
      - 'src/like.js'
      - 'src/lookup.js'
      - 'src/markdown.js'
      - 'src/mdast.js'
      - 'src/mention-match.js'
      - 'src/messagelinks.js'
      - 'src/notify.js'
      - 'src/platforms.js'
      - 'src/post.js'
      - 'src/products.js'
      - 'src/profiles.js'
      - 'src/raw.js'
      - 'src/refile.js'
      - 'src/resolve.js'
      - 'src/rethread.js'
      - 'src/review.js'
      - 'src/rules.js'
      - 'src/shares.js'
      - 'src/shortcodes.js'
      - 'src/sidebar.js'
      - 'src/slackurl.js'
      - 'src/sources.js'
      - 'src/stack.js'
      - 'src/suggest.js'
      - 'src/teamsbot.js'
      - 'src/teamsfiles.js'
      - 'src/threadfiles.js'
      - 'src/threads.js'
      - 'src/topicindex.js'
      - 'src/ui-markdown.js'
      - 'src/vectors.js'
  workflow_dispatch:

permissions:
  contents: read

# One stage Worker for every branch: one run at a time.
concurrency:
  group: computer-stage
  cancel-in-progress: false

env:
  CF_SEND_TELEMETRY: 'false'
  WRANGLER_SEND_METRICS: 'false'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CONFIG: scripts/dev-computer/wrangler.json

jobs:
  computer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --silent

      - name: Make the buckets
        run: |
          for b in helix-opspile-computer-stage-images helix-opspile-computer-stage-files; do
            npx wrangler r2 bucket info "$b" > /dev/null 2>&1 || npx wrangler r2 bucket create "$b"
          done

      - name: Make this run's token
        run: |
          token=$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')
          echo "::add-mask::$token"
          echo "COMPUTER_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Deploy
        id: deploy
        run: |
          umask 077
          printf '{"COMPUTER_TOKEN":"%s"}' "$COMPUTER_TOKEN" > "$RUNNER_TEMP/secrets.json"
          status=0
          npx wrangler deploy -c "$CONFIG" --env stage --secrets-file "$RUNNER_TEMP/secrets.json" \
            > "$RUNNER_TEMP/deploy.log" 2>&1 || status=$?
          rm -f "$RUNNER_TEMP/secrets.json"
          url=$(grep -o 'https://[^ ]*\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          [ -n "$url" ] && echo "::add-mask::$url"
          sed -E 's#https://[^ ]+#<url>#g' "$RUNNER_TEMP/deploy.log"
          [ "$status" = 0 ] && [ -n "$url" ] || { echo "the deploy failed, or named no workers.dev address"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # check.mjs waits for the Worker to answer with this run's token first (two minutes at
      # most), and tries a request again when the network or Cloudflare fails it.
      - name: Put the images, and run their programs
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: npm run computer:check -- --images "$URL"

      - name: Lock it again
        if: always() && steps.deploy.outcome != 'skipped'
        run: |
          node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))' \
            | npx wrangler secret put COMPUTER_TOKEN -c "$CONFIG" --env stage > /dev/null 2>&1 \
            || echo "::warning::could not replace the stage computer's token"
