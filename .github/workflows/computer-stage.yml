name: Computer on stage

# Deploys an agent's computer by itself (scripts/dev-computer/worker.mjs, the real ThreadAgent
# with its kernel, without a model, an inbox or D1) to Cloudflare as
# helix-opspile-computer-stage, puts the images of scripts/computer-images.mjs into its bucket,
# and runs their programs there (scripts/dev-computer/check.mjs): where local workerd does not
# hold them to Dynamic Workers' limits (128 MB of memory, module sizes, 10 at once). On a push
# to any branch but main (which deploys production instead, ci.yml) that changes the computer:
# not the pages, nor what the Worker does not import.
#
# The Worker is a shell on the internet: it answers only requests with the secret
# COMPUTER_TOKEN, which each run makes, masks and keeps nowhere, and replaces with one nobody
# knows when it ends. Its address names the account, so the logs and the summary leave it out.
#
# git's checks clone from github.com, which limits anonymous clones from Cloudflare's shared
# addresses (429). So the run hands the Worker its own GITHUB_TOKEN (contents: read, which
# GitHub revokes when the job ends) as the secret GITHUB_TOKEN, and the computer's gateway puts
# it into git's requests to github.com only, as it does a team's secrets: no program sees it
# (scripts/dev-computer/worker.mjs, `devSecrets`). The run deletes it again when it ends.

on:
  push:
    # The merge queue's branches hold what a pull request's branch had already.
    branches-ignore: [main, 'gh-readonly-queue/**']
    # What the computer is made of: this workflow, the packages (the kernel, the images'
    # programs), the images and the checks, and every file of src/ that the Worker imports.
    # test/computer-stage-paths.test.js keeps the list to the imports, both ways.
    paths:
      - '.github/workflows/computer-stage.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/computer-images.mjs'
      - 'scripts/dev-computer/**'
      - 'src/agent/**'
      - '!src/agent/stub.js'
      - 'src/accounts.js'
      - 'src/agentlabels.js'
      - 'src/alertbots.js'
      - 'src/areas.js'
      - 'src/attach.js'
      - 'src/bashrequests.js'
      - 'src/catalog.js'
      - 'src/channelrefs.js'
      - 'src/channels.js'
      - 'src/channelurl.js'
      - 'src/clickhouse.js'
      - 'src/cogs/meter.js'
      - 'src/cogs/prices.js'
      - 'src/d1batch.js'
      - 'src/deadjobs.js'
      - 'src/diagrams.js'
      - 'src/discord.js'
      - 'src/dot.js'
      - 'src/draftevents.js'
      - 'src/draftfiles.js'
      - 'src/drafts.js'
      - 'src/emoji.js'
      - 'src/emojinames.js'
      - 'src/experiments.js'
      - 'src/expertevents.js'
      - 'src/expertise.js'
      - 'src/experts.js'
