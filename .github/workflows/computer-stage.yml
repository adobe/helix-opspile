      - 'src/kbindex.js'
      - 'src/label.js'
      - 'src/like.js'
      - 'src/listactivity.js'
      - 'src/lookup.js'
      - 'src/markdown.js'
      - 'src/mdast.js'
      - 'src/mdpick.js'
      - 'src/memberrequests.js'
      - 'src/mention-match.js'
      - 'src/mention-model.js'
      - 'src/mentionmodels.js'
      - 'src/messagelinks.js'
      - 'src/normalize.js'
      - 'src/notify.js'
      - 'src/orgmerge.js'
      - 'src/orgpartners.js'
      - 'src/orgstacks.js'
      - 'src/partners.js'
