<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>opspile · admin</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f1114" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="opspile">
<style>
  :root {
    --bg: #0f1114; --col: #15181c; --card: #1a1e23; --line: #2a2f36; --hover: #20252b;
    --ink: #e8eaed; --mute: #8b929b; --faint: #5d646d;
    --accent: #5aa2ff; --link: #7cc0ff; --sel: #1f2a38;
    --red: #e5534b; --yellow: #d4a72c; --green: #57ab5a; --purple: #a371f7;
    --code: #0b0d10;
    font: 14px/1.45 "Adobe Clean", adobe-clean, "Source Sans 3", "Source Sans Pro",
      -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eceef1; --col: #f6f7f9; --card: #fff; --line: #dfe2e6; --hover: #eef1f5;
      --ink: #1d2025; --mute: #616a75; --faint: #9aa1aa; --accent: #1f6feb; --link: #0b5cc4;
      --sel: #dde9fb; --purple: #8250df; --code: #f3f4f6;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: var(--app-height, 100%); overflow: hidden; }
  /* Installed as an app on an iPhone (viewport-fit=cover), the page reaches under the home
     indicator and, on the phone's side, under the camera: the sections scroll their ends out
     from under it, and the page keeps clear of the sides. The insets are 0 everywhere else. */
  :root { --safe-bottom: env(safe-area-inset-bottom, 0px); }
  body { padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  /* With the on-screen keyboard open (see the script at the end), the page follows what is left
     above it, and the keyboard covers the home indicator. */
  :root.keyboard { --safe-bottom: 0px; }
  body { translate: 0 var(--app-top, 0px); }
  main > section::after { content: ""; display: block; height: var(--safe-bottom); flex: none; }
  body { margin: 0; background: var(--bg); display: flex; flex-direction: column; }
  button, input, select { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line);
    border-radius: 7px; padding: 3px 9px; }
  button { cursor: pointer; white-space: nowrap; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--red); }
  button.link { border: 0; background: none; color: var(--link); padding: 0 4px; }
  a { color: var(--link); }
  code, .mono { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  /* The toolbar, as in the inbox: you on the right, with a menu to log out. */
  header { display: flex; gap: 10px; align-items: center; height: 50px; padding: 0 12px 0 14px; flex: none;
    background: var(--col); border-bottom: 1px solid var(--line); }
  header h1 { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; margin: 0 8px 0 0;
    letter-spacing: .01em; }
  header h1 img { width: 22px; height: 22px; border-radius: 6px; }
  header .spacer { flex: 1; }
  .av { display: grid; place-items: center; flex: none; width: 28px; height: 28px; border-radius: 50%; color: #fff;
    font-size: 11px; font-weight: 600; }
  #user { display: flex; align-items: center; gap: 9px; height: 38px; padding: 0 8px 0 4px; border-color: transparent;
    background: none; border-radius: 10px; text-align: left; }
  #user:hover, #user[aria-expanded="true"] { background: var(--hover); border-color: var(--line); }
  #user .nm { font-weight: 600; font-size: 13px; white-space: nowrap; }
  #user svg { width: 12px; height: 12px; color: var(--mute); }
  .menu { position: fixed; inset: 46px 12px auto auto; margin: 0; width: 290px; padding: 6px; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0,0,0,.22), 0 2px 6px rgba(0,0,0,.12); font-size: 13px; }
  .menu .id { display: flex; gap: 10px; align-items: center; padding: 8px 8px 10px; }
  .menu .id .av { width: 36px; height: 36px; font-size: 13px; }
  .menu .id .nm { font-weight: 650; font-size: 14px; }
  .menu .id .sub { color: var(--mute); font-size: 12px; overflow-wrap: anywhere; }
  .menu section { border-top: 1px solid var(--line); padding: 6px 0; }
  .menu h4 { margin: 4px 8px 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--faint); }
  .menu .item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 7px; color: inherit;
    text-decoration: none; }
  .menu .item:hover, .menu .item:focus-visible { background: var(--hover); outline: none; }
  .menu .item svg { width: 14px; height: 14px; flex: none; }
  .menu .keys { display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; margin: 2px 8px 4px; color: var(--mute); }
  .menu .keys dd { margin: 0; text-align: right; }
  /* Inbox ↔ knowledge bases ↔ admin, for the admin team: the same switch in every header. */
  nav.pages { display: inline-flex; height: 30px; background: var(--card); border: 1px solid var(--line); border-radius: 7px;
    overflow: hidden; }
  nav.pages[hidden] { display: none; }
  nav.pages a { display: flex; align-items: center; color: var(--mute); text-decoration: none; padding: 0 11px; }
  nav.pages a + a { border-left: 1px solid var(--line); }
  nav.pages a:hover { color: var(--ink); background: var(--hover); }
  nav.pages a[aria-current="page"] { color: var(--ink); background: var(--sel); cursor: default;
    box-shadow: inset 0 0 0 1px var(--accent); border-radius: 6px; }
  nav.pages a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  header nav.tabs { display: flex; gap: 4px; }
  header nav.tabs a { display: flex; align-items: center; height: 30px; color: var(--mute); text-decoration: none; padding: 0 11px;
    border-radius: 7px; }
  header nav.tabs a:hover { color: var(--ink); background: var(--hover); }
  header nav.tabs a[hidden] { display: none; }
  header nav.tabs a[aria-current="page"] { color: var(--ink); background: var(--sel); }
  main { flex: 1; display: grid; grid-template-columns: 320px 1fr; min-height: 0; }
  main > section { overflow: auto; min-height: 0; }
  #list { padding: 12px; border-right: 1px solid var(--line); background: var(--col); }
  #detail { padding: 16px 22px 40px; background: var(--bg); }
  h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); margin: 18px 0 8px; }
  h2:first-child { margin-top: 0; }
  .search { width: 100%; margin-bottom: 8px; }
  .row { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 7px; cursor: pointer; }
  .row:hover { background: var(--hover); }
  .row.on { background: var(--sel); }
  .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub, .sub { color: var(--faint); font-size: 12px; }
  .ico { width: 16px; height: 16px; border-radius: 3px; flex: none; }
  .ico.none { background: var(--line); }
  .tag { font-size: 11px; padding: 0 6px; border-radius: 9px; border: 1px solid var(--line); color: var(--mute); white-space: nowrap; }
  .tag.partner { color: var(--purple); border-color: var(--purple); }
  .tag.vendor { color: var(--yellow); border-color: var(--yellow); }
  .tag.manual { color: var(--accent); border-color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
  .title { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .title input.big { font-size: 20px; font-weight: 600; flex: 1; background: transparent; border-color: transparent; padding: 2px 6px; }
  .title input.big:hover, .title input.big:focus { border-color: var(--line); background: var(--card); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 600; font-size: 12px; color: var(--mute); padding: 4px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.n { text-align: right; color: var(--mute); font-variant-numeric: tabular-nums; }
  td input { width: 100%; }
  .form { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .form input { min-width: 120px; }
  .form input.grow { flex: 1; }
  .hint { color: var(--mute); font-size: 13px; margin: 4px 0 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 3px 12px; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .field { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; align-items: center; }
  .field label { color: var(--mute); }
  .status { min-height: 20px; font-size: 13px; color: var(--mute); margin-top: 8px; }
  .status.ok { color: var(--green); } .status.err { color: var(--red); } .status.warn { color: var(--yellow); }
  .picker { position: relative; }
  .picks { position: absolute; z-index: 5; left: 0; right: 0; top: 100%; margin-top: 4px; max-height: 280px; overflow: auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .picks.up { top: auto; bottom: 100%; margin: 0 0 4px; box-shadow: 0 -8px 24px rgba(0,0,0,.25); }
  .picks .row { border-radius: 0; }
  .picks .pickrow { align-items: flex-start; padding: 7px 10px; }
  .picks .pickrow .name { white-space: normal; display: flex; flex-direction: column; gap: 1px; }
  .picks .pickrow .ch { font-weight: 600; }
  .picks .pickrow .where { flex: none; text-align: right; font-size: 13px; padding-top: 1px; }
  mark { background: color-mix(in srgb, var(--yellow) 35%, transparent); color: inherit; border-radius: 2px; padding: 0 1px; }
  .sep { color: var(--faint); }
  td.nw { white-space: nowrap; }
  td .sub .mono { overflow-wrap: anywhere; }
  tr.left td { opacity: .55; }
  tr.section td { font-size: 12px; font-weight: 600; color: var(--mute); padding-top: 16px; }
  .tag.clef { color: var(--mute); }
  .tag.clef.yes { color: var(--green); border-color: var(--green); }
  .person { display: inline-block; margin: 1px 8px 1px 0; white-space: nowrap; }
  .empty { color: var(--mute); padding: 20px 4px; }
  /* Channel assignment requests: how many are open, and what came of each. */
  .count { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 6px;
    border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 650; line-height: 1; }
  .count[hidden] { display: none; }
  .tag.open { color: var(--yellow); border-color: var(--yellow); }
  .tag.confirmed { color: var(--green); border-color: var(--green); }
  .tag.declined { color: var(--red); border-color: var(--red); }
  .note { white-space: pre-wrap; overflow-wrap: break-word; }
  #requestsTable td.note { min-width: 160px; }
  .preview { margin: 0 0 4px; }
  .preview ul { margin: 6px 0 0; padding-left: 20px; }
  .menu { max-width: calc(100vw - 24px); max-height: calc(100dvh - 58px); overflow-y: auto; }
  #membersTable, #rulesTable, #channelsTable, #requestsTable { overflow-x: auto; }

  /*
   * Narrower screens. Under 1100px the list gets narrower. Under 700px (phones, a folded iPhone
   * Duo) the list and what is picked in it take turns (`body.picked` while something is), the
   * picked team or org has a back button, the sections move to a second row of the toolbar,
   * and tables scroll sideways in their card.
   */
  .title .back { display: none; }
  /* A text field under 16px makes iOS zoom in on it when it is focused. */
  @media (hover: none) and (pointer: coarse) {
    input, select, textarea { font-size: 16px; }
  }
  @media (max-width: 1099px) {
    main { grid-template-columns: minmax(240px, 34%) minmax(0, 1fr); }
    #detail { padding: 14px 16px 32px; }
  }
  @media (max-width: 699px) {
    header { flex-wrap: wrap; height: auto; min-height: 50px; gap: 6px 8px; padding: 6px 8px 6px 12px; }
    header h1 { font-size: 0; gap: 0; margin: 0; }
    header nav.tabs { order: 1; flex-basis: 100%; overflow-x: auto; scrollbar-width: none; }
    header nav.tabs a { white-space: nowrap; }
    nav.pages { min-width: 0; overflow-x: auto; scrollbar-width: none; }
    nav.pages a { padding: 0 8px; white-space: nowrap; }
    #user { padding: 0 4px; gap: 6px; }
    #user .nm { display: none; }
    .menu { right: 8px; }
    main { grid-template-columns: 100%; }
    body.picked #list, body:not(.picked) #detail { display: none; }
    #list { border-right: 0; }
    #detail { padding: 10px 12px 32px; }
    .title { flex-wrap: wrap; gap: 6px 8px; }
    .title .back { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0;
      background: none; color: var(--link); }
    .title .back svg { width: 18px; height: 18px; }
    .title input.big { flex: 1 1 60%; min-width: 0; font-size: 18px; }
    .card { padding: 10px 12px; }
    .card > table { display: block; overflow-x: auto; }
    /* Too many columns for a phone: the requests scroll sideways in their card. */
    #requestsTable table { min-width: 640px; }
    .field { grid-template-columns: 1fr; gap: 4px; }
    .field label { margin-top: 6px; }
    .seg { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<header>
  <h1><img src="/apple-touch-icon.png" alt="">opspile</h1>
  <nav class="pages" aria-label="Admin pages"><a href="/inbox" title="Back to the inbox">Inbox</a><a href="/inbox/kb" title="Thread agents: their knowledge bases, channels, MCP servers and instructions">Agents</a><a href="/inbox/admin" aria-current="page">Admin</a></nav>
  <nav class="tabs" aria-label="Admin sections">
    <a href="/inbox/admin?tab=teams" data-tab="teams">Teams</a>
    <a href="/inbox/admin?tab=orgs" data-tab="orgs">Customers, partners, vendors</a>
    <a href="/inbox/admin?tab=requests" data-tab="requests" title="Channels team managers asked for: confirm or decline">Requests<span class="count" id="reqCount" hidden></span></a>
  </nav>
  <span class="spacer"></span>
  <button id="user" popovertarget="menu" aria-haspopup="true" aria-expanded="false" aria-label="Account">
    <span class="av" id="userAv"></span><span class="nm" id="me"></span>
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div id="menu" class="menu" popover>
    <div class="id"><span class="av" id="menuAv"></span><div><div class="nm" id="menuName"></div><div class="sub" id="menuEmail"></div></div></div>
    <section><a class="item" href="/cdn-cgi/access/logout"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5H3.5v11H6M10 5l3 3-3 3M13 8H6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Log out</a></section>
  </div>
</header>
<main>
  <section id="list"><div class="empty">Loading…</div></section>
  <section id="detail"></section>
</main>
<script src="admin.js"></script>
<script src="app.js"></script>
</body>
</html>
