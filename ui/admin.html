<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>opspile · admin</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f1114" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="opspile">
<style>
  :root {
    --bg: #0f1114; --col: #15181c; --card: #1a1e23; --line: #2a2f36; --hover: #20252b;
    --ink: #e8eaed; --mute: #8b929b; --faint: #5d646d;
    --accent: #5aa2ff; --link: #7cc0ff; --sel: #1f2a38;
    --red: #e5534b; --yellow: #d4a72c; --green: #57ab5a; --purple: #a371f7;
    --code: #0b0d10;
    font: 14px/1.45 "Adobe Clean", adobe-clean, "Source Sans 3", "Source Sans Pro",
      -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eceef1; --col: #f6f7f9; --card: #fff; --line: #dfe2e6; --hover: #eef1f5;
      --ink: #1d2025; --mute: #616a75; --faint: #9aa1aa; --accent: #1f6feb; --link: #0b5cc4;
      --sel: #dde9fb; --purple: #8250df; --code: #f3f4f6;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; background: var(--bg); display: flex; flex-direction: column; }
  button, input, select { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line);
    border-radius: 7px; padding: 3px 9px; }
  button { cursor: pointer; white-space: nowrap; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--red); }
  button.link { border: 0; background: none; color: var(--link); padding: 0 4px; }
  a { color: var(--link); }
  code, .mono { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  /* The toolbar, as in the inbox: you on the right, with a menu to log out. */
  header { display: flex; gap: 10px; align-items: center; height: 50px; padding: 0 12px 0 14px; flex: none;
    background: var(--col); border-bottom: 1px solid var(--line); }
  header h1 { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; margin: 0 8px 0 0;
    letter-spacing: .01em; }
  header h1 img { width: 22px; height: 22px; border-radius: 6px; }
  header .spacer { flex: 1; }
  .av { display: grid; place-items: center; flex: none; width: 28px; height: 28px; border-radius: 50%; color: #fff;
    font-size: 11px; font-weight: 600; }
  #user { display: flex; align-items: center; gap: 9px; height: 38px; padding: 0 8px 0 4px; border-color: transparent;
    background: none; border-radius: 10px; text-align: left; }
  #user:hover, #user[aria-expanded="true"] { background: var(--hover); border-color: var(--line); }
  #user .nm { font-weight: 600; font-size: 13px; white-space: nowrap; }
  #user svg { width: 12px; height: 12px; color: var(--mute); }
  .menu { position: fixed; inset: 46px 12px auto auto; margin: 0; width: 290px; padding: 6px; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0,0,0,.22), 0 2px 6px rgba(0,0,0,.12); font-size: 13px; }
  .menu .id { display: flex; gap: 10px; align-items: center; padding: 8px 8px 10px; }
  .menu .id .av { width: 36px; height: 36px; font-size: 13px; }
  .menu .id .nm { font-weight: 650; font-size: 14px; }
  .menu .id .sub { color: var(--mute); font-size: 12px; overflow-wrap: anywhere; }
  .menu section { border-top: 1px solid var(--line); padding: 6px 0; }
  .menu h4 { margin: 4px 8px 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--faint); }
  .menu .item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 7px; color: inherit;
    text-decoration: none; }
  .menu .item:hover, .menu .item:focus-visible { background: var(--hover); outline: none; }
  .menu .item svg { width: 14px; height: 14px; flex: none; }
  .menu .keys { display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; margin: 2px 8px 4px; color: var(--mute); }
  .menu .keys dd { margin: 0; text-align: right; }
  /* Inbox ↔ knowledge bases ↔ admin, for the admin team: the same switch in every header. */
  nav.pages { display: inline-flex; height: 30px; background: var(--card); border: 1px solid var(--line); border-radius: 7px;
    overflow: hidden; }
  nav.pages[hidden] { display: none; }
  nav.pages a { display: flex; align-items: center; color: var(--mute); text-decoration: none; padding: 0 11px; }
  nav.pages a + a { border-left: 1px solid var(--line); }
  nav.pages a:hover { color: var(--ink); background: var(--hover); }
  nav.pages a[aria-current="page"] { color: var(--ink); background: var(--sel); cursor: default;
    box-shadow: inset 0 0 0 1px var(--accent); border-radius: 6px; }
  nav.pages a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  header nav.tabs { display: flex; gap: 4px; }
  header nav.tabs a { display: flex; align-items: center; height: 30px; color: var(--mute); text-decoration: none; padding: 0 11px;
    border-radius: 7px; }
  header nav.tabs a:hover { color: var(--ink); background: var(--hover); }
  header nav.tabs a[aria-current="page"] { color: var(--ink); background: var(--sel); }
  main { flex: 1; display: grid; grid-template-columns: 320px 1fr; min-height: 0; }
  main > section { overflow: auto; min-height: 0; }
  #list { padding: 12px; border-right: 1px solid var(--line); background: var(--col); }
  #detail { padding: 16px 22px 40px; background: var(--bg); }
  h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); margin: 18px 0 8px; }
  h2:first-child { margin-top: 0; }
  .search { width: 100%; margin-bottom: 8px; }
  .row { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 7px; cursor: pointer; }
  .row:hover { background: var(--hover); }
  .row.on { background: var(--sel); }
  .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub, .sub { color: var(--faint); font-size: 12px; }
  .ico { width: 16px; height: 16px; border-radius: 3px; flex: none; }
  .ico.none { background: var(--line); }
  .tag { font-size: 11px; padding: 0 6px; border-radius: 9px; border: 1px solid var(--line); color: var(--mute); white-space: nowrap; }
  .tag.partner { color: var(--purple); border-color: var(--purple); }
  .tag.vendor { color: var(--yellow); border-color: var(--yellow); }
  .tag.manual { color: var(--accent); border-color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
  .title { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .title input.big { font-size: 20px; font-weight: 600; flex: 1; background: transparent; border-color: transparent; padding: 2px 6px; }
  .title input.big:hover, .title input.big:focus { border-color: var(--line); background: var(--card); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 600; font-size: 12px; color: var(--mute); padding: 4px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.n { text-align: right; color: var(--mute); font-variant-numeric: tabular-nums; }
  td input { width: 100%; }
  .form { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .form input { min-width: 120px; }
  .form input.grow { flex: 1; }
  .hint { color: var(--mute); font-size: 13px; margin: 4px 0 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 3px 12px; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .field { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; align-items: center; }
  .field label { color: var(--mute); }
  .status { min-height: 20px; font-size: 13px; color: var(--mute); margin-top: 8px; }
  .status.ok { color: var(--green); } .status.err { color: var(--red); } .status.warn { color: var(--yellow); }
  .picker { position: relative; }
  .picks { position: absolute; z-index: 5; left: 0; right: 0; top: 100%; margin-top: 4px; max-height: 280px; overflow: auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .picks.up { top: auto; bottom: 100%; margin: 0 0 4px; box-shadow: 0 -8px 24px rgba(0,0,0,.25); }
  .picks .row { border-radius: 0; }
  .picks .pickrow { align-items: flex-start; padding: 7px 10px; }
  .picks .pickrow .name { white-space: normal; display: flex; flex-direction: column; gap: 1px; }
  .picks .pickrow .ch { font-weight: 600; }
  .picks .pickrow .where { flex: none; text-align: right; font-size: 13px; padding-top: 1px; }
  mark { background: color-mix(in srgb, var(--yellow) 35%, transparent); color: inherit; border-radius: 2px; padding: 0 1px; }
  .sep { color: var(--faint); }
  td.nw { white-space: nowrap; }
  td .sub .mono { overflow-wrap: anywhere; }
  tr.section td { font-size: 12px; font-weight: 600; color: var(--mute); padding-top: 16px; }
  .tag.clef { color: var(--mute); }
  .tag.clef.yes { color: var(--green); border-color: var(--green); }
  .person { display: inline-block; margin: 1px 8px 1px 0; white-space: nowrap; }
  .empty { color: var(--mute); padding: 20px 4px; }
  dialog.confirm { max-width: min(620px, 92vw); background: var(--card); color: var(--ink); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px; }
  dialog.confirm::backdrop { background: rgba(0,0,0,.35); }
  dialog.confirm p { margin: 0 0 8px; }
  dialog.confirm .detail { color: var(--mute); font-size: 13px; max-height: 45vh; overflow: auto; }
  dialog.confirm .detail li { margin: 2px 0; }
  dialog.confirm .apply { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .menu { max-width: calc(100vw - 24px); max-height: calc(100dvh - 58px); overflow-y: auto; }
  #membersTable, #rulesTable, #channelsTable { overflow-x: auto; }

  /*
   * Narrower screens. Under 1100px the list gets narrower. Under 700px (phones, a folded iPhone
   * Duo) the list and what is picked in it take turns (`body.picked` while something is), the
   * picked team or org has a back button, the sections move to a second row of the toolbar,
   * and tables scroll sideways in their card.
   */
  .title .back { display: none; }
  /* A text field under 16px makes iOS zoom in on it when it is focused. */
  @media (hover: none) and (pointer: coarse) {
    input, select, textarea { font-size: 16px; }
  }
  @media (max-width: 1099px) {
    main { grid-template-columns: minmax(240px, 34%) minmax(0, 1fr); }
    #detail { padding: 14px 16px 32px; }
  }
  @media (max-width: 699px) {
    header { flex-wrap: wrap; height: auto; min-height: 50px; gap: 6px 8px; padding: 6px 8px 6px 12px; }
    header h1 { font-size: 0; gap: 0; margin: 0; }
    header nav.tabs { order: 1; flex-basis: 100%; overflow-x: auto; scrollbar-width: none; }
    header nav.tabs a { white-space: nowrap; }
    nav.pages { min-width: 0; overflow-x: auto; scrollbar-width: none; }
    nav.pages a { padding: 0 8px; white-space: nowrap; }
    #user { padding: 0 4px; gap: 6px; }
    #user .nm { display: none; }
    .menu { right: 8px; }
    main { grid-template-columns: 100%; }
    body.picked #list, body:not(.picked) #detail { display: none; }
    #list { border-right: 0; }
    #detail { padding: 10px 12px 32px; }
    .title { flex-wrap: wrap; gap: 6px 8px; }
    .title .back { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0;
      background: none; color: var(--link); }
    .title .back svg { width: 18px; height: 18px; }
    .title input.big { flex: 1 1 60%; min-width: 0; font-size: 18px; }
    .card { padding: 10px 12px; }
    .card > table { display: block; overflow-x: auto; }
    .field { grid-template-columns: 1fr; gap: 4px; }
    .field label { margin-top: 6px; }
    .seg { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<header>
  <h1><img src="/apple-touch-icon.png" alt="">opspile</h1>
  <nav class="pages" aria-label="Admin pages"><a href="/inbox" title="Back to the inbox">Inbox</a><a href="/inbox/kb" title="Thread agents: their knowledge bases, channels, MCP servers and instructions">Agents</a><a href="/inbox/admin" aria-current="page">Admin</a></nav>
  <nav class="tabs" aria-label="Admin sections">
    <a href="/inbox/admin?tab=teams" data-tab="teams">Teams</a>
    <a href="/inbox/admin?tab=orgs" data-tab="orgs">Customers, partners, vendors</a>
  </nav>
  <span class="spacer"></span>
  <button id="user" popovertarget="menu" aria-haspopup="true" aria-expanded="false" aria-label="Account">
    <span class="av" id="userAv"></span><span class="nm" id="me"></span>
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div id="menu" class="menu" popover>
    <div class="id"><span class="av" id="menuAv"></span><div><div class="nm" id="menuName"></div><div class="sub" id="menuEmail"></div></div></div>
    <section><a class="item" href="/cdn-cgi/access/logout"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5H3.5v11H6M10 5l3 3-3 3M13 8H6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Log out</a></section>
  </div>
</header>
<main>
  <section id="list"><div class="empty">Loading…</div></section>
  <section id="detail"></section>
</main>
<script>
/*
 * The admin team's pages for ops teams (#17) and orgs (#18), over /api/admin (src/admin.js).
 *
 * Team managers (and every member of a self-managed team) see the teams they manage, add and
 * remove members and promote or demote them; the rest is for the admin team.
 *
 * Teams: create, rename and delete teams; add members (found by name or email) and remove
 * them; the rules that file channels under the team (a channel-name prefix like `aem-`, a
 * Teams team name, a Slack Connect team id); and manual assignments of single channels. Orgs: display name, icon and
 * type (customer, partner, vendor), and manual assignments. Every rule change is tried first:
 * if it moves channels to another team or org, the page lists them and asks, in the page (no
 * native dialogs, which a debugger attached over CDP dismisses). Text fields save when they
 * change. A change updates the open page in place (see "view state"); nothing reloads.
 */
const state = {
  me: null, tab: 'teams', teams: [], unassigned: null, orgs: [], types: [], sel: null, filter: '', view: null,
};
const $ = (id) => document.getElementById(id);
const COLORS = ['#c2410c', '#0f766e', '#7c3aed', '#be185d', '#1d4ed8', '#4d7c0f', '#a16207', '#0e7490'];
/** You, at the toolbar's right end (the same colour and initials as in the inbox), and its menu. */
function renderUser(me) {
  const name = me.name || me.email || '';
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const initials = name.replace(/\(.*?\)/g, '').split(/[\s,]+/).filter(Boolean).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
  for (const id of ['userAv', 'menuAv']) {
    $(id).textContent = initials;
    $(id).style.background = COLORS[h % COLORS.length];
  }
  $('me').textContent = name;
  $('menuName').textContent = name;
  $('menuEmail').textContent = me.email || '';
  $('menu').addEventListener('toggle', (e) => $('user').setAttribute('aria-expanded', String(e.newState === 'open')));
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const favicon = (icon) => (/^https:\/\//.test(icon) ? icon : `https://www.google.com/s2/favicons?domain=${encodeURIComponent(icon)}&sz=64`);
const ico = (icon) => (icon ? `<img class="ico" src="${esc(favicon(icon))}" alt="" loading="lazy" onerror="this.className='ico none';this.removeAttribute('src')">` : '<span class="ico none"></span>');
const ago = (at) => {
  if (!at) return '';
  const d = (Date.now() - Date.parse(at)) / 86400000;
  return d < 1 ? 'today' : d < 2 ? 'yesterday' : d < 60 ? `${Math.round(d)} days ago` : new Date(at).toLocaleDateString();
};
const FIELD_LABEL = {
  name: 'Channel name', group_name: 'Teams team or Discord server name', connected: 'Slack Connect team id', channel_id: 'Channel id',
};
const UNASSIGNED = '_unassigned';

async function call(path, method = 'GET', body) {
  const res = await fetch(path, {
    method,
    credentials: 'same-origin',
    ...(body ? { body: JSON.stringify(body), headers: { 'content-type': 'application/json' } } : {}),
  });
  const data = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, body: data };
}

/** A modal question in the page: resolves true for the `yes` button. */
function ask(question, detailHtml, yes, { danger = false } = {}) {
  return new Promise((resolve) => {
    const dlg = document.createElement('dialog');
    dlg.className = 'confirm';
    dlg.setAttribute('aria-label', question);
    dlg.innerHTML = `<form method="dialog"><p><b>${esc(question)}</b></p>${detailHtml ? `<div class="detail">${detailHtml}</div>` : ''}
      <div class="apply"><button value="no">Cancel</button><button value="yes" class="${danger ? 'danger' : 'primary'}">${esc(yes)}</button></div></form>`;
    dlg.addEventListener('cancel', () => { dlg.returnValue = 'no'; });
    dlg.addEventListener('close', () => { dlg.remove(); resolve(dlg.returnValue === 'yes'); });
    document.body.append(dlg);
    dlg.showModal();
    dlg.querySelector('[value="no"]').focus();
  });
}

function status(kind, text) {
  const el = $('status');
  if (!el) return;
  el.className = `status ${kind}`;
  el.textContent = text;
}

const orgLabel = (slug) => {
  const o = state.orgs.find((x) => x.slug === slug);
  return o && o.name ? o.name : slug;
};
// The admin team holds the channels no other team has (yet); adding a team to one of those
// moves it, adding a team to any other channel shares it (src/shares.js).
const isHolding = (slug) => !slug || slug === UNASSIGNED || slug === 'admin';
const teamLabel = (slug) => (slug === UNASSIGNED ? 'Unassigned' : (state.teams.find((t) => t.slug === slug)?.name || slug));

function movesHtml(moves) {
  const where = (x) => `${esc(teamLabel(x.team))} / ${esc(orgLabel(x.org))}${x.kind !== 'channel' ? ` (${esc(x.kind)})` : ''}`;
  return `<ul>${moves.slice(0, 60).map((m) => `<li><b>${channelName(m.channel)}</b>: ${m.from.map(where).join(', ')} → ${where(m.to)}
    <span class="sub">(${m.from.reduce((n, f) => n + f.threads, 0)} threads)</span></li>`).join('')}</ul>
    ${moves.length > 60 ? `<p>… and ${moves.length - 60} more.</p>` : ''}
    <p>Their threads are re-filed in the background; agents and knowledge bases follow the new team and org.</p>`;
}

/**
 * A rule change: tried first; when it moves channels, the page lists them and asks. Returns
 * the applied answer, or null when cancelled or refused.
 */
async function ruleChange(method, path, body) {
  status('', 'Checking what this changes…');
  const tried = await call(path, method, { ...body, dryRun: true });
  if (!tried.ok) { status('err', tried.body.error || `Failed (${tried.status}).`); return null; }
  const { moves } = tried.body;
  if (moves.length && !(await ask(`This moves ${moves.length} channel${moves.length === 1 ? '' : 's'}.`, movesHtml(moves), 'Move them'))) {
    status('', 'Nothing changed.');
    return null;
  }
  const done = await call(path, method, body);
  if (!done.ok) { status('err', done.body.error || `Failed (${done.status}).`); return null; }
  status('ok', moves.length ? `Saved. Re-filing ${moves.length} channel${moves.length === 1 ? '' : 's'}.` : 'Saved. No channel moves.');
  return done.body;
}

// ---- navigation ---------------------------------------------------------------------------

function toUrl() {
  const q = new URLSearchParams({ tab: state.tab });
  if (state.sel) q.set(state.tab === 'teams' ? 'team' : 'org', state.sel);
  history.replaceState(null, '', `/inbox/admin?${q}`);
  // Phones show the list or what is picked in it (see the styles).
  document.body.classList.toggle('picked', Boolean(state.sel));
  for (const a of document.querySelectorAll('nav [data-tab]')) {
    a.toggleAttribute('aria-current', a.dataset.tab === state.tab);
    if (a.dataset.tab === state.tab) a.setAttribute('aria-current', 'page');
  }
}

async function load() {
  // Team managers see their teams only, and no orgs.
  const [teams, orgs] = await Promise.all([call('/api/admin/teams'),
    state.me.admin ? call('/api/admin/orgs') : Promise.resolve({ body: {} })]);
  if (!teams.ok) { $('list').innerHTML = `<div class="empty">${esc(teams.body.error || 'Could not load.')}</div>`; return false; }
  state.teams = teams.body.teams;
  state.unassigned = teams.body.unassigned;
  state.orgs = orgs.body.orgs || [];
  state.types = orgs.body.types || ['customer', 'partner', 'vendor'];
  return true;
}

function wireFilter() {
  $('filter').oninput = (e) => {
    state.filter = e.target.value;
    const at = e.target.selectionStart;
    renderList();
    $('filter').focus();
    $('filter').setSelectionRange(at, at);
  };
  for (const el of $('list').querySelectorAll('[data-sel]')) el.onclick = () => select(el.dataset.sel);
}

function renderList() {
  const f = state.filter.toLowerCase();
  if (state.tab === 'teams') {
    const rows = state.teams.filter((t) => !f || `${t.name} ${t.slug}`.toLowerCase().includes(f)).map((t) => `
      <div class="row${state.sel === t.slug ? ' on' : ''}" data-sel="${esc(t.slug)}">
        <span class="name">${esc(t.name)} <span class="sub">${esc(t.slug)}</span></span>
        ${t.self_managed ? '<span class="tag manual" title="Every member is a team manager">self-managed</span>' : ''}
        <span class="sub">${t.members} people · ${t.channels} ch${t.shared ? ` + ${t.shared} shared` : ''}</span></div>`).join('');
    const un = state.unassigned && state.unassigned.channels ? `<div class="row${state.sel === UNASSIGNED ? ' on' : ''}" data-sel="${UNASSIGNED}">
        <span class="name"><i>Unassigned</i></span><span class="sub">${state.unassigned.channels} ch</span></div>` : '';
    $('list').innerHTML = `<input class="search" id="filter" placeholder="Filter teams" value="${esc(state.filter)}">
      <h2>${state.me.admin ? 'Ops teams' : 'Teams you manage'}</h2>${rows || '<div class="empty">No teams.</div>'}${un}
      ${state.me.admin ? `<h2>New team</h2><form class="form" id="newTeam"><input id="ntName" placeholder="Name" class="grow" required>
        <input id="ntSlug" placeholder="slug" pattern="[a-z0-9][a-z0-9-]*" required style="width:110px"><button class="primary">Create</button></form>` : ''}
      <div class="status" id="listStatus"></div>`;
    if (!state.me.admin) {
      wireFilter();
      return;
    }
    $('ntName').oninput = () => { if (!$('ntSlug').dataset.touched) $('ntSlug').value = $('ntName').value.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); };
    $('ntSlug').oninput = () => { $('ntSlug').dataset.touched = '1'; };
    $('newTeam').onsubmit = async (e) => {
      e.preventDefault();
      const r = await call('/api/admin/teams', 'POST', { slug: $('ntSlug').value, name: $('ntName').value });
      if (!r.ok) { $('listStatus').className = 'status err'; $('listStatus').textContent = r.body.error; return; }
      state.teams.push({
        ...r.body.team, members: 0, rules: 0, channels: 0, threads: 0,
      });
      state.teams.sort((x, y) => x.name.localeCompare(y.name));
      select(r.body.team.slug);
    };
  } else {
    const rows = state.orgs.filter((o) => !f || `${o.name || ''} ${o.slug}`.toLowerCase().includes(f)).map((o) => `
      <div class="row${state.sel === o.slug ? ' on' : ''}" data-sel="${esc(o.slug)}">
        ${ico(o.icon)}<span class="name">${esc(o.name || o.slug)}${o.name ? ` <span class="sub">${esc(o.slug)}</span>` : ''}</span>
        ${o.type !== 'customer' ? `<span class="tag ${o.type}">${esc(o.type)}</span>` : ''}
        <span class="sub">${o.channels} ch</span></div>`).join('');
    $('list').innerHTML = `<input class="search" id="filter" placeholder="Filter ${state.orgs.length} orgs" value="${esc(state.filter)}">
      ${rows || '<div class="empty">Nothing matches.</div>'}
      <h2>New org</h2><form class="form" id="newOrg"><input id="noName" placeholder="Display name" class="grow" required>
        <select id="noType">${state.types.map((t) => `<option>${t}</option>`).join('')}</select><button class="primary">Create</button></form>
      <p class="hint">Channels are filed under an org by the rules (<code>aem-&lt;slug&gt;</code>) or a manual assignment.</p>
      <div class="status" id="listStatus"></div>`;
    $('newOrg').onsubmit = async (e) => {
      e.preventDefault();
      const r = await call('/api/admin/orgs', 'POST', { name: $('noName').value, type: $('noType').value });
      if (!r.ok) { $('listStatus').className = 'status err'; $('listStatus').textContent = r.body.error; return; }
      state.orgs.push({ ...r.body.org, channels: 0, threads: 0 });
      state.orgs.sort((x, y) => (x.name || x.slug).localeCompare(y.name || y.slug));
      select(r.body.org.slug);
    };
  }
  wireFilter();
}

function select(sel) {
  state.sel = sel;
  toUrl();
  renderList();
  if (state.tab === 'teams') showTeam(sel); else showOrg(sel);
}

/** Back to the list (phones), its filter as it was. */
function unselect() {
  state.sel = null;
  toUrl();
  renderList();
  $('detail').innerHTML = `<div class="empty">Pick ${state.tab === 'teams' ? 'a team' : 'an org'}.</div>`;
}
const backButton = () => `<button class="back" data-back title="Back to the list" aria-label="Back to the ${state.tab === 'teams' ? 'teams' : 'orgs'}"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg></button>`;

function switchTab(tab) {
  state.tab = tab;
  state.sel = null;
  state.filter = '';
  toUrl();
  renderList();
  $('detail').innerHTML = `<div class="empty">Pick ${tab === 'teams' ? 'a team' : 'an org'}.</div>`;
}

// ---- view state ---------------------------------------------------------------------------
//
// The open team or org is kept in `state.view` (what the API said, then every change the
// page made). A change updates it and redraws only the part it touches (a table, the list
// on the left), so scroll position and focus stay where they are.

/** Adds `n` channels and `threads` threads to a team's or an org's counts in the list. */
function count(kind, slug, n, threads) {
  if (kind === 'team' && slug === UNASSIGNED) {
    if (state.unassigned) {
      state.unassigned.channels += n;
      state.unassigned.threads += threads;
    }
    return;
  }
  const list = kind === 'team' ? state.teams : state.orgs;
  const row = list.find((x) => x.slug === slug);
  if (row) {
    row.channels = Math.max(0, (row.channels || 0) + n);
    row.threads = Math.max(0, (row.threads || 0) + threads);
  }
}

/**
 * What a rule change moved, applied to the open view and to the counts on the left: a
 * channel that left this team (org) goes from the table, one that came is added.
 */
function applyMoves(moves) {
  const v = state.view;
  for (const m of moves) {
    const threads = m.from.reduce((n, f) => n + f.threads, 0);
    for (const kind of ['team', 'org']) {
      for (const f of m.from) {
        if (f[kind] !== m.to[kind]) {
          count(kind, f[kind], -1, -f.threads);
          count(kind, m.to[kind], 1, f.threads);
        }
      }
    }
    if (v) {
      const before = v.channels.filter((c) => c.channelId === m.channel.channelId);
      v.channels = v.channels.filter((c) => c.channelId !== m.channel.channelId);
      const was = before[0] || {};
      // The teams it is shared with keep it, wherever it is filed; the team it is filed under
      // now does not need it shared as well.
      const sharedWith = (was.sharedWith || []).filter((t) => t !== m.to.team);
      if (m.to[v.target] === v.value || (v.target === 'team' && sharedWith.includes(v.value))) {
        v.channels.unshift({
          source: m.channel.source,
          tenant: m.channel.tenant,
          channelId: m.channel.channelId,
          name: m.channel.name,
          groupName: was.groupName || m.channel.groupName || null,
          team: m.to.team,
          sharedWith,
          org: m.to.org,
          kind: m.to.kind,
          threads,
          latest: before.map((c) => c.latest).filter(Boolean).sort().pop() || null,
          manual: was.manual || { team: null, org: null },
        });
      }
    }
  }
}

/** Marks a channel of the open view as assigned by hand (`rule`), or not (null). */
function setManual(channelId, rule) {
  const v = state.view;
  for (const c of v.channels.filter((x) => x.channelId === channelId)) {
    c.manual = { ...c.manual, [v.target]: rule ? { id: rule.id, value: rule.value } : null };
  }
}

// ---- channels (shared) ------------------------------------------------------------------

/** `text`, escaped, with every occurrence of one of `words` (lower case) marked. */
function hl(text, words = []) {
  const t = String(text ?? '');
  const lower = t.toLowerCase();
  const marks = new Array(t.length).fill(false);
  for (const w of words) {
    for (let i = w ? lower.indexOf(w) : -1; i >= 0; i = lower.indexOf(w, i + 1)) marks.fill(true, i, i + w.length);
  }
  let out = '';
  let open = false;
  for (let i = 0; i < t.length; i += 1) {
    if (marks[i] !== open) { out += marks[i] ? '<mark>' : '</mark>'; open = marks[i]; }
    out += esc(t[i]);
  }
  return open ? `${out}</mark>` : out;
}

/**
 * A channel's name as people know it: on Teams the team first (`acme-support › Main`), since a
 * Teams team has many channels called Main or General; on Slack `#name`.
 */
function channelName(c, words) {
  if (c.source === 'teams') {
    return `${c.groupName ? `${hl(c.groupName, words)} <span class="sep">›</span> ` : ''}${hl(c.name || c.channelId, words)}`;
  }
  return `#${hl(c.name || c.channelId, words)}`;
}
const platform = (c) => ({ teams: 'Teams', discord: 'Discord' }[c.source] || `Slack${c.shared ? ' Connect' : ''}`);
const pct = (p) => `${Math.round((p || 0) * 100)}%`;
/** Clef's pick for a channel, as a tag. */
function clefTag(clef, here) {
  if (!clef) return '';
  const kind = clef.kind && clef.kind !== 'channel' ? ` · ${esc(clef.kind)}` : '';
  const title = `Clef: ${clef.team === 'none' ? 'no ops team' : teamLabel(clef.team)} (${pct(clef.p)}), ${clef.kind || '?'} (${pct(clef.kindP)})`;
  if (here !== undefined) {
    return `<span class="tag clef${here >= 0.5 ? ' yes' : ''}" title="${esc(title)}">Clef ${pct(here)}${kind}</span>`;
  }
  return `<span class="tag clef" title="${esc(title)}">Clef: ${esc(clef.team === 'none' ? 'none' : teamLabel(clef.team))} ${pct(clef.p)}${kind}</span>`;
}

/**
 * Places a picker's list below its field, or above it when there is not enough room below
 * (the field is at the bottom of the page), and no taller than the room there is.
 */
function placePicks(input, picks) {
  const r = input.getBoundingClientRect();
  const below = window.innerHeight - r.bottom - 16;
  const above = r.top - document.querySelector('header').getBoundingClientRect().bottom - 16;
  const up = below < 240 && above > below;
  picks.classList.toggle('up', up);
  picks.style.maxHeight = `${Math.max(120, Math.min(360, up ? above : below))}px`;
}

/** The channels card: a table (redrawn on its own) and a picker that assigns one here. */
function channelsCard(target) {
  return `<div class="card"><h2>Channels</h2><div id="channelsTable"></div>
    <div class="form picker"><input id="pick" class="grow" placeholder="${target === 'team' ? 'Add a channel to this team' : 'Assign a channel here by hand'}: search by channel, Teams team, customer or id" autocomplete="off" aria-label="${target === 'team' ? 'Add a channel' : 'Assign a channel'}"><div class="picks" id="picks" hidden></div></div>
    <p class="hint">${target === 'team'
    ? `A channel has one team it is filed under (its folders, knowledge base and agents) and can be shared with more, whose inboxes have it too. Adding a channel ${esc(teamLabel('admin'))} holds files it under this team whatever the rules say (a channel-id rule with priority 10); adding one another team holds shares it with this team, and it stays where it is.${state.view.value !== 'admin' ? ` <b>→ ${esc(teamLabel('admin'))}</b> hands a channel back to the admin team.` : ''}`
    : 'A manual assignment files one channel under this org whatever the rules say (a channel-id rule with priority 10).'}</p></div>`;
}

/**
 * Assigns a channel (as the API listed it) to the open team or org by hand, or to another
 * `value`, and updates the page.
 */
async function assignHere(c, value = state.view.value) {
  const { target } = state.view;
  const { channelId, source } = c;
  const res = await ruleChange('POST', '/api/admin/assign', { target, value, channelId, source });
  if (!res) return null;
  if (res.shared) {
    // Another team holds it: shared with this one, filed where it is.
    const rows = state.view.channels.filter((x) => x.channelId === channelId);
    for (const row of rows) row.sharedWith = [...new Set([...(row.sharedWith || []), value])];
    if (!rows.length && value === state.view.value) {
      state.view.channels.unshift({ ...c, sharedWith: [...(c.sharedWith || []), value], manual: c.manual || { team: null, org: null } });
    }
    if (res.shared.added) {
      const row = state.teams.find((t) => t.slug === value);
      if (row) row.shared = (row.shared || 0) + 1;
    }
    status('ok', `Shared: ${c.name || channelId} is in ${teamLabel(value)}'s inbox too, and stays filed under ${teamLabel(res.shared.from)}.`);
  }
  applyMoves(res.moves);
  // A channel that came here: what the move does not say about it.
  for (const row of state.view.channels.filter((x) => x.channelId === channelId)) {
    row.groupName = row.groupName || c.groupName || null;
    row.shared = row.shared ?? c.shared;
    row.latest = row.latest || c.latest || null;
    row.orgName = row.orgName || c.orgName || null;
  }
  // Already here by rule: no move, but now by hand. A channel the API did not move
  // (no threads yet) shows up once something is filed.
  if (value === state.view.value && !res.shared) setManual(channelId, res.rule);
  if (state.view.suggestions) state.view.suggestions = state.view.suggestions.filter((x) => x.channelId !== channelId);
  renderChannels();
  if ($('suggestTable')) renderSuggestions();
  renderList();
  return res;
}

function renderChannels() {
  const { target, channels } = state.view;
  const other = target === 'team' ? 'org' : 'team';
  // On the admin team's page, Clef's pick for each channel, to hand it to that team.
  const triage = target === 'team' && state.view.value === 'admin' && channels.some((c) => c.clef);
  // On another team's page, a way to hand a channel back to the admin team.
  const back = target === 'team' && state.me.admin && state.view.value !== 'admin'
    && state.teams.some((t) => t.slug === 'admin');
  const rows = channels.map((c) => {
    const manual = c.manual[target];
    const shares = c.sharedWith || [];
    // On a team's page, a channel another team holds and shares with this one.
    const sharedHere = target === 'team' && c.team !== state.view.value && shares.includes(state.view.value);
    const also = shares.filter((t) => t !== state.view.value);
    const alsoTag = target === 'team' && also.length
      ? ` <span class="tag" title="Shared: in these teams' inboxes too">also ${esc(also.map(teamLabel).join(', '))}</span>` : '';
    const teamCell = `${esc(teamLabel(c.team))}${shares.length ? ` <span class="tag" title="Shared: in these teams' inboxes too">+ ${esc(shares.map(teamLabel).join(', '))}</span>` : ''}`;
    const pick = triage && c.clef && c.clef.team !== 'none' && c.clef.team !== 'admin' && state.teams.some((t) => t.slug === c.clef.team) ? c.clef.team : null;
    return `<tr><td>${channelName(c)}<div class="sub">${esc(platform(c))} · <span class="mono">${esc(c.channelId)}</span></div></td>
      <td>${other === 'org' ? esc(orgLabel(c.org)) : teamCell}${c.kind !== 'channel' ? ` <span class="tag">${esc(c.kind)}</span>` : ''}${alsoTag}</td>
      <td class="n">${c.threads}</td><td class="sub">${esc(ago(c.latest))}</td>
      ${triage ? `<td class="nw">${clefTag(c.clef)}${pick ? ` <button class="link" data-give="${esc(c.channelId)}" data-source="${esc(c.source)}" data-team="${esc(pick)}" title="Assign it to ${esc(teamLabel(pick))} by hand">→ ${esc(teamLabel(pick))}</button>` : ''}</td>` : ''}
      <td class="nw">${sharedHere ? `<span class="tag manual" title="Filed under ${esc(teamLabel(c.team))}, and in this team's inbox too">shared by ${esc(teamLabel(c.team))}</span>
        ${state.me.admin ? `<button class="link" data-unshare="${esc(c.channelId)}" data-source="${esc(c.source)}" title="Take it out of this team's inbox; it stays filed under ${esc(teamLabel(c.team))}">remove</button>` : ''}`
    : `${manual ? `<span class="tag manual" title="Assigned by hand, whatever the rules say">manual</span>
        ${state.me.admin ? `<button class="link" data-unassign="${esc(c.channelId)}" data-source="${esc(c.source)}">undo</button>` : ''}` : '<span class="sub">by rule</span>'}
        ${back && c.team !== 'admin' ? ` <button class="link" data-give="${esc(c.channelId)}" data-source="${esc(c.source)}" data-team="admin" title="Move it back to ${esc(teamLabel('admin'))}: assigned there by hand, whatever the rules say">→ ${esc(teamLabel('admin'))}</button>` : ''}`}</td></tr>`;
  }).join('');
  $('channelsTable').innerHTML = rows
    ? `<table><tr><th>Channel</th><th>${other === 'org' ? 'Org' : 'Team'}</th><th>Threads</th><th>Latest</th>${triage ? '<th>Clef suggests</th>' : ''}<th></th></tr>${rows}</table>`
    : '<div class="empty">No channel is filed here.</div>';
  for (const b of $('channelsTable').querySelectorAll('[data-unassign]')) {
    b.onclick = async () => {
      const res = await ruleChange('DELETE', '/api/admin/assign', { target, channelId: b.dataset.unassign, source: b.dataset.source });
      if (!res) return;
      setManual(b.dataset.unassign, null);
      applyMoves(res.moves);
      renderChannels();
      renderList();
    };
  }
  for (const b of $('channelsTable').querySelectorAll('[data-give]')) {
    b.onclick = () => assignHere(channels.find((c) => c.channelId === b.dataset.give), b.dataset.team);
  }
  for (const b of $('channelsTable').querySelectorAll('[data-unshare]')) {
    b.onclick = async () => {
      const team = state.view.value;
      const c = channels.find((x) => x.channelId === b.dataset.unshare);
      const res = await call('/api/admin/share', 'DELETE', { team, channelId: c.channelId, source: c.source });
      if (!res.ok) { status('err', res.body.error || `Failed (${res.status}).`); return; }
      state.view.channels = state.view.channels.filter((x) => x.channelId !== c.channelId);
      const row = state.teams.find((t) => t.slug === team);
      if (row) row.shared = Math.max(0, (row.shared || 0) - 1);
      status('ok', `${c.name || c.channelId} is out of ${teamLabel(team)}'s inbox; it stays filed under ${teamLabel(c.team)}.`);
      renderChannels();
      renderList();
    };
  }
}

/**
 * The picker that assigns a channel here: finds channels by channel name, Teams team name,
 * customer (slug or display name) or id; every word has to match. Each row says where the
 * channel is, its customer, where it is filed and how busy it is, with the matches marked.
 * Arrow keys and Enter pick, Escape closes.
 */
function wireChannelPicker() {
  const { target, value } = state.view;
  let timer;
  let list = [];
  let at = 0;
  let words = [];
  const input = $('pick');
  const picks = $('picks');
  const pickIt = async (c) => {
    picks.hidden = true;
    input.value = '';
    list = [];
    await assignHere(c);
  };
  const render = () => {
    picks.innerHTML = list.map((c, i) => {
      const match = c.match || [];
      const org = c.org && !c.org.startsWith('_') ? (c.orgName || c.org) : '';
      // The org's slug only when the search found it there and not in the display name.
      const slug = c.orgName && match.includes('org') && !match.includes('orgName') ? ` <span class="mono">${hl(c.org, words)}</span>` : '';
      const id = match.length === 1 && match[0] === 'channelId' ? ` · id <span class="mono">${hl(c.channelId, words)}</span>` : '';
      const here = c[target] === value;
      // Adding a team to a channel another team holds shares it; one the admin team holds moves.
      const shares = target === 'team' && !here && !isHolding(c.team) && !isHolding(value);
      return `<div class="row pickrow${i === at ? ' on' : ''}" data-i="${i}">
        <span class="name"><span class="ch">${channelName(c, words)}</span>
          <span class="sub">${esc(platform(c))}${org ? ` · customer <b>${hl(org, words)}</b>${slug}` : ''}${id}
          · ${c.threads} thread${c.threads === 1 ? '' : 's'}${c.latest ? `, ${esc(ago(c.latest))}` : ''}</span></span>
        <span class="where">${here ? '<span class="tag manual">here by rule</span>' : `<span class="sub">now in</span> ${esc(teamLabel(c.team))}${target === 'org' ? ` / ${esc(orgLabel(c.org))}` : ''}${shares ? '<br><span class="sub" title="It stays filed under its team, and is in this team\'s inbox too">shares it here</span>' : ''}`}
          ${target === 'team' && c.clef ? `<br>${clefTag(c.clef, c.clef.teams[value] ?? 0)}` : ''}</span></div>`;
    }).join('') || '<div class="empty" style="padding:8px">No channel matches.</div>';
    picks.hidden = false;
    placePicks(input, picks);
    for (const el of picks.querySelectorAll('[data-i]')) {
      el.onmousedown = (e) => { e.preventDefault(); pickIt(list[Number(el.dataset.i)]); };
    }
    const on = picks.querySelector('.on');
    if (on) on.scrollIntoView({ block: 'nearest' });
  };
  input.oninput = () => {
    clearTimeout(timer);
    const q = input.value.trim();
    if (!q) { picks.hidden = true; list = []; return; }
    timer = setTimeout(async () => {
      const r = await call(`/api/admin/channels?q=${encodeURIComponent(q)}`);
      if (input.value.trim() !== q) return;
      words = q.toLowerCase().split(/\s+/).filter(Boolean);
      const seen = new Set();
      list = (r.body.channels || []).filter((c) => c[target] !== value || !c.manual[target])
        .filter((c) => target !== 'team' || !(c.sharedWith || []).includes(value))
        .filter((c) => !seen.has(c.channelId) && seen.add(c.channelId));
      at = 0;
      render();
    }, 200);
  };
  input.onkeydown = (e) => {
    if (picks.hidden || !list.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      at = (at + (e.key === 'ArrowDown' ? 1 : list.length - 1)) % list.length;
      render();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      pickIt(list[at]);
    } else if (e.key === 'Escape') {
      picks.hidden = true;
    }
  };
  input.onblur = () => setTimeout(() => { picks.hidden = true; }, 200);
}

// ---- suggested channels -------------------------------------------------------------------

const CLEF_SHOWN = 10;

/** One suggested channel: where it is, who of the team is active in it, what Clef says. */
function suggestionRow(c, total) {
  const org = c.org && !c.org.startsWith('_') ? (c.orgName || c.org) : '';
  const who = c.people.map((p) => {
    const did = [p.posted ? `${p.posted} post${p.posted === 1 ? '' : 's'}` : '', p.reacted ? `${p.reacted} reaction${p.reacted === 1 ? '' : 's'}` : '', p.member ? 'member' : '']
      .filter(Boolean).join(', ');
    // The rank weighs each person down by how many of the admin team's channels they are in.
    const where = p.channels && total ? `; active in ${p.channels} of the admin team's ${total} channels, weight ${p.weight}` : '';
    return `<span class="person" title="${esc(did + where)}">${esc(p.name)}<span class="sub"> · ${esc(did)}</span></span>`;
  }).join('');
  return `<tr><td>${channelName(c)}<div class="sub">${esc(platform(c))}${org ? ` · customer <b>${esc(org)}</b>` : ''}${c.topic ? ` · <span title="${esc(c.topic)}">${esc(c.topic.length > 80 ? `${c.topic.slice(0, 80)}…` : c.topic)}</span>` : ''}</div></td>
    <td>${who || '<span class="sub">nobody yet</span>'}</td>
    <td>${c.clef ? clefTag(c.clef, c.clef.here) : '<span class="sub">not yet</span>'}</td>
    <td class="n">${c.threads}</td><td class="sub">${esc(ago(c.latest))}</td>
    <td><button data-add="${esc(c.channelId)}" data-source="${esc(c.source)}">Add</button></td></tr>`;
}

function renderSuggestions() {
  const { suggestions = [], coverage, showAllClef } = state.view;
  const active = suggestions.filter((c) => c.people.length);
  const clefOnly = suggestions.filter((c) => !c.people.length);
  const shown = showAllClef ? clefOnly : clefOnly.slice(0, CLEF_SHOWN);
  const row = (c) => suggestionRow(c, coverage && coverage.channels);
  const head = '<tr><th>Channel</th><th>Active here from this team</th><th>Clef</th><th>Threads</th><th>Latest</th><th></th></tr>';
  const none = '<tr><td colspan="6" class="sub">No member of this team posts, reacts or is a member in a channel the admin team holds.</td></tr>';
  const table = suggestions.length ? `<table>${head}${active.length ? active.map(row).join('') : none}
    ${clefOnly.length ? `<tr class="section"><td colspan="6">Clef also suggests, though nobody from this team is active there</td></tr>${shown.map(row).join('')}` : ''}</table>
    ${clefOnly.length > shown.length ? `<button class="link" id="sMore">Show ${clefOnly.length - shown.length} more</button>` : ''}`
    : '<div class="empty">No channel of the admin team has members of this team in it, and Clef suggests none.</div>';
  $('suggestTable').innerHTML = `${table}
    ${coverage ? `<p class="hint">Of the admin team's ${coverage.channels} channels, Clef has classified ${coverage.classified} and the members of ${coverage.membersListed} are listed; the cron does a batch every 20 minutes.
      ${coverage.classified < coverage.channels ? '<button class="link" id="sClassify">Classify a batch now</button>' : ''}</p>` : ''}`;
  for (const b of $('suggestTable').querySelectorAll('[data-add]')) {
    b.onclick = async () => {
      b.disabled = true;
      const c = state.view.suggestions.find((x) => x.channelId === b.dataset.add);
      if (!(await assignHere(c))) b.disabled = false;
    };
  }
  if ($('sMore')) $('sMore').onclick = () => { state.view.showAllClef = true; renderSuggestions(); };
  if ($('sClassify')) {
    $('sClassify').onclick = async () => {
      $('sClassify').disabled = true;
      status('', 'Clef is classifying a batch of channels…');
      const r = await call('/api/admin/classify', 'POST', { limit: 10 });
      if (!r.ok) { status('err', r.body.error || `Failed (${r.status}).`); $('sClassify').disabled = false; return; }
      status('ok', `Classified ${r.body.classified} channel${r.body.classified === 1 ? '' : 's'}; ${r.body.pending} to go.`);
      const t = await call(`/api/admin/team?slug=${encodeURIComponent(state.view.value)}`);
      if (t.ok && state.view.value === t.body.team.slug) {
        Object.assign(state.view, { suggestions: t.body.suggestions, coverage: t.body.coverage });
        renderSuggestions();
      }
    };
  }
}

const EMAIL = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

function renderMembers() {
  const { members, team } = state.view;
  const role = (m) => {
    if (team.self_managed) return '<span class="tag manual" title="Every member of a self-managed team is a team manager">manager</span>';
    return m.role === 'manager'
      ? `<span class="tag manual">manager</span> <button class="link" data-role="member" data-person="${m.id}" title="Back to member">demote</button>`
      : `<button class="link" data-role="manager" data-person="${m.id}" title="May add and remove members and edit the team's knowledge base">make manager</button>`;
  };
  $('membersTable').innerHTML = members.length
    ? `<table><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr>${members.map((m) => `<tr>
      <td>${esc(m.name || '')}${m.staff ? '' : ' <span class="tag vendor" title="Not marked as Adobe staff">not staff</span>'}</td><td class="mono">${esc(m.email)}</td>
      <td>${role(m)}</td>
      <td><button class="link" data-remove="${m.id}" style="color:var(--red)">remove</button></td></tr>`).join('')}</table>`
    : '<div class="empty">Nobody yet.</div>';
  for (const b of $('membersTable').querySelectorAll('[data-role]')) {
    b.onclick = async () => {
      const m = members.find((x) => String(x.id) === b.dataset.person);
      const res = await call('/api/admin/members', 'PUT', { team: team.slug, person: m.id, role: b.dataset.role });
      if (!res.ok) { status('err', res.body.error); return; }
      m.role = res.body.role;
      status('ok', `${m.name || m.email} is ${m.role === 'manager' ? 'a team manager now' : 'a member again'}.`);
      renderMembers();
    };
  }
  for (const b of $('membersTable').querySelectorAll('[data-remove]')) {
    b.onclick = async () => {
      const m = members.find((x) => String(x.id) === b.dataset.remove);
      if (!(await ask(`Remove ${m.name || m.email} from ${team.name}?`, '', 'Remove', { danger: true }))) return;
      const res = await call('/api/admin/members', 'DELETE', { team: team.slug, person: m.id });
      if (!res.ok) { status('err', res.body.error); return; }
      state.view.members = state.view.members.filter((x) => x.id !== m.id);
      const row = state.teams.find((t) => t.slug === team.slug);
      if (row) row.members -= 1;
      status('ok', `Removed ${m.name || m.email}.`);
      renderMembers();
      renderList();
    };
  }
}

/**
 * Adding a member: one field that finds people by name or email (people opspile knows, and
 * platform accounts that posted), staff first; an email nobody has yet can be added as is.
 * Arrow keys and Enter pick, Escape closes. The field keeps the focus for the next one.
 */
function wireMemberPicker() {
  const slug = state.view.team.slug;
  const input = $('mFind');
  const picks = $('mPicks');
  let timer;
  let list = [];
  let at = 0;
  const add = async (p) => {
    picks.hidden = true;
    input.value = '';
    const res = await call('/api/admin/members', 'POST', { team: slug, email: p.email, name: p.name || undefined });
    if (!res.ok) { status('err', res.body.error); return; }
    const { person } = res.body;
    const had = state.view.members.find((m) => m.id === person.id);
    if (had) had.role = person.role;
    if (!had) {
      state.view.members.push(person);
      state.view.members.sort((a, b) => String(a.name || a.email).localeCompare(String(b.name || b.email)));
      const row = state.teams.find((t) => t.slug === slug);
      if (row) row.members += 1;
    }
    status('ok', `Added ${person.name || person.email}.`);
    renderMembers();
    renderList();
    input.focus();
  };
  const render = () => {
    picks.innerHTML = list.map((p, i) => `<div class="row${i === at ? ' on' : ''}" data-i="${i}">
      <span class="name">${p.name ? esc(p.name) : `<i>${esc(p.email)}</i>`} ${p.name ? `<span class="sub mono">${esc(p.email)}</span>` : ''}</span>
      ${p.new ? '<span class="tag">new person</span>' : ''}${p.staff ? '' : '<span class="tag vendor">not staff</span>'}
      ${p.teams && p.teams.length ? `<span class="sub">${esc(p.teams.map(teamLabel).join(', '))}</span>` : ''}</div>`).join('')
      || '<div class="empty" style="padding:8px">Nobody matches. Type a full email address to add someone new.</div>';
    picks.hidden = false;
    placePicks(input, picks);
    for (const el of picks.querySelectorAll('[data-i]')) {
      el.onmousedown = (e) => { e.preventDefault(); add(list[Number(el.dataset.i)]); };
    }
  };
  input.oninput = () => {
    clearTimeout(timer);
    const q = input.value.trim();
    if (q.length < 2) { picks.hidden = true; list = []; return; }
    timer = setTimeout(async () => {
      const r = await call(`/api/admin/people?team=${encodeURIComponent(slug)}&q=${encodeURIComponent(q)}`);
      if (input.value.trim() !== q) return;
      list = r.body.people || [];
      const email = q.toLowerCase();
      if (EMAIL.test(email) && !list.some((p) => p.email === email)) {
        list.push({ email, name: null, new: true, staff: true });
      }
      at = 0;
      render();
    }, 150);
  };
  input.onkeydown = (e) => {
    if (picks.hidden || !list.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      at = (at + (e.key === 'ArrowDown' ? 1 : list.length - 1)) % list.length;
      render();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      add(list[at]);
    } else if (e.key === 'Escape') {
      picks.hidden = true;
    }
  };
  input.onblur = () => setTimeout(() => { picks.hidden = true; }, 150);
}

const escapeRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
/** The prefix a pattern stands for (`^aem-` → `aem-`), or null for any other expression. */
function prefixOf(pattern) {
  const m = /^\^((?:\\.|[^\\.*+?()[\]{}|$^])*)$/.exec(pattern || '');
  return m ? m[1].replace(/\\(.)/g, '$1') : null;
}
function describe(r) {
  const prefix = prefixOf(r.pattern);
  return prefix !== null ? `starts with <code>${esc(prefix)}</code>` : `matches <code>${esc(r.pattern)}</code>`;
}

function ruleRow(r) {
  return `<tr data-rule="${r.id}"><td>${esc(FIELD_LABEL[r.field] || r.field)}</td><td>${describe(r)}</td>
    <td>${r.source ? `<span class="tag">${esc(r.source)} only</span>` : ''}</td>
    <td class="n">${r.priority}</td><td class="sub">${esc(r.note || '')}</td>
    <td><button class="link" data-edit="${r.id}">edit</button><button class="link" data-del="${r.id}" style="color:var(--red)">delete</button></td></tr>`;
}

function ruleForm(r = {}) {
  const prefix = r.pattern ? prefixOf(r.pattern) : '';
  const mode = prefix !== null ? 'prefix' : 'regex';
  return `<form class="form" id="ruleForm" data-id="${r.id || ''}">
    <select id="rField">${Object.entries(FIELD_LABEL).map(([k, v]) => `<option value="${k}"${(r.field || 'name') === k ? ' selected' : ''}>${v}</option>`).join('')}</select>
    <select id="rMode"><option value="prefix"${mode === 'prefix' ? ' selected' : ''}>starts with</option><option value="regex"${mode === 'regex' ? ' selected' : ''}>regular expression</option></select>
    <input id="rPattern" class="grow mono" placeholder="aem-" value="${esc(mode === 'prefix' ? prefix : r.pattern)}" required>
    <select id="rSource"><option value="">Every platform</option><option value="slack"${r.source === 'slack' ? ' selected' : ''}>Slack only</option><option value="teams"${r.source === 'teams' ? ' selected' : ''}>Teams only</option><option value="discord"${r.source === 'discord' ? ' selected' : ''}>Discord only</option></select>
    <input id="rPriority" type="number" min="0" max="10000" value="${r.priority ?? 100}" style="width:80px" title="Priority: the lowest matching rule wins">
    <input id="rNote" placeholder="Note" value="${esc(r.note || '')}">
    <button class="primary">${r.id ? 'Save rule' : 'Add rule'}</button>${r.id ? '<button type="button" id="rCancel">Cancel</button>' : ''}
  </form>`;
}

/** The team's own rules (not manual assignments, which the channels card shows). */
const ownRules = () => state.view.rules.filter((x) => x.value === state.view.team.slug && x.field !== 'channel_id');

function renderRules() {
  const own = ownRules();
  $('rulesTable').innerHTML = own.length
    ? `<table><tr><th>Field</th><th>Pattern</th><th></th><th>Priority</th><th>Note</th><th></th></tr>${own.map(ruleRow).join('')}</table>`
    : '<div class="empty">No rule files channels under this team yet.</div>';
  for (const b of $('rulesTable').querySelectorAll('[data-edit]')) {
    b.onclick = () => {
      $('ruleSlot').innerHTML = ruleForm(state.view.rules.find((x) => String(x.id) === b.dataset.edit));
      wireRuleForm();
      $('rPattern').focus();
    };
  }
  for (const b of $('rulesTable').querySelectorAll('[data-del]')) {
    b.onclick = async () => {
      const res = await ruleChange('DELETE', '/api/admin/rules', { id: Number(b.dataset.del) });
      if (!res) return;
      state.view.rules = state.view.rules.filter((x) => x.id !== res.deleted);
      const row = state.teams.find((t) => t.slug === state.view.team.slug);
      if (row) row.rules -= 1;
      applyMoves(res.moves);
      renderRules();
      renderChannels();
      renderList();
    };
  }
}

function wireRuleForm() {
  const slug = state.view.team.slug;
  const reset = () => { $('ruleSlot').innerHTML = ruleForm(); wireRuleForm(); };
  $('ruleForm').onsubmit = async (e) => {
    e.preventDefault();
    const id = Number($('ruleForm').dataset.id) || null;
    const raw = $('rPattern').value.trim();
    const body = {
      ...(id ? { id } : {}),
      target: 'team',
      field: $('rField').value,
      pattern: $('rMode').value === 'prefix' ? `^${escapeRe(raw)}` : raw,
      value: slug,
      source: $('rSource').value || null,
      priority: Number($('rPriority').value),
      note: $('rNote').value,
    };
    const res = await ruleChange(id ? 'PUT' : 'POST', '/api/admin/rules', body);
    if (!res) return;
    if (id) {
      state.view.rules = state.view.rules.map((x) => (x.id === id ? res.rule : x));
    } else {
      state.view.rules.push(res.rule);
      const row = state.teams.find((t) => t.slug === slug);
      if (row) row.rules += 1;
    }
    applyMoves(res.moves);
    reset();
    renderRules();
    renderChannels();
    renderList();
  };
  if ($('rCancel')) $('rCancel').onclick = reset;
}

      <span><b>Self-managed</b>: every member is a team manager and may add and remove members and edit the team's knowledge base.</span></label>

    ${real ? `<div class="card"><h2>Members</h2><div id="membersTable"></div>
      <div class="form picker"><input id="mFind" class="grow" placeholder="Add a member: type a name or an email" autocomplete="off" aria-label="Add a member"><div class="picks" id="mPicks" hidden></div></div>

    ${admin ? `<div class="card"><h2>Rules</h2><div id="rulesTable"></div>
      <div id="ruleSlot">${ruleForm()}</div>
      <p class="hint">A channel goes to the team of the matching rule with the lowest priority. Example: channel name starts with <code>aem-</code>.</p>
      ${templates.length ? `<p class="hint">${templates.length} rule${templates.length === 1 ? '' : 's'} name the team from the match ($1) and may also apply.</p>` : ''}</div>` : ''}` : ''}
    ${admin ? channelsCard('team') : '<div class="card"><h2>Channels</h2><div id="channelsTable"></div><p class="hint">The admin team decides which channels a team gets.</p></div>'}
    ${suggestions ? `<div class="card"><h2>Suggested channels</h2>

  if (!r.ok) { $('detail').innerHTML = `<div class="empty">${esc(r.body.error)}</div>`; return; }

    target: 'org', value: slug, org, rules, channels,
  };
  $('detail').innerHTML = `
    <div class="title">${backButton()}<span id="oIco">${ico(org.icon)}</span><input class="big" id="oName" value="${esc(org.name || '')}" placeholder="${esc(org.slug)}" aria-label="Display name">
      <span class="sub mono">${esc(org.slug)}</span><button class="danger" id="oDelete" title="Forget the name, icon and type"${org.updated_at ? '' : ' hidden'}>Reset</button></div>

      ${rules.filter((x) => x.field !== 'channel_id' || x.note !== 'manual assignment').map((x) => `<tr><td>${esc(FIELD_LABEL[x.field] || x.field)}</td><td>${describe(x)}</td><td><code>${esc(x.value)}</code></td><td class="n">${x.priority}</td><td class="sub">${esc(x.note || '')}</td></tr>`).join('')}</table></div>` : ''}`;
  renderChannels();
  wireChannelPicker();
  const pressed = () => $('oType').querySelector('[aria-pressed="true"]')?.dataset.type || 'customer';
  /** Shows an org's fields as saved, without touching the field being typed in. */
  const show = (o) => {
    if (document.activeElement !== $('oName')) $('oName').value = o.name || '';
    if (document.activeElement !== $('oIcon')) $('oIcon').value = o.icon || '';
    for (const x of $('oType').querySelectorAll('[data-type]')) x.setAttribute('aria-pressed', String(x.dataset.type === o.type));
    $('oIco').innerHTML = ico(o.icon);
    $('oDelete').hidden = !o.updated_at;
    const row = state.orgs.find((x) => x.slug === slug);
    if (row) Object.assign(row, { name: o.name, icon: o.icon, type: o.type });
    renderList();
  };
  const save = async (patch) => {
    const now = {
      name: $('oName').value, icon: $('oIcon').value, type: pressed(), ...patch,
    };
    const res = await call('/api/admin/orgs', 'PUT', { slug, ...now });
    if (!res.ok) { status('err', res.body.error); return; }
    state.view.org = res.body.org;
    status('ok', 'Saved.');
    show(res.body.org);
  };
  $('oName').onchange = () => save();
  $('oIcon').onchange = () => save();
  for (const b of $('oType').querySelectorAll('[data-type]')) {
    b.onclick = () => {
      for (const x of $('oType').querySelectorAll('[data-type]')) x.setAttribute('aria-pressed', String(x === b));
      save({ type: b.dataset.type });
    };
  }
  $('oDelete').onclick = async () => {
    const o = state.view.org;
    if (!(await ask(`Forget the name, icon and type of ${o.name || o.slug}?`, '<p>Its channels stay where they are; it is shown by its slug again.</p>', 'Reset', { danger: true }))) return;
    const res = await call('/api/admin/orgs', 'DELETE', { slug });
    if (!res.ok) { status('err', res.body.error); return; }
    state.view.org = {
      slug, name: null, icon: null, type: 'customer', updated_at: null,
    };
    status('ok', 'Reset.');
    $('oName').value = '';
    $('oIcon').value = '';
    show(state.view.org);
  };
}

(async () => {
  const me = await call('/api/me');
  if (!me.ok) { $('list').innerHTML = `<div class="empty">${esc(me.body.error || 'Not signed in.')}</div>`; return; }
  state.me = me.body;
  renderUser(state.me);
  if (!state.me.admin && !state.me.manages?.length) {
    $('list').innerHTML = '<div class="empty">These pages are for the admin team and team managers.</div>';
    $('detail').innerHTML = '<div class="empty"><a href="/inbox">Back to the inbox</a></div>';
    return;
  }
  if (!(await load())) return;
  const q = new URLSearchParams(location.search);
  state.tab = q.get('tab') === 'orgs' && state.me.admin ? 'orgs' : 'teams';
  if (!state.me.admin) document.querySelector('nav [data-tab="orgs"]').hidden = true;
  for (const a of document.querySelectorAll('nav [data-tab]')) {
    a.onclick = (e) => { e.preventDefault(); switchTab(a.dataset.tab); };
  }
  $('detail').addEventListener('click', (e) => { if (e.target.closest('[data-back]')) unselect(); });
  switchTab(state.tab);
  const sel = q.get(state.tab === 'teams' ? 'team' : 'org');
  if (sel) select(sel);
})();
</script>
<script>
// Installable app (see src/pwa.js): the service worker only answers page loads made offline.
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
</html>
