<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>opspile</title>
<style>
  :root {
    --bg: #0f1114; --col: #15181c; --card: #1a1e23; --line: #2a2f36; --hover: #20252b;
    --ink: #e8eaed; --mute: #8b929b; --faint: #5d646d;
    --accent: #5aa2ff; --link: #7cc0ff; --sel: #1f2a38;
    --red: #e5534b; --yellow: #d4a72c; --green: #57ab5a;
    --me: #2f7cf6; --me-ink: #fff; --me-link: #fff;
    --them: #2b3037; --them-ink: #e8eaed;
    --code: #0b0d10;
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; color: var(--ink);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eceef1; --col: #f6f7f9; --card: #fff; --line: #dfe2e6; --hover: #eef1f5;
      --ink: #1d2025; --mute: #616a75; --faint: #9aa1aa; --accent: #1f6feb; --link: #0b5cc4;
      --sel: #dde9fb; --them: #e9ebee; --them-ink: #1d2025; --code: #f3f4f6;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { margin: 0; background: var(--bg); display: flex; flex-direction: column; }
  button, select { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line);
    border-radius: 7px; padding: 3px 9px; cursor: pointer; }
  header { display: flex; gap: 12px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0 6px 0 0; letter-spacing: .02em; }
  header .me { margin-left: auto; color: var(--mute); }
  #review[aria-pressed="true"] { background: var(--sel); border-color: var(--accent); }
  .live { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; }
  .live.on { background: var(--green); }
  main { flex: 1; display: grid; grid-template-columns: 270px minmax(380px, 34%) 1fr; min-height: 0; }
  main > section { overflow: auto; min-height: 0; overscroll-behavior: contain; }

  /* Filters: one card per facet, as in klickhaus. */
  #filters { padding: 12px; background: var(--bg); display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 8px; }
  .card h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 14px; }
  .card h3::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .card h3 .clear { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--mute); cursor: pointer; }
  .card h3 .clear:hover { color: var(--ink); }
  .fr { display: grid; grid-template-columns: 4px 18px 1fr auto 56px; gap: 6px; align-items: center;
    padding: 4px 4px; border-radius: 6px; cursor: pointer; }
  .fr:hover { background: var(--hover); }
  .fr.on { background: var(--sel); }
  .fr .ind { width: 3px; height: 16px; border-radius: 2px; background: var(--faint); }
  .fr .ico { width: 16px; height: 16px; border-radius: 3px; }
  .fr .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fr .lab.dim { color: var(--faint); }
  .fr .n { font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--mute); text-align: right; }
  .fr .bar { height: 7px; border-radius: 4px; background: var(--faint); min-width: 2px; }
  .fr .bar.stack { display: flex; overflow: hidden; background: none; gap: 1px; }
  .fr .bar.stack i { display: block; height: 100%; min-width: 2px; }
  .c-red { background: var(--red) !important; } .c-yellow { background: var(--yellow) !important; }
  .c-green { background: var(--green) !important; } .c-none { background: var(--faint) !important; }
  .c-accent { background: var(--accent) !important; }

  /* Threads: fixed-height rows, two lines, as in Apple Mail. */
  #threads { background: var(--col); border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  #threads .count { padding: 8px 14px; color: var(--mute); font-size: 12px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--col); z-index: 1; }
  .t { height: 64px; padding: 9px 14px 0 12px; border-bottom: 1px solid var(--line); cursor: pointer;
    display: grid; grid-template-rows: 22px 24px; row-gap: 2px; }
  .t:hover { background: var(--hover); }
  .t.sel { background: var(--sel); }
  .t .l1, .t .l2 { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .t .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; }
  .t .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t.unread .title { font-weight: 650; }
  .t .when { flex: none; color: var(--mute); font-size: 12px; }
  .t .l2 { padding-left: 17px; font-size: 12px; color: var(--mute); }
  .t .cust { display: flex; align-items: center; gap: 5px; max-width: 34%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .t .cust img { width: 14px; height: 14px; border-radius: 3px; flex: none; }
  .faces { display: flex; flex: none; }
  .faces .av { width: 20px; height: 20px; font-size: 9px; margin-left: -5px; border: 2px solid var(--col); border-radius: 50%; }
  .faces .av:first-child { margin-left: 0; }
  .t .replies { flex: none; }
  .moods { display: flex; flex: none; }
  .moods .em { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px;
    background: var(--card); border: 2px solid var(--col); margin-left: -5px; }
  .moods .em:first-child { margin-left: 0; }
  #threads .count { display: flex; align-items: center; }
  #threads .count .sort { margin-left: auto; display: flex; gap: 4px; }
  #threads .count .sort button { font-size: 11px; padding: 1px 8px; }
  #threads .count .sort button[aria-pressed="true"] { background: var(--sel); border-color: var(--accent); }
  .t .tags { margin-left: auto; display: flex; gap: 4px; overflow: hidden; flex-shrink: 1; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 9px; border: 1px solid var(--line); white-space: nowrap; color: var(--mute); }
  .tag.hot { color: var(--red); border-color: var(--red); }
  .tag.us { color: var(--yellow); border-color: var(--yellow); }
  .t .dot { --ring: var(--faint); }
  .t .dot.c-red { --ring: var(--red); } .t .dot.c-yellow { --ring: var(--yellow); } .t .dot.c-green { --ring: var(--green); }
  .t .dot.ring { box-shadow: 0 0 0 2px var(--col), 0 0 0 3.5px var(--ring); }
  .t.sel .dot.ring { box-shadow: 0 0 0 2px var(--sel), 0 0 0 3.5px var(--ring); }
  .t .dot.ring:not([class*="c-"]) { background: transparent; }
  .t.enter { animation: push-in .35s ease-out; overflow: hidden; }
  @keyframes push-in { from { height: 0; padding-top: 0; opacity: 0; } to { height: 64px; opacity: 1; } }
  .msg.enter, .sys.enter { animation: rise .35s ease-out; }
  @keyframes rise { from { transform: translateY(18px); opacity: 0; } to { transform: none; opacity: 1; } }
  .msg.pending .bubble { opacity: .55; }
  .post { display: flex; align-items: center; gap: 8px; color: var(--mute); font-size: 12px; margin: 18px 0 4px; }
  .post::before, .post::after { content: ""; flex: 1; border-top: 1px dashed var(--line); }
  .composer { flex: none; border-top: 1px solid var(--line); padding: 10px 22px 12px; display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea { flex: 1; resize: none; min-height: 38px; max-height: 180px; font: inherit; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 19px; padding: 8px 14px; outline: none; }
  .composer textarea:focus { border-color: var(--accent); }
  .composer button.send { border-radius: 19px; padding: 7px 16px; background: var(--me); color: #fff; border: 0; }
  .composer button.send:disabled { opacity: .5; cursor: default; }
  .composer .connect { color: var(--mute); font-size: 13px; }
  .composer .connect a { color: var(--link); }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 14px; font-size: 13px; z-index: 10; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--mute); }
  .back { color: var(--link); text-decoration: none; font-size: 12px; white-space: nowrap; }
  .back:hover { text-decoration: underline; }

  .av { width: 36px; height: 36px; border-radius: 9px; flex: none; display: grid; position: relative;
    place-items: center; font-size: 13px; font-weight: 600; color: #fff; overflow: hidden; }
  .av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* Messages: bubbles, customers left, Adobe right. */
  #pane { display: flex; flex-direction: column; overflow: hidden; }
  #pane .scroller { flex: 1; overflow: auto; overscroll-behavior: contain; }
  .ph { padding: 12px 22px; border-bottom: 1px solid var(--line); background: var(--bg); flex: none; }
  .ph h2 { margin: 0 0 3px; font-size: 17px; display: flex; gap: 10px; align-items: baseline; }
  .ph .sub { color: var(--mute); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .ph .sub img { width: 14px; height: 14px; border-radius: 3px; }
  .ph .sub.stack { margin-top: 4px; }
  .tag.tech { color: var(--ink); }
  .feed { padding: 8px 22px 40px; }
  .day { text-align: center; margin: 18px 0 8px; }
  .day span { font-size: 12px; font-weight: 600; color: var(--mute); border: 1px solid var(--line); border-radius: 12px; padding: 3px 12px; }
  .divider { display: flex; align-items: center; gap: 10px; color: var(--mute); font-size: 12px; margin: 14px 0 6px; }
  .divider::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .msg { display: flex; gap: 10px; align-items: flex-end; margin-top: 10px; }
  .msg.cont { margin-top: 3px; }
  .msg .face { position: relative; flex: none; width: 36px; }
  .msg .face .badge-ico { position: absolute; right: -4px; bottom: -4px; width: 16px; height: 16px; border-radius: 4px;
    background: #fff; border: 2px solid var(--bg); }
  .msg.cont .face { visibility: hidden; height: 0; }
  .msg.adobe { flex-direction: row-reverse; }
  .msg .col { max-width: min(74%, 760px); display: flex; flex-direction: column; align-items: flex-start; }
  .msg.adobe .col { align-items: flex-end; }
  .msg .who { font-size: 12px; color: var(--mute); margin: 0 12px 3px; }
  .msg .who b { color: var(--ink); font-weight: 600; }
  .msg.cont .who { display: none; }
  .bubble { background: var(--them); color: var(--them-ink); padding: 8px 13px; border-radius: 18px;
    border-bottom-left-radius: 5px; overflow-wrap: anywhere; line-height: 1.5; }
  .msg.adobe .bubble { background: var(--me); color: var(--me-ink); border-bottom-left-radius: 18px; border-bottom-right-radius: 5px; }
  .bubble a { color: var(--link); text-decoration: underline; text-underline-offset: 2px; }
  .msg.adobe .bubble a { color: var(--me-link); }
  .bubble p { margin: 0; }
  .bubble p + p { margin-top: 8px; }
  .bubble code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: rgba(0,0,0,.25); padding: 1px 4px; border-radius: 4px; }
  .bubble pre { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); color: var(--ink);
    border: 1px solid var(--line); padding: 9px 11px; border-radius: 8px; overflow: auto; margin: 6px 0; white-space: pre-wrap; }
  .bubble blockquote { margin: 4px 0; padding-left: 10px; border-left: 3px solid currentColor; opacity: .85; }
  .bubble ul, .bubble ol { margin: 4px 0; padding-left: 20px; }
  .bubble img.att { display: block; max-width: 100%; max-height: 360px; border-radius: 10px; margin: 6px 0; }
  .bubble .mention { font-weight: 600; }
  .msg.deleted .bubble { font-style: italic; opacity: .6; }
  .msg .meta { font-size: 11px; color: var(--faint); margin: 3px 12px 0; min-height: 15px; }
  .msg .meta a { visibility: hidden; }
  .msg:hover .meta a { visibility: visible; }
  .msg .meta a { color: inherit; }
  .rx { display: flex; gap: 4px; flex-wrap: wrap; margin: 4px 6px 0; }
  .rx span { font-size: 13px; padding: 1px 8px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
  .sys { text-align: center; color: var(--faint); font-size: 12px; margin: 8px 0; }
  .seen { text-align: right; color: var(--faint); font-size: 11px; margin-top: 6px; }
  .empty { padding: 40px; color: var(--mute); text-align: center; }

  .rv .apply { display: flex; gap: 8px; margin-top: 8px; }
  .rv .apply .send { border-radius: 8px; padding: 3px 12px; background: var(--me); color: #fff; border: 0; }
  .rv .apply .send:disabled { opacity: .45; }
  .rv { position: sticky; top: 0; z-index: 3; box-shadow: 0 6px 16px rgba(0,0,0,.18); margin: 12px 22px 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); font-size: 13px; }
  .rv .q { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 3px 0; }
  .rv .q b { width: 86px; font-weight: 600; }
  .rv button { padding: 1px 8px; font-size: 12px; }
  .rv button.model { border-color: var(--accent); }
  .rv button.picked { background: var(--accent); color: #fff; }
  .rv .hist { color: var(--mute); font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>opspile</h1>
  <select id="team" aria-label="Team"></select>
  <button id="review" hidden aria-pressed="false" title="Review Clef labels (admin team)">Review labels</button>
  <span class="live" id="live" title="live updates"></span>
  <span class="me" id="me"></span>
  <span title="next / previous thread"><kbd>j</kbd> <kbd>k</kbd></span>
</header>
<main>
  <section id="filters" aria-label="Filters"></section>
  <section id="threads" aria-label="Threads"><div class="empty">Loading…</div></section>
  <section id="pane" aria-label="Messages"><div class="empty">Pick a thread.</div></section>
</main>
<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const state = {
  me: null, team: null, data: null, open: null, ws: null, review: null, answers: null,
  sel: { type: new Set(['conversation']) },
  order: [], prevKeys: null, shownIds: null, sending: [], sort: 'smart', scores: new Map(),
  cache: new Map(), staged: {},
};

// ---------------------------------------------------------------- helpers
async function get(path) {
  const res = await fetch(path, { credentials: 'same-origin' });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.status);
  return res.json();
}
function ago(iso) {
  if (!iso) return '';
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 60) return 'now';
  if (s < 3600) return `${Math.floor(s / 60)}m`;
  if (s < 86400) return `${Math.floor(s / 3600)}h`;
  if (s < 7 * 86400) return `${Math.floor(s / 86400)}d`;
  return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}
const clock = (iso) => new Date(iso).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
function dayLabel(iso) {
  const d = new Date(iso);
  const today = new Date(); const y = new Date(Date.now() - 86400000);
  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
}
const platform = (t) => (t.source === 'slack' ? 'Slack' : 'Teams');
const lastOf = (t) => (t.kind === 'alert' ? t.any_at : t.last_at);
const favicon = (domain) => `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64`;
const backlink = (t, label) => (t.permalink
  ? `<a class="back" href="${esc(t.permalink)}" target="_blank" rel="noopener" title="Open in ${platform(t)}">${esc(label || `↗ ${platform(t)}`)}</a>` : '');

const COLORS = ['#c2410c', '#0f766e', '#7c3aed', '#be185d', '#1d4ed8', '#4d7c0f', '#a16207', '#0e7490'];
function hue(name) { let h = 0; for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
const initials = (name) => String(name || '?').replace(/\(.*?\)/g, '').split(/[\s,]+/).filter(Boolean).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
// Initials underneath, the picture on top: while a picture loads (or when Gravatar has
// none and answers 404), the initials show instead of a blank.
function avatar(name, url, cls = '') {
  const img = url ? `<img src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
  return `<span class="av ${cls}" style="background:${hue(name)}" title="${esc(name)}">${esc(initials(name))}${img}</span>`;
}

// Slack names and Teams types to characters. Anything else is shown by name.
const EMOJI = {
  thumbsup: '👍', '+1': '👍', thumbsdown: '👎', '-1': '👎', like: '👍', heart: '❤️', laugh: '😆', surprised: '😮',
  sad: '😢', angry: '😠', eyes: '👀', white_check_mark: '✅', heavy_check_mark: '✔️', x: '❌', tada: '🎉',
  pray: '🙏', raised_hands: '🙌', clap: '👏', rocket: '🚀', fire: '🔥', joy: '😂', smile: '😄', slightly_smiling_face: '🙂',
  wink: '😉', thinking_face: '🤔', 100: '💯', ok_hand: '👌', warning: '⚠️', rotating_light: '🚨', bug: '🐛',
  wave: '👋', muscle: '💪', sparkles: '✨', star: '⭐', point_up: '☝️', point_right: '👉', see_no_evil: '🙈',
  sweat_smile: '😅', grinning: '😀', confused: '😕', facepalm: '🤦', face_palm: '🤦', hourglass: '⌛', 'heavy_plus_sign': '➕',
  rofl: '🤣', heart_eyes: '😍', partying_face: '🥳', saluting_face: '🫡', ack: '✅', done: '✅', yes: '✅', no: '❌',
  thank_you: '🙏', thanks: '🙏', 'blush': '😊', 'cry': '😢', 'sob': '😭', 'scream': '😱', 'zap': '⚡',
};
const emoji = (name) => EMOJI[name] || EMOJI[String(name).replace(/::skin-tone-\d/, '')] || (/^\p{Extended_Pictographic}/u.test(name) ? name : `:${name}:`);

// A safe markdown subset: escape first, then format. Images from Slack and Teams go
// through the inbox's media proxy, which adds the platform's credentials.
const proxied = (u) => (/^https:\/\/(files\.slack\.com|graph\.microsoft\.com)\//.test(u) ? `/api/media?u=${encodeURIComponent(u)}` : u);
function inline(s) {
  return s
    .replace(/!\[([^\]\n]*)\]\((https:\/\/[^)\s]+)\)/g, (_, alt, u) => `<img class="att" src="${esc(proxied(u.replace(/&amp;/g, '&')))}" alt="${alt}" loading="lazy">`)
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(>])\*([^*\n]+)\*(?=[\s).,!?:;<]|$)/g, '$1<em>$2</em>')
    .replace(/~~([^~\n]+)~~/g, '<del>$1</del>')
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/&lt;(https?:\/\/[^\s&]+)&gt;/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
    .replace(/(^|\s)(@[\p{L}][\p{L}.' -]{0,40}?[\p{L}])(?=[\s,.:;!?]|$)/gu, '$1<span class="mention">$2</span>')
    .replace(/:([a-z0-9_+-]+):/g, (m, n) => (EMOJI[n] ? EMOJI[n] : m));
}
function md(src) {
  return String(src || '').split(/```/).map((b, i) => {
    if (i % 2) return `<pre>${esc(b.replace(/^\n|\n$/g, ''))}</pre>`;
    return esc(b).split(/\n{2,}/).map((para) => {
      const lines = para.split('\n');
      if (lines.every((l) => /^&gt; ?/.test(l))) return `<blockquote>${inline(lines.map((l) => l.replace(/^&gt; ?/, '')).join('<br>'))}</blockquote>`;
      if (lines.every((l) => /^[-*] /.test(l))) return `<ul>${lines.map((l) => `<li>${inline(l.slice(2))}</li>`).join('')}</ul>`;
      if (lines.every((l) => /^\d+\. /.test(l))) return `<ol>${lines.map((l) => `<li>${inline(l.replace(/^\d+\. /, ''))}</li>`).join('')}</ol>`;
      return para.trim() ? `<p>${inline(lines.join('<br>'))}</p>` : '';
    }).join('');
  }).join('');
}

// ---------------------------------------------------------------- facets
// Status: red = nobody at Adobe has seen it, or you were mentioned; yellow = a teammate was
// mentioned, or nobody on the team has seen it; green = only you have not; none = caught up.
const STATUS = { adobe: 'red', 'mentioned-me': 'red', 'mentioned-team': 'yellow', team: 'yellow', me: 'green' };
const statusOf = (t) => STATUS[t.attention] || 'none';
const URGENCY = ['low', 'normal', 'high', 'critical'];
const urgencyOf = (t) => (t.label && t.label.urgency != null ? URGENCY[Math.min(3, Math.round(t.label.urgency))] : null);
const KIND_EMOJI = {
  incident: '🔥', security: '🔒', question: '❓', request: '🙋', alert: '🚨', other: '💬',
};
const kindOf = (t) => (t.kind === 'alert' ? 'alert' : t.label?.label_kind || null);
const resolvedOf = (t) => (t.label?.resolved_p == null ? null : (t.label.resolved_p >= 0.5 ? 'resolved' : 'open'));
const teamIds = () => new Set((state.data?.members || []).map((m) => m.id));
/** Which of "my / team / Adobe" a thread involves: who posted, who was mentioned. */
function involvement(t) {
  const me = state.me.id;
  const team = teamIds();
  const out = [];
  if ((t.posters || []).includes(me)) out.push('my threads');
  if ((t.mentioned || []).some((m) => m.person === me)) out.push('my mentions');
  if ((t.posters || []).some((p) => team.has(p))) out.push('team threads');
  if ((t.mentioned || []).some((m) => team.has(m.person))) out.push('team mentions');
  if ((t.mentioned || []).some((m) => m.staff)) out.push('Adobe mentions');
  return out.length ? out : null;
}
const FACETS = [
  { id: 'status', title: 'Status', value: statusOf, order: ['red', 'yellow', 'green', 'none'],
    label: { red: 'Adobe / you', yellow: 'Team', green: 'Only you', none: 'Caught up' },
    hint: { red: 'Nobody at Adobe has seen it, or you were mentioned', yellow: 'Nobody on the team has seen it, or a teammate was mentioned', green: 'Only you have not seen it', none: 'Everyone is caught up' },
    color: (v) => `c-${v}` },
  { id: 'involves', title: 'Involves', value: involvement, multi: true,
    order: ['my threads', 'my mentions', 'team threads', 'team mentions', 'Adobe mentions'] },
  { id: 'type', title: 'Type', value: (t) => (t.kind === 'alert' ? 'alert' : 'conversation'), order: ['conversation', 'alert'],
    label: { conversation: 'Conversations', alert: 'Alerts' } },
  { id: 'platform', title: 'Platform', value: platform },
  { id: 'resolved', title: 'Resolved', value: resolvedOf, order: ['open', 'resolved'],
    label: { open: 'Unresolved', resolved: 'Resolved' }, color: (v) => (v === 'open' ? 'c-yellow' : 'c-green') },
  { id: 'next', title: 'Next actor', value: (t) => t.label?.next_actor || null, order: ['us', 'customer', 'vendor', 'nobody'],
    color: (v) => (v === 'us' ? 'c-yellow' : 'c-none') },
  { id: 'urgency', title: 'Urgency', value: urgencyOf, order: ['critical', 'high', 'normal', 'low'],
    color: (v) => ({ critical: 'c-red', high: 'c-yellow', normal: 'c-green', low: 'c-none' }[v]) },
  { id: 'kind', title: 'Kind', value: kindOf, label: Object.fromEntries(Object.entries(KIND_EMOJI).map(([k, e]) => [k, `${e} ${k}`])) },
  { id: 'customer', title: 'Customer', value: (t) => t.org, icon: (v, ts) => ts.find((t) => t.org === v && t.customerDomain)?.customerDomain, limit: 12 },
];
const valuesOf = (f, t) => {
  const v = f.value(t);
  if (f.multi) return v && v.length ? v : ['(none)'];
  return [v ?? '(none)'];
};
const passes = (t, except) => FACETS.every((f) => f.id === except || !state.sel[f.id]?.size
  || valuesOf(f, t).some((v) => state.sel[f.id].has(v)));

/**
 * A facet row's bar. Its length is the count; except on the status card itself, it is
 * split into the statuses of the threads behind it, as klickhaus splits status codes.
 */
function bar(f, v, n, max, m, color) {
  const width = `${Math.max(2, Math.round((n / max) * 100))}%`;
  if (f.id === 'status' || !m || !n) return `<span class="bar ${color}" style="width:${width}"></span>`;
  const seg = ['red', 'yellow', 'green', 'none'].filter((k) => m[k])
    .map((k) => `<i class="c-${k}" style="flex:${m[k]}" title="${m[k]} ${k === 'none' ? 'caught up' : k}"></i>`).join('');
  return `<span class="bar stack" style="width:${width}">${seg}</span>`;
}

function renderFilters() {
  const all = state.data?.threads || [];
  $('filters').innerHTML = FACETS.map((f) => {
    const pool = all.filter((t) => passes(t, f.id));
    const counts = new Map();
    const mix = new Map(); // value -> { red, yellow, green, none }
    for (const t of pool) {
      for (const v of valuesOf(f, t)) {
        counts.set(v, (counts.get(v) || 0) + 1);
        const m = mix.get(v) || { red: 0, yellow: 0, green: 0, none: 0 };
        m[statusOf(t)] += 1;
        mix.set(v, m);
      }
    }
    if (f.multi) counts.delete('(none)');
    for (const v of state.sel[f.id] || []) if (!counts.has(v)) counts.set(v, 0);
    let rows = [...counts];
    rows.sort((a, b) => (f.order ? (f.order.indexOf(a[0]) + 1 || 99) - (f.order.indexOf(b[0]) + 1 || 99) : b[1] - a[1]));
    if (f.limit) rows = rows.slice(0, f.limit);
    const max = Math.max(1, ...rows.map((r) => r[1]));
    const on = state.sel[f.id] || new Set();
    return `<div class="card" data-f="${f.id}"><h3>${esc(f.title)}${on.size ? '<span class="clear" data-clear="1">clear</span>' : ''}</h3>
      ${rows.map(([v, n]) => {
        const color = f.color ? f.color(v) : 'c-accent';
        const ic = f.icon && f.icon(v, all);
        return `<div class="fr ${on.has(v) ? 'on' : ''}" data-v="${esc(v)}" title="${esc((f.hint && f.hint[v]) || v)}">
          <span class="ind ${v === '(none)' ? 'c-none' : color}"></span>
          ${ic ? `<img class="ico" src="${esc(favicon(ic))}" alt="" loading="lazy">` : '<span></span>'}
          <span class="lab ${v === '(none)' ? 'dim' : ''}">${esc((f.label && f.label[v]) || v)}</span>
          <span class="n">${n}</span>
          ${bar(f, v, n, max, mix.get(v), color)}</div>`;
      }).join('') || '<div class="fr"><span></span><span></span><span class="lab dim">nothing</span></div>'}</div>`;
  }).join('');
}

// ---------------------------------------------------------------- thread list
// `:name:` to the character, for titles (the body renderer does the same).
const emojify = (text) => esc(text).replace(/:([a-z0-9_+-]+):/g, (m, n) => EMOJI[n] || m);

const URGENCY_EMOJI = { critical: '🆘', high: '⚡' };
const ourMove = (t) => t.kind !== 'alert' && t.label?.next_actor === 'us';

/** The thread's mood: its kind first, then the reactions people left in it. */
function moods(t) {
  const out = [];
  const u = urgencyOf(t);
  if (URGENCY_EMOJI[u]) out.push(`<span class="em" title="${esc(u)} urgency">${URGENCY_EMOJI[u]}</span>`);
  const k = kindOf(t);
  if (k) out.push(`<span class="em" title="${esc(k)}">${KIND_EMOJI[k] || '💬'}</span>`);
  const rx = [...(t.reactions || [])].sort((a, b) => b.count - a.count).slice(0, 5);
  for (const r of rx) out.push(`<span class="em" title="${esc(`${r.emoji} × ${r.count}`)}">${esc(emoji(r.emoji))}</span>`);
  return out.length ? `<span class="moods">${out.join('')}</span>` : '';
}

function row(t) {
  const status = statusOf(t);
  const faces = (t.participants || []).map((p) => avatar(`${p.name || '?'}${p.staff ? ' (Adobe)' : ''}`, p.avatar)).join('');
  const replies = Math.max(0, (t.messages || 1) - 1);
  const fresh = state.prevKeys && !state.prevKeys.has(t.thread) ? 'enter' : '';
  const n = t.occurrences || (t.members || []).length;
  const occurrences = n > 1 ? `<span class="replies">${n}×</span>` : '';
  return `<div class="t ${t.unread ? 'unread' : ''} ${state.open === t.thread ? 'sel' : ''} ${fresh}" data-thread="${esc(t.thread)}">
    <div class="l1"><span class="dot ${status === 'none' ? '' : `c-${status}`} ${ourMove(t) ? 'ring' : ''}" title="${esc(t.attention || 'caught up')}${ourMove(t) ? ' · our move' : ''}"></span>
      <span class="title">${t.root_known ? '' : '↳ '}${emojify(t.title || '(no text)')}</span>
      <span class="when" title="${esc(lastOf(t) || '')}">${ago(lastOf(t))}</span></div>
    <div class="l2">
      <span class="cust">${t.customerDomain ? `<img src="${esc(favicon(t.customerDomain))}" alt="" loading="lazy">` : ''}${esc(t.org)}</span>
      <span class="faces">${faces}</span>
      ${occurrences}${replies && !occurrences ? `<span class="replies">${replies} ${replies === 1 ? 'reply' : 'replies'}</span>` : ''}
      <span class="tags">${moods(t)}</span>
    </div></div>`;
}

// Smart order: what needs me most, first. Recency always counts; a thread that waits on
// us counts more the longer it waits, the more urgent and unresolved it is, and the closer
// it is to me (mentioned me > I posted > mentioned the team > the team posted).
function smartScore(t) {
  const now = Date.now();
  const last = Date.parse(lastOf(t) || t.any_at || 0) || 0;
  const ageH = Math.max(0, (now - last) / 3600000);
  const recency = Math.exp(-ageH / 48);
  const urgency = 1 + (t.label?.urgency ?? 0.5);
  const open = 1 - 0.8 * (t.label?.resolved_p ?? 0);
  const me = state.me.id;
  const team = teamIds();
  let near = 1;
  if ((t.mentioned || []).some((m) => m.person === me) || t.mentionedMe) near = 3;
  else if ((t.posters || []).includes(me)) near = 2;
  else if ((t.mentioned || []).some((m) => team.has(m.person))) near = 1.5;
  else if ((t.posters || []).some((p) => team.has(p))) near = 1.2;
  const waitsOnUs = t.kind !== 'alert' && (t.label ? t.label.next_actor === 'us' : t.last_staff === 0);
  const waiting = waitsOnUs ? 1 + Math.log2(1 + ageH / 2) : 0.3;
  const unseen = t.unseenByAdobe ? 1.5 : 1;
  const alert = t.kind === 'alert' ? 0.3 : 1;
  return alert * (2 * recency + urgency * open * waiting * near * unseen);
}

const tpl = document.createElement('template');
const toNode = (html) => { tpl.innerHTML = html.trim(); return tpl.content.firstElementChild; };

// Threads in view are fetched ahead, so opening one is instant.
const preload = new IntersectionObserver((entries) => {
  for (const e of entries) if (e.isIntersecting) prefetch(e.target.dataset.thread);
}, { root: $('threads'), rootMargin: '200px' });

function renderThreads() {
  const box = $('threads');
  if (!state.data) return;
  const shown = state.data.threads.filter((t) => passes(t));
  if (state.sort === 'recent') shown.sort((a, b) => String(lastOf(b)).localeCompare(String(lastOf(a))));
  // Smart order is computed when the inbox loads, not when you read a thread, so a click
  // never moves the row you clicked.
  else shown.sort((a, b) => (state.scores.get(b.thread) ?? smartScore(b)) - (state.scores.get(a.thread) ?? smartScore(a)));
  if (!box.querySelector('.rows')) box.innerHTML = '<div class="count"></div><div class="rows"></div>';
  const sorter = ['smart', 'recent'].map((k) => `<button data-sort="${k}" aria-pressed="${state.sort === k}">${k === 'smart' ? 'Smart' : 'Recent'}</button>`).join('');
  box.querySelector('.count').innerHTML = `<span>${shown.length} of ${state.data.threads.length} threads</span><span class="sort">${sorter}</span>`;
  // Patch the list instead of rebuilding it: unchanged rows keep their DOM (and images).
  const list = box.querySelector('.rows');
  const existing = new Map([...list.children].filter((c) => c.dataset.thread).map((c) => [c.dataset.thread, c]));
  const nodes = shown.map((t) => {
    const html = row(t);
    const old = existing.get(t.thread);
    if (old && old.__html === html.replace(/ enter /, '  ')) return old;
    const node = toNode(html);
    node.__html = html.replace(/ enter /, '  ');
    preload.observe(node);
    return node;
  });
  if (!nodes.length) { list.innerHTML = '<div class="empty">Nothing matches these filters.</div>'; } else {
    [...list.children].forEach((c) => { if (!nodes.includes(c)) { preload.unobserve(c); c.remove(); } });
    nodes.forEach((n, i) => { if (list.children[i] !== n) list.insertBefore(n, list.children[i] || null); });
  }
  state.order = shown.map((t) => t.thread);
  state.prevKeys = new Set(state.data.threads.map((t) => t.thread));
}
function render() { renderFilters(); renderThreads(); }

// ---------------------------------------------------------------- messages
const TECH_LABEL = {
  eds: 'Edge Delivery', da: 'Document Authoring', ue: 'Universal Editor', sharepoint: 'SharePoint',
  gdrive: 'Google Drive', aemcs: 'AEM Cloud Service', assets: 'Assets', forms: 'Forms', commerce: 'Commerce',
  cloudflare: 'Cloudflare', akamai: 'Akamai', fastly: 'Fastly', cloudfront: 'CloudFront', github: 'GitHub',
  bitbucket: 'Bitbucket / Cloud Manager git', target: 'Target', analytics: 'Analytics',
};
const QUESTION_LABEL = { next_actor: 'Next actor', kind: 'Kind', urgency: 'Urgency', resolved: 'Resolved' };
function modelValue(model, q) {
  if (q === 'urgency') return model.urgency == null ? null : String(Math.round(model.urgency));
  if (q === 'resolved') return model.resolved_p == null ? null : (model.resolved_p >= 0.5 ? 'yes' : 'no');
  return model[q];
}
/**
 * Label review (admin team, "Review labels" on): pinned to the top of the thread, so you
 * can read on, pick the right answers, and apply them together.
 */
function reviewPanel(thread, model, reviews) {
  const current = reviews.filter((r) => r.labeled_through === model.labeled_through);
  const staged = state.staged[thread.thread] || {};
  const rows = Object.keys(QUESTION_LABEL).map((q) => {
    const mv = modelValue(model, q);
    const reviewed = (current.find((r) => r.question === q) || {}).value;
    const picked = staged[q] ?? reviewed;
    return `<div class="q"><b>${QUESTION_LABEL[q]}</b>${(state.answers?.[q] || []).map((v) => `<button data-q="${q}" data-v="${esc(v)}" class="${v === mv ? 'model' : ''} ${v === picked ? 'picked' : ''}" title="${v === mv ? 'Clef' : ''}">${esc(v)}</button>`).join('')}</div>`;
  }).join('');
  const n = Object.keys(staged).length;
  return `<div class="rv" data-thread="${esc(thread.thread)}">${rows}
    <div class="apply"><button class="send" data-apply="1" ${n ? '' : 'disabled'}>Apply ${n || ''} ${n === 1 ? 'correction' : 'corrections'}</button>
      <button data-confirm="1" title="Clef got everything right">All correct</button></div></div>`;
}
function message(m, prev, fresh) {
  const a = m.author || {};
  const id = `${m.thread}|${m.id}`;
  const enter = fresh ? 'enter' : '';
  if (a.kind === 'system') return `<div class="sys ${enter}" data-id="${esc(id)}">${md(m.body)} · ${clock(m.at)}</div>`;
  const adobe = Boolean(a.staff);
  const cont = prev && prev.author?.name === a.name && prev.author?.kind === a.kind && prev.thread === m.thread
    && Date.parse(m.at) - Date.parse(prev.at) < 5 * 60 * 1000 && dayLabel(prev.at) === dayLabel(m.at);
  const who = `<b>${esc(a.name || 'unknown')}</b>${a.kind === 'bot' ? ' bot' : ''} · ${clock(m.at)}`;
  const face = `<span class="face">${avatar(a.name || '?', m.avatar)}${!adobe && a.org ? `<img class="badge-ico" src="${esc(favicon(a.org))}" alt="" title="${esc(a.org)}" loading="lazy">` : ''}</span>`;
  const rx = (m.reactions || []).map((r) => `<span title="${esc(r.names.join(', ') || r.emoji)}">${esc(emoji(r.emoji))} ${r.count}</span>`).join('');
  return `<div class="msg ${adobe ? 'adobe' : ''} ${cont ? 'cont' : ''} ${m.deletedAt ? 'deleted' : ''} ${m.pending ? 'pending' : ''} ${enter}" data-id="${esc(id)}">
    ${face}
    <div class="col"><div class="who">${who}</div>
      <div class="bubble">${m.deletedAt ? 'This message was deleted.' : md(m.body)}</div>
      ${rx ? `<div class="rx">${rx}</div>` : ''}
      ${m.editedAt || m.permalink || m.pending ? `<div class="meta">${m.pending ? 'sending… ' : ''}${m.editedAt ? 'edited ' : ''}${m.permalink ? `<a href="${esc(m.permalink)}" target="_blank" rel="noopener">open in ${m.source === 'slack' ? 'Slack' : 'Teams'} ↗</a>` : ''}</div>` : ''}
    </div></div>`;
}

function composer(thread) {
  const p = thread.source;
  const name = p === 'slack' ? 'Slack' : 'Microsoft';
  if (!state.me.connected?.[p]) {
    return `<div class="composer"><span class="connect">To reply as yourself, <a href="/api/auth/${p}/start">connect your ${name} account</a>.</span></div>`;
  }
  return `<div class="composer"><textarea id="reply" rows="1" placeholder="Reply in ${platform(thread)} as ${esc(state.me.name || '')}… (Enter to send, Shift+Enter for a new line)"></textarea>
    <button class="send" id="send">Send</button></div>`;
}

const nearBottom = (el) => el.scrollHeight - el.scrollTop - el.clientHeight < 80;

async function openThread(key, { live = false, cached = false } = {}) {
  const switching = state.open !== key;
  state.open = key;
  if (switching) toUrl();
  renderThreads();
  const pane = $('pane');
  const prevScroller = pane.querySelector('.scroller');
  const wasNear = prevScroller ? nearBottom(prevScroller) : true;
  const keepTop = prevScroller ? prevScroller.scrollTop : 0;
  const draft = $('reply')?.value || '';
  if (!live && !state.cache.get(key)) pane.innerHTML = '<div class="empty">Loading…</div>';
  let data;
  const hit = (!live || cached) && state.cache.get(key);
  try {
    data = hit ? hit.data : await get(`/api/thread?thread=${encodeURIComponent(key)}`);
  } catch (e) {
    pane.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    return;
  }
  state.cache.set(key, { data, at: hit ? hit.at : Date.now() });
  // Shown from the preload: fetch the current state behind it.
  if (hit && !cached && Date.now() - hit.at > 5000) setTimeout(() => { if (state.open === key) openThread(key, { live: true }); }, 0);
  const { thread, members = [], messages, watermarks, label, model, reviews, facts } = data;
  if (state.open !== key) return;
  const group = members.length > 1;
  const t = state.data?.threads.find((x) => x.thread === key) || {};
  // Where I was: the last time I had read any member of this entry.
  const myRead = watermarks.filter((w) => w.person === state.me.id).map((w) => w.read_at).sort().pop() || null;
  const ids = new Set(messages.map((m) => `${m.thread}|${m.id}`));
  const fresh = (m) => live && state.shownIds && !state.shownIds.has(`${m.thread}|${m.id}`);
  // Replies I sent that have not arrived yet.
  state.sending = state.sending.filter((p) => p.thread === key && Date.now() - p.sentAt < 60000
    && !messages.some((m) => m.author?.name === state.me.name && m.body.trim() === p.body.trim()));
  const shown = [...messages, ...state.sending.map((p) => ({
    ...p, author: { kind: 'person', name: state.me.name, staff: true }, pending: true,
  }))];
  let feed = '';
  let prev = null;
  let day = null;
  shown.forEach((m, i) => {
    if (dayLabel(m.at) !== day) { day = dayLabel(m.at); feed += `<div class="day"><span>${esc(day)}</span></div>`; prev = null; }
    if (group && prev && prev.thread !== m.thread) { feed += `<div class="post">new post · ${clock(m.at)}</div>`; prev = null; }
    if (!group && i === 1 && thread.root_at && messages.length > 1) { feed += `<div class="divider">${messages.length - 1} ${messages.length === 2 ? 'reply' : 'replies'}</div>`; prev = null; }
    feed += message(m, prev, fresh(m));
    prev = m;
  });
  // Sites as links (main--site--org.aem.live), tickets and CVEs as chips, and the tech the
  // channel is known to use.
  const sites = facts.filter((f) => f.field === 'site').map((f) => {
    const [org, site] = f.value.split('/');
    const host = `main--${site}--${org}.aem.live`;
    return `<a class="back" href="https://${esc(host)}/" target="_blank" rel="noopener">${esc(host)}</a>`;
  }).join(' ');
  const chips = facts.filter((f) => f.field === 'ticket' || f.field === 'cve').map((f) => `<span class="tag">${esc(f.value)}</span>`).join('');
  const stack = (data.tech || []).map((x) => `<span class="tag tech" title="${Math.round(x.p * 100)}%">${esc(TECH_LABEL[x.tech] || x.tech)}</span>`).join('');
  pane.innerHTML = `<div class="ph"><h2>${emojify(thread.title || '(no text)')} ${backlink(thread, `Open in ${platform(thread)} ↗`)}</h2>
      <div class="sub">${t.customerDomain ? `<img src="${esc(favicon(t.customerDomain))}" alt="">` : ''}<span>${esc(thread.org)}</span> ·
        <span>${esc(thread.channel_name || '')}</span>
        ${group ? `· <span class="tag">${members.length} posts folded into one thread</span>` : ''}
        ${sites ? `· ${sites}` : ''} ${chips}</div>
      ${stack ? `<div class="sub stack">${stack}</div>` : ''}</div>
    <div class="scroller">
      ${state.review && state.me.admin && model ? reviewPanel({ thread: thread.label_thread || thread.thread }, model, reviews) : ''}
      <div class="feed">${thread.root_at ? '' : '<div class="sys">Earlier messages were posted before opspile started listening.</div>'}${feed}</div>
    </div>
    ${composer(thread)}`;
  state.shownIds = ids;
  const scroller = pane.querySelector('.scroller');
  if (live && !switching) {
    // New messages scroll up into view if I was at the bottom; otherwise stay put.
    scroller.scrollTop = keepTop;
    if (wasNear) scroller.scrollTo({ top: scroller.scrollHeight, behavior: 'smooth' });
  } else {
    const firstUnread = myRead && messages.find((m) => m.at > myRead && m.author?.name !== state.me.name);
    const el = firstUnread && scroller.querySelector(`[data-id="${CSS.escape(`${firstUnread.thread}|${firstUnread.id}`)}"]`);
    if (el) scroller.scrollTop = Math.max(0, el.offsetTop - scroller.offsetTop - 80);
    else scroller.scrollTop = scroller.scrollHeight;
  }
  const box = $('reply');
  if (box) {
    box.value = draft;
    const grow = () => { box.style.height = 'auto'; box.style.height = `${Math.min(180, box.scrollHeight)}px`; };
    box.oninput = grow;
    grow();
    box.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(key, thread); } };
    $('send').onclick = () => send(key, thread);
  }
  if (state.data?.threads.some((x) => x.thread === key) && (switching || !live)) markRead(t);
}

async function send(key, thread) {
  const box = $('reply');
  const body = box.value.trim();
  if (!body) return;
  $('send').disabled = true;
  const res = await fetch('/api/post', { method: 'POST', credentials: 'same-origin', body: JSON.stringify({ thread: key, text: body }) });
  const data = await res.json().catch(() => ({}));
  $('send').disabled = false;
  if (!res.ok) {
    if (data.connect) { state.me.connected = { ...state.me.connected, [data.connect]: false }; }
    toast(data.error || `could not send (${res.status})`);
    if (data.connect) openThread(key, { live: true });
    return;
  }
  box.value = '';
  const last = state.shownIds ? [...state.shownIds].pop() : null;
  state.sending.push({ thread: key, body, at: new Date().toISOString(), sentAt: Date.now(), id: `pending-${Date.now()}`, source: thread.source, last });
  openThread(key, { live: true });
}

function toast(text) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = text;
  document.body.append(el);
  setTimeout(() => el.remove(), 5000);
}

// ---------------------------------------------------------------- read state, live
const memberLast = (m, kind) => (kind === 'alert' ? m.any_at : m.last_at) || m.any_at;
function markRead(t) {
  if (!t || !t.thread) return;
  // A folded entry is several platform threads: each one is read up to its own end.
  for (const m of t.members || [{ thread: t.thread, last_at: t.last_at, any_at: t.any_at }]) {
    const at = memberLast(m, t.kind);
    if (!at) continue;
    const msg = { type: 'read', thread: m.thread, at };
    if (state.ws?.readyState === 1) state.ws.send(JSON.stringify(msg));
    else fetch('/api/read', { method: 'POST', body: JSON.stringify(msg), credentials: 'same-origin' });
  }
  if (!t.readers.includes(state.me.id)) t.readers.push(state.me.id);
  Object.assign(t, { unread: false, unseen: false, mentionedMe: false });
  if (lastOf(t)) t.unseenByAdobe = false;
  const applies = { 'mentioned-team': t.mentionedTeam.length > 0 };
  t.attention = applies['mentioned-team'] ? 'mentioned-team' : null;
  render();
}
let reload;
function reloadSoon(thread) {
  clearTimeout(reload);
  reload = setTimeout(async () => {
    await loadInbox();
    if (state.open && (state.open === thread || state.data.threads.find((t) => t.thread === state.open)?.members?.some((m) => m.thread === thread))) {
      openThread(state.open, { live: true });
    }
  }, 500);
}
async function loadInbox() {
  state.data = await get(`/api/inbox?team=${encodeURIComponent(state.team)}`);
  state.scores = new Map(state.data.threads.map((t) => [t.thread, smartScore(t)]));
  render();
}
const inflight = new Set();
async function prefetch(key) {
  const hit = state.cache.get(key);
  if (!key || inflight.has(key) || (hit && Date.now() - hit.at < 60000) || inflight.size >= 4) return;
  inflight.add(key);
  try {
    state.cache.set(key, { data: await get(`/api/thread?thread=${encodeURIComponent(key)}`), at: Date.now() });
  } catch { /* opening it will try again */ } finally { inflight.delete(key); }
}
function connect() {
  state.ws?.close();
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/api/live?team=${encodeURIComponent(state.team)}`);
  state.ws = ws;
  ws.onopen = () => $('live').classList.add('on');
  ws.onclose = () => { $('live').classList.remove('on'); if (state.ws === ws) setTimeout(connect, 3000); };
  ws.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === 'read' && ev.person === state.me.id) return;
    if (ev.type === 'read' || ev.type === 'thread') reloadSoon(ev.thread);
  };
}

// ---------------------------------------------------------------- URL state
function toUrl(push = true) {
  const q = new URLSearchParams();
  q.set('team', state.team);
  q.set('filters', '1');
  for (const [id, set] of Object.entries(state.sel)) if (set.size) q.set(`f.${id}`, [...set].join('|'));
  if (state.open) q.set('t', state.open);
  if (state.review) q.set('review', '1');
  if (state.sort !== 'smart') q.set('sort', state.sort);
  const url = `${location.pathname}?${q}`;
  if (url !== `${location.pathname}${location.search}`) history[push ? 'pushState' : 'replaceState'](null, '', url);
}
function fromUrl() {
  const q = new URLSearchParams(location.search);
  const team = q.get('team');
  state.team = state.me.teams.some((t) => t.slug === team) ? team : state.me.teams[0]?.slug;
  if (q.has('filters')) {
    state.sel = {};
    for (const [k, v] of q) if (k.startsWith('f.') && v) state.sel[k.slice(2)] = new Set(v.split('|'));
  }
  state.sort = q.get('sort') === 'recent' ? 'recent' : 'smart';
  return { open: q.get('t'), review: q.get('review') === '1' };
}

// ---------------------------------------------------------------- wiring
function move(step) {
  if (!state.order.length) return;
  const i = state.order.indexOf(state.open);
  const next = state.order[Math.max(0, Math.min(state.order.length - 1, i < 0 ? 0 : i + step))];
  if (next && next !== state.open) {
    openThread(next);
    document.querySelector(`#threads .t[data-thread="${CSS.escape(next)}"]`)?.scrollIntoView({ block: 'nearest' });
  }
}

async function start() {
  try { state.me = await get('/api/me'); } catch (e) { $('threads').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  $('me').textContent = state.me.name || state.me.email;
  $('team').innerHTML = state.me.teams.map((t) => `<option value="${esc(t.slug)}">${esc(t.name)}</option>`).join('');
  const q = new URLSearchParams(location.search);
  if (q.get('connected')) toast(`Connected your ${q.get('connected') === 'slack' ? 'Slack' : 'Microsoft'} account. Replies are sent as you.`);
  if (q.get('connect_error')) toast(`Could not connect: ${q.get('connect_error')}`);
  const initial = fromUrl();
  $('team').value = state.team;
  toUrl(false);
  $('team').onchange = async () => {
    state.team = $('team').value; state.open = null; state.prevKeys = null;
    toUrl(); await loadInbox(); connect();
  };
  $('filters').onclick = (e) => {
    const card = e.target.closest('.card');
    if (!card) return;
    const id = card.dataset.f;
    if (e.target.dataset.clear) { delete state.sel[id]; render(); toUrl(); return; }
    const r = e.target.closest('.fr');
    if (!r || r.dataset.v === undefined) return;
    const set = state.sel[id] || (state.sel[id] = new Set());
    if (set.has(r.dataset.v)) set.delete(r.dataset.v); else set.add(r.dataset.v);
    if (!set.size) delete state.sel[id];
    render();
    toUrl();
  };
  $('threads').onclick = (e) => {
    if (e.target.dataset.sort) { state.sort = e.target.dataset.sort; renderThreads(); toUrl(); return; }
    if (e.target.closest('a')) return;
    const el = e.target.closest('.t');
    if (el) openThread(el.dataset.thread);
  };
  $('pane').onclick = async (e) => {
    const panel = e.target.closest('.rv');
    const b = e.target.closest('.rv button');
    if (!panel || !b) return;
    const thread = panel.dataset.thread;
    const staged = state.staged[thread] || (state.staged[thread] = {});
    if (b.dataset.q) {
      if (staged[b.dataset.q] === b.dataset.v) delete staged[b.dataset.q]; else staged[b.dataset.q] = b.dataset.v;
      openThread(state.open, { live: true, cached: true });
      return;
    }
    // "All correct" confirms Clef's answers; "Apply" sends the picks.
    const model = state.cache.get(state.open)?.data?.model;
    const answers = b.dataset.confirm && model
      ? Object.fromEntries(Object.keys(QUESTION_LABEL).map((q) => [q, modelValue(model, q)]).filter(([, v]) => v != null))
      : staged;
    for (const [question, value] of Object.entries(answers)) {
      // eslint-disable-next-line no-await-in-loop
      const res = await fetch('/api/review', { method: 'POST', credentials: 'same-origin', body: JSON.stringify({ thread, question, value }) });
      if (!res.ok) { toast((await res.json()).error || res.status); return; }
    }
    delete state.staged[thread];
    toast(`Saved ${Object.keys(answers).length} answer(s).`);
    openThread(state.open, { live: true });
  };
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || /^(TEXTAREA|INPUT|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === 'j') { e.preventDefault(); move(1); }
    if (e.key === 'k') { e.preventDefault(); move(-1); }
  });
  window.addEventListener('popstate', async () => {
    const team = state.team;
    const { open, review } = fromUrl();
    $('team').value = state.team;
    if (team !== state.team) { state.prevKeys = null; await loadInbox(); connect(); }
    state.review = review;
    $('review').setAttribute('aria-pressed', String(review));
    render();
    if (open && open !== state.open) openThread(open); else if (!open) { state.open = null; $('pane').innerHTML = '<div class="empty">Pick a thread.</div>'; }
  });
  if (state.me.admin) {
    $('review').hidden = false;
    get('/api/review/queue').then((r) => { state.answers = r.answers; });
    $('review').onclick = () => {
      state.review = !state.review;
      $('review').setAttribute('aria-pressed', String(state.review));
      toUrl();
      if (state.open) openThread(state.open, { live: true });
    };
  }
  await loadInbox();
  if (initial.review && state.me.admin) { state.review = true; $('review').setAttribute('aria-pressed', 'true'); }
  if (initial.open) openThread(initial.open);
  connect();
}
start();
</script>
</body>
