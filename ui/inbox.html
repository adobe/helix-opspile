<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>opspile</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f1114" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="opspile">
<style>
  :root {
    --bg: #0f1114; --col: #15181c; --card: #1a1e23; --line: #2a2f36; --hover: #20252b;
    --ink: #e8eaed; --mute: #8b929b; --faint: #5d646d;
    --accent: #5aa2ff; --link: #7cc0ff; --sel: #1f2a38;
    --red: #e5534b; --yellow: #d4a72c; --green: #57ab5a; --purple: #a371f7;
    --me: #2f7cf6; --me-ink: #fff; --me-link: #fff;
    --them: #2b3037; --them-ink: #e8eaed; --them-code: rgba(0,0,0,.25);
    --pane: #0f1114;
    --mention-adobe: #ff8a80;
    --code: #0b0d10;
    --head: 50px;
    font: 14px/1.45 "Adobe Clean", adobe-clean, "Source Sans 3", "Source Sans Pro",
      -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eceef1; --col: #f6f7f9; --card: #fff; --line: #dfe2e6; --hover: #eef1f5;
      --ink: #1d2025; --mute: #616a75; --faint: #9aa1aa; --accent: #1f6feb; --link: #0b5cc4;
      --sel: #dde9fb; --purple: #8250df; --them: #e1e5ea; --them-ink: #1d2025; --code: #f3f4f6;
      /* A white pane, so customer bubbles stand out (1.27:1) as Adobe's blue ones do. */
      --pane: #fff; --them-code: rgba(0,0,0,.08); --them-link: #0a4fa8;
      --mention-adobe: #b30b00;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: var(--app-height, 100%); overflow: hidden; overscroll-behavior: none; }
  body { margin: 0; background: var(--bg); display: flex; flex-direction: column; }
  /* Installed as an app on an iPhone (viewport-fit=cover), the page reaches under the home
     indicator and, on the phone's side, under the camera: what sits at those edges moves in by
     the safe-area insets, which are 0 everywhere else. */
  :root { --safe-bottom: env(safe-area-inset-bottom, 0px); }
  body { padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  /* With the on-screen keyboard open (see the script at the end), the page follows what is left
     above it, and the keyboard covers the home indicator. */
  :root.keyboard { --safe-bottom: 0px; }
  body { translate: 0 var(--app-top, 0px); }
  #threads { padding-bottom: var(--safe-bottom); }
  button, select { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line);
    border-radius: 7px; padding: 3px 9px; cursor: pointer; }
  /* The toolbar: pages and label review on the left; on the right, whoever is signed in, with a
     menu for "View as" (admin team), the keyboard shortcuts and logging out. */
  header { display: flex; gap: 10px; align-items: center; height: var(--head); padding: 0 12px 0 14px; flex: none;
    background: var(--col); border-bottom: 1px solid var(--line); }
  header h1 { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; margin: 0 8px 0 0;
    letter-spacing: .01em; }
  header h1 img { width: 22px; height: 22px; border-radius: 6px; }
  header .spacer { flex: 1; }
  header .tool { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 11px; color: var(--mute); }
  header .tool[hidden] { display: none; }
  header .tool:hover { color: var(--ink); background: var(--hover); }
  header .tool svg { width: 14px; height: 14px; flex: none; }
  #review[aria-pressed="true"] { color: var(--ink); background: var(--sel); border-color: var(--accent); }
  /* Inbox ↔ knowledge bases, for the admin team: the same switch in both pages' header. */
  nav.pages { display: inline-flex; height: 30px; background: var(--card); border: 1px solid var(--line); border-radius: 7px;
    overflow: hidden; }
  nav.pages[hidden] { display: none; }
  nav.pages .count { display: inline-grid; place-items: center; min-width: 17px; height: 17px; padding: 0 5px; margin-left: 6px;
    border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 650; line-height: 1; }
  nav.pages a { display: flex; align-items: center; color: var(--mute); text-decoration: none; padding: 0 11px; }
  nav.pages a + a { border-left: 1px solid var(--line); }
  nav.pages a:hover { color: var(--ink); background: var(--hover); }
  nav.pages a[aria-current="page"] { color: var(--ink); background: var(--sel); cursor: default;
    box-shadow: inset 0 0 0 1px var(--accent); border-radius: 6px; }
  nav.pages a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* Live updates are only worth a word when they stop. */
  #offline { color: var(--yellow); font-size: 12.5px; }
  /* Read-only "View as": loud enough not to be forgotten, and one click to leave. */
  #viewing { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 6px 0 11px; font-size: 13px;
    color: var(--ink); background: color-mix(in srgb, var(--yellow) 18%, var(--card));
    border-color: color-mix(in srgb, var(--yellow) 55%, var(--line)); border-radius: 15px; }
  #viewing[hidden] { display: none; }
  #viewing .x { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; color: var(--mute); }
  #viewing:hover .x { color: var(--ink); background: color-mix(in srgb, var(--yellow) 30%, transparent); }
  #user { display: flex; align-items: center; gap: 9px; height: 38px; padding: 0 8px 0 4px; border-color: transparent;
    background: none; border-radius: 10px; text-align: left; }
  #user:hover, #user[aria-expanded="true"] { background: var(--hover); border-color: var(--line); }
  #user .av, .menu .av { width: 28px; height: 28px; border-radius: 50%; font-size: 11px; }
  #user .who { display: flex; flex-direction: column; line-height: 1.2; }
  #user .nm { font-weight: 600; font-size: 13px; white-space: nowrap; }
  #user .sub { color: var(--mute); font-size: 11.5px; white-space: nowrap; }
  #user svg { width: 12px; height: 12px; color: var(--mute); }
  .menu { position: fixed; inset: 46px 12px auto auto; margin: 0; width: 290px; padding: 6px; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0,0,0,.22), 0 2px 6px rgba(0,0,0,.12); font-size: 13px; }
  .menu .id { display: flex; gap: 10px; align-items: center; padding: 8px 8px 10px; }
  .menu .id .av { width: 36px; height: 36px; font-size: 13px; }
  .menu .id .nm { font-weight: 650; font-size: 14px; }
  .menu .id .sub { color: var(--mute); font-size: 12px; overflow-wrap: anywhere; }
  .menu section { border-top: 1px solid var(--line); padding: 6px 0; }
  .menu section[hidden] { display: none; }
  .menu h4 { margin: 4px 8px 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--faint); }
  .menu .item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 8px; border: 0; border-radius: 7px;
    background: none; color: inherit; text-decoration: none; text-align: left; cursor: pointer; }
  .menu .item:hover, .menu .item:focus-visible { background: var(--hover); outline: none; }
  .menu .item .ck { width: 14px; color: var(--accent); flex: none; visibility: hidden; }
  .menu .item[aria-checked="true"] { font-weight: 600; }
  .menu .item[aria-checked="true"] .ck { visibility: visible; }
  .menu .item svg { width: 14px; height: 14px; flex: none; }
  .menu select { width: calc(100% - 16px); margin: 2px 8px 4px; padding: 4px 8px; }
  .menu .hint { margin: 0 8px 4px; color: var(--mute); font-size: 11.5px; }
  /* Bells: the views that notify you, each with the ✕ that turns it off. */
  .menu #bells .bell { display: flex; align-items: center; gap: 8px; padding: 3px 4px 3px 8px; }
  .menu #bells .bell svg { width: 13px; height: 13px; flex: none; color: var(--accent); }
  .menu #bells .bell a { flex: 1; min-width: 0; color: inherit; text-decoration: none; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .menu #bells .bell a:hover { text-decoration: underline; }
  .menu #bells .bell button { flex: none; padding: 0 6px; border: 0; border-radius: 6px; background: none; color: var(--mute); }
  .menu #bells .bell button:hover { background: var(--hover); color: var(--ink); }
  .menu .item.allow { color: var(--link); }
  .menu .item[hidden] { display: none; }
  .menu .keys { display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; margin: 2px 8px 4px; color: var(--mute); }
  .menu .keys dd { margin: 0; text-align: right; }
  main { flex: 1; display: grid; grid-template-columns: var(--filters-w) minmax(380px, 34%) 1fr; min-height: 0; }
  :root { --filters-w: 270px; --rail: 68px; }
  main > section { overflow: auto; min-height: 0; overscroll-behavior: contain; }

  /* Filters: one card per facet, as in klickhaus. */
  #filters { padding: 12px 12px calc(12px + var(--safe-bottom)); background: var(--bg); display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 8px; }
  .card h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 14px; }
  .card h3::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .card h3 .clear { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--mute); cursor: pointer; }
  .card h3 .clear:hover { color: var(--ink); }
  .fr { display: grid; grid-template-columns: 4px 18px 1fr auto 56px; gap: 6px; align-items: center;
    padding: 4px 4px; border-radius: 6px; cursor: pointer; }
  .fr:hover { background: var(--hover); }
  /* A picked value stands out from the rest of its card: tinted, outlined, its label bold. */
  .fr.on { background: color-mix(in srgb, var(--accent) 22%, var(--card));
    box-shadow: inset 0 0 0 1.5px var(--accent); }
  .fr.on:hover { background: color-mix(in srgb, var(--accent) 28%, var(--card)); }
  .fr.on .lab { font-weight: 700; color: var(--ink); }
  .fr.on .n { color: var(--ink); font-weight: 650; }
  /*
   * Excluded values, as klickhaus shows them: struck through and faded, with the \2260 button
   * that excludes a value (or stops) shown red. It sits over the end of the label, on hover.
   */
  .fr { position: relative; }
  .fr .lab, .fr .lw { grid-column: 3; grid-row: 1; }
  .fr .not { grid-column: 3; grid-row: 1; justify-self: end; z-index: 1; opacity: 0; pointer-events: none;
    border: 0; border-radius: 4px; padding: 1px 5px; font: inherit; font-size: 12px; line-height: 1.2; color: var(--mute);
    background: inherit; cursor: pointer; }
  .fr:hover .not, .fr .not:focus-visible { opacity: 1; pointer-events: auto; }
  .fr .not:hover { color: var(--red); box-shadow: inset 0 0 0 1px var(--line); }
  .fr.off .not { opacity: 1; pointer-events: auto; color: var(--red); background: none; }
  .fr.off .lab { text-decoration: line-through; color: var(--mute); }
  .fr.off .ind, .fr.off .ico, .fr.off .bar { opacity: 0.4; }
  @media (hover: none) { .fr .not { opacity: 0.6; pointer-events: auto; background: none; } }
  .fr .ind { width: 3px; height: 16px; border-radius: 2px; background: var(--faint); }
  .fr .ico { width: 16px; height: 16px; border-radius: 3px; }
  .fr .lw { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .fr .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Unread mentions of you, counted as Slack and Teams count them. */
  .fr .men { flex: none; min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--red);
    color: #fff; font: 650 11px/17px system-ui, sans-serif; text-align: center; }
  .fr .lab.dim { color: var(--faint); }
  /* Values with threads the viewer has not read. */
  .fr .lab.new { font-weight: 650; }
  .fr .n { font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--mute); text-align: right; }
  .fr .bar { height: 7px; border-radius: 4px; background: var(--faint); min-width: 2px; }
  .fr .bar.stack { display: flex; overflow: hidden; background: none; gap: 1px; }
  .fr .bar.stack i { display: block; height: 100%; min-width: 2px; }
  .c-red { background: var(--red) !important; } .c-yellow { background: var(--yellow) !important; }
  .c-green { background: var(--green) !important; } .c-none { background: var(--faint) !important; }
  .c-critical { background: #8e1b1b !important; } .c-hot { background: var(--red) !important; }
  .c-you { background: var(--accent) !important; } .c-waiting { background: var(--yellow) !important; }
  .c-silent { background: var(--purple) !important; }
  .c-team { background: var(--green) !important; } .c-quiet { background: var(--faint) !important; }
  .fr .ico.em { font-size: 13px; line-height: 16px; text-align: center; }
  .fr .ico.av { font-size: 9px; font-weight: 700; line-height: 1; border-radius: 4px; }
  .fr .ico.av.round { font-size: 7px; border-radius: 50%; }
  .c-accent { background: var(--accent) !important; }
  /*
   * Facet colours beyond status. Who: me blue, my teams green, their members light green,
   * the rest of Adobe slate, customers orange, partners magenta, vendors cyan (the Customer
   * card groups orgs the same way). Platforms in their brand colours; urgency and kind in
   * the colours of their emoji.
   */
  :root { --orange: #f0883e; --pink: #db61a2; --cyan: #39c5cf; --slate: #8f9bb3; --lime: #8ddb8c;
    --gold: #e3b341; --brown: #b08259; --crimson: #f47067; --teams: #7f85f5; }
  @media (prefers-color-scheme: light) {
    :root { --orange: #d1661a; --pink: #bf3989; --cyan: #1b9aaa; --slate: #6e7b91; --lime: #4ac26b;
      --gold: #bf8700; --brown: #8a5a2b; --crimson: #cf222e; --teams: #5b5fc7; }
  }
  .c-me, .c-blue { background: var(--accent) !important; } .c-member { background: var(--lime) !important; }
  .c-adobe { background: var(--slate) !important; } .c-customer, .c-orange { background: var(--orange) !important; }
  .c-partner, .c-pink { background: var(--pink) !important; } .c-vendor { background: var(--cyan) !important; }
  .c-gold { background: var(--gold) !important; } .c-brown { background: var(--brown) !important; }
  .c-crimson { background: var(--crimson) !important; } .c-msteams { background: var(--teams) !important; }
  .c-slack { background: linear-gradient(#36c5f0 25%, #2eb67d 0 50%, #ecb22e 0 75%, #e01e5a 0) !important; }
  .c-discord { background: #5865f2 !important; }
  /* A group inside a card (the Customer card's org types, the Resolved card's drafts). */
  .fg { margin: 6px 4px 2px 28px; font-size: 11px; color: var(--faint); text-transform: uppercase;
    letter-spacing: .04em; }

  /* Threads: fixed-height rows, two lines, as in Apple Mail. */
  #threads { background: var(--col); border-left: 1px solid var(--line); border-right: 1px solid var(--line);
    scrollbar-width: none; }
  /* The open thread's lifted row (#lift) is drawn across the list's right edge: no scrollbar there. */
  #threads::-webkit-scrollbar { display: none; }
  #threads .count { padding: 8px 14px; color: var(--mute); font-size: 12px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--col); z-index: 1; }
  .t { height: var(--row-h, 64px); padding: 9px 14px 0 12px; border-bottom: 1px solid var(--line); cursor: pointer;
    display: grid; grid-template-rows: 22px 24px; row-gap: 2px;
    /* Rows out of view skip layout and paint: a filter, a sort or a live update re-lays the
       dozen rows on screen, not all two hundred. Rows are always 64px high (--row-h). */
    content-visibility: auto; contain-intrinsic-size: auto var(--row-h, 64px); }
  .t:hover { background: var(--hover); }
  .t.sel { background: var(--sel); }
  .t .l1, .t .l2 { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .t .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; }
  .t .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t.unread .title { font-weight: 650; }
  .t .when { flex: none; color: var(--mute); font-size: 12px; }
  .t .l2 { padding-left: 17px; font-size: 12px; color: var(--mute); }
  .t .cust { display: flex; align-items: center; gap: 5px; max-width: 34%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .t .cust img { width: 14px; height: 14px; border-radius: 3px; flex: none; }
  .faces { display: flex; flex: none; }
  .faces .av { width: 20px; height: 20px; font-size: 9px; margin-left: -5px; border: 2px solid var(--col); border-radius: 50%; }
  .faces .av:first-child { margin-left: 0; }
  .t .replies { flex: none; }
  .t.unread .replies.re { font-weight: 650; color: var(--accent); }
  .moods { display: flex; flex: none; }
  .moods .em { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px;
    background: var(--card); border: 2px solid var(--col); margin-left: -5px; }
  .moods .em:first-child { margin-left: 0; }
  /* The list's heading: the search box, then the controls (or, while searching, the results' count).
     A wide list puts all three in one row, the search box in the middle. */
  #threads .count { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; container-type: inline-size; }
  #threads .count > .find, #threads .count > .ctl { flex: 1 1 100%; }
  #threads .count .ctl { display: flex; align-items: center; min-height: 22px; }
  #threads .count .lead { display: flex; align-items: center; min-width: 0; }
  #threads .count .sort { margin-left: auto; display: flex; align-items: center; gap: 6px; min-width: 0; }
  /* The two sides share what the search box leaves equally, so it stays centred. */
  @container (min-width: 560px) {
    #threads .count .ctl { display: contents; }
    #threads .count .lead { order: 0; flex: 1 1 0; min-width: max-content; }
    #threads .count > .find { order: 1; flex: 2 1 0; min-width: 240px; max-width: 440px; }
    #threads .count .sort { order: 2; flex: 1 1 0; min-width: max-content; justify-content: flex-end; }
  }
  .find { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 7px 0 9px; cursor: text;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; color: var(--faint); }
  .find:focus-within { border-color: var(--accent); color: var(--mute); }
  .find svg { width: 14px; height: 14px; flex: none; }
  .find input { flex: 1; min-width: 0; padding: 0; border: 0; outline: none; background: transparent;
    color: var(--ink); font: inherit; font-size: 13px; }
  .find input::placeholder { color: var(--faint); }
  .find:focus-within kbd { display: none; }
  @media (hover: none) { .find kbd { display: none; } }
  #threads .count .found { color: var(--mute); }
  #threads .count .clearq { height: 22px; margin-left: 8px; padding: 0 9px; border-radius: 7px; font-size: 11px; color: var(--mute); flex: none; }
  #threads .count .found { flex: none; }
  #threads .count .clearq:hover { color: var(--ink); }
  /* A search result: a third line with the message that matched, the query's words marked. */
  .t.hit { height: 84px; grid-template-rows: 22px 24px 18px; contain-intrinsic-size: auto 84px; }
  .t .l3 { min-width: 0; padding-left: 17px; font-size: 12px; color: var(--mute); overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis; }
  .t .l3 b { color: var(--ink); font-weight: 600; }
  .t .l3 .tag { margin-right: 3px; }
  .t .l3.dim { color: var(--faint); }
  mark { background: color-mix(in srgb, var(--yellow) 32%, transparent); color: inherit; border-radius: 3px; }
  #threads .rows.stale { opacity: .55; transition: opacity .15s; }
  .linkish { padding: 0; border: 0; background: none; color: var(--link); cursor: pointer; text-decoration: underline; }
  /* The message a search result opened the thread at. */
  .msg .bubble { transition: box-shadow .6s ease-out; }
  .msg.found .bubble { box-shadow: 0 0 0 2px var(--yellow); }
  /* Each of your teams, then Personal: one switch, the active one highlighted. */
  #threads .count .order { display: flex; min-width: 0; padding: 1px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--card); font-size: 11px; }
  #threads .count .order button { min-width: 0; max-width: 10em; padding: 1px 8px; border: 0; border-radius: 7px;
    background: none; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #threads .count .order button:hover { color: var(--ink); }
  #threads .count .order button[aria-checked="true"] { background: var(--sel); color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--accent); cursor: default; }
  /* Unread only: an icon, filled with the accent colour while it filters. */
  #threads .count .unread { display: grid; place-items: center; width: 26px; height: 22px; padding: 0;
    border-radius: 7px; color: var(--mute); }
  #threads .count .unread svg { width: 15px; height: 15px; }
  #threads .rows > .older { display: block; width: calc(100% - 28px); margin: 10px 14px 18px; padding: 8px; color: var(--mute); }
  #threads .count .unread:hover { color: var(--ink); }
  #threads .count .unread[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* The bell: notifications for the view on screen (its team and filters), filled while on. */
  #threads .count .bell { display: grid; place-items: center; width: 26px; height: 22px; padding: 0; margin-left: 2px;
    border-radius: 7px; color: var(--mute); }

  .sendwrap .hold[hidden], .sendwrap .hold button[hidden] { display: none; }
  .sendwrap .hold button { white-space: nowrap; font-size: 12.5px; padding: 5px 12px; border-radius: 16px;
    background: var(--card); box-shadow: 0 4px 16px rgba(0,0,0,.18); }
  .sendwrap .resolve { border: 1px solid var(--green); }
  .sendwrap .resolve[aria-pressed="true"] { background: var(--sel); }
  .sendwrap .savedraft { border: 1px solid var(--accent); }
  /* The thread's shared draft, on its own line under the reply box: a dashed card that
     shows who saved it and how it starts (all of it, opened), and sends it as it is. */
  .composer { flex-wrap: wrap; }
  .draftbar { flex-basis: 100%; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--mute); min-width: 0;
    border: 1px dashed var(--accent); border-radius: 10px; padding: 4px 6px 4px 10px;
    background: color-mix(in srgb, var(--accent) 7%, var(--card)); }
  .draftbar[hidden] { display: none; }
  .draftbar .pen { color: var(--accent); font-weight: 600; flex: none; }
  .draftbar .pv { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left;
    font: inherit; color: inherit; background: none; border: 0; padding: 2px 0; border-radius: 6px; }
  .draftbar button.pv { cursor: pointer; }
  .draftbar button.pv:hover .tx, .draftbar button.pv:focus-visible .tx { text-decoration: underline dotted; }
  .draftbar .pv .by { color: var(--faint); margin-right: .5em; }
  .draftbar .pv .tx { color: var(--ink); }
  /* Opened: who and the actions on the first row, all of the draft under them. */
  .draftbar.open { flex-wrap: wrap; }
  .draftbar.open .pv { order: 1; flex-basis: 100%; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 30vh; overflow: auto; }
  .draftbar.open .pv .by { display: block; }
  .draftbar.open .more { margin-left: auto; }
  .draftbar button { font-size: 11.5px; padding: 1px 9px; flex: none; border-radius: 12px; }
  .draftbar .more { padding: 1px 6px; }
  .draftbar .act { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; flex: none; }
  .draftbar .asme { background: var(--me); color: #fff; border-color: var(--me); }
  .draftbar .asbot { border-color: var(--accent); color: var(--accent); }
  .draftbar button:disabled { opacity: .5; cursor: default; }
  /* The draft shown in the reply box while the pointer rests on (or focus is in) its line. */
  .composer textarea.previewing { border-style: dashed; border-color: var(--accent); color: var(--mute);
    background: color-mix(in srgb, var(--accent) 7%, var(--card)); }
  .t .drafted { flex: none; font-size: 11px; font-weight: 600; color: var(--accent); }
  /* Quick reactions on hovering a message, like Slack. */
  .msg .quick { position: absolute; top: -14px; right: 8px; z-index: 3; display: none; gap: 1px; padding: 2px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 3px 12px rgba(0,0,0,.15); }
  .msg.adobe .quick { right: auto; left: 8px; }
  .msg:hover .quick, .msg .quick:focus-within { display: flex; }
  .msg .quick button { border: 0; background: none; font-size: 16px; line-height: 20px; padding: 2px 5px; border-radius: 7px; }
  .msg .quick button:hover, .msg .quick button:focus-visible { background: var(--hover); }
  .msg .quick button[aria-pressed="true"] { background: var(--sel); }
  .msg .quick .more { font-size: 14px; color: var(--mute); }
  .msg .quick .edit { font-size: 14px; color: var(--ink); }
  .msg .quick .edit:not(:last-child) { margin-right: 2px; border-radius: 7px 0 0 7px; box-shadow: 1px 0 0 var(--line); }
  /* Editing one of your messages in place: the bubble is the editor. */
  .msg.editing .col { width: min(74%, 760px); }
  .bubble.editing { position: relative; width: 100%; box-sizing: border-box; padding: 6px 8px 6px; }
  .bubble.editing textarea { display: block; width: 100%; box-sizing: border-box; resize: none; min-height: 38px; max-height: 320px;
    font: inherit; line-height: 1.5; color: var(--ink); background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 6px 10px; outline: none; }
  .bubble.editing textarea:focus { border-color: var(--accent); }
  .bubble.editing .mentions { left: 0; }
  .edithint { font-size: 11.5px; margin: 5px 4px 0; opacity: .85; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .edithint button { font-size: 11.5px; padding: 1px 9px; border-radius: 9px; }
  .edithint button[data-edit-save] { background: var(--card); color: var(--ink); border: 1px solid var(--line); margin-left: auto; }
  .ph .resolved { color: var(--green); }
  .ph .reopened { color: var(--yellow); }
  .toast button, .toast a { margin-left: 10px; font-size: 12px; padding: 1px 8px; color: var(--link); }
  .sys { text-align: center; color: var(--faint); font-size: 12px; margin: 8px 0; }
  /* The thread agent's latest turn, after the last message: on the Adobe side, outlined, as it
     is not a message anyone posted. Solid and tinted while it works. */
  .msg.agent .bubble { background: transparent; color: var(--ink); border: 1.5px dashed color-mix(in srgb, var(--me) 70%, transparent);
    border-radius: 18px; position: relative; }
  /* A thought bubble's trail, dotted: the larger circle flush with the bubble's right edge, the
     smaller one further down, towards the avatar. */
  .msg.agent .col { margin-bottom: 30px; }
  .msg.agent .bubble::before, .msg.agent .bubble::after { content: ''; position: absolute; box-sizing: border-box;
    border-radius: 50%; border: 1.5px dotted; border-color: inherit; background: inherit; }
  .msg.agent .bubble::before { width: 16px; height: 16px; right: -1.5px; bottom: -19px; }
  .msg.agent .bubble::after { width: 9px; height: 9px; right: -5px; bottom: -31px; }
  .msg.agent .bubble a { color: var(--link); }
  .msg.agent .bubble code { background: var(--them-code); }
  .msg.agent.working .bubble { border-style: solid; border-color: color-mix(in srgb, var(--me) 45%, transparent);
    background: color-mix(in srgb, var(--me) 8%, transparent); }
  .msg.agent.failed .bubble { color: var(--mute); }
  .msg.agent .spin { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; vertical-align: -1px;
    border: 2px solid color-mix(in srgb, var(--me) 30%, transparent); border-top-color: var(--me); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .msg.agent .spin { animation: none; } }
  .seen { text-align: right; color: var(--faint); font-size: 11px; margin-top: 6px; }
  .empty { padding: 40px; color: var(--mute); text-align: center; }

  /* Profile cards: who someone is to us, on hover, focus or tap of a name or avatar. */
  [data-p]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .msg .who b[data-p] { cursor: default; }
  .msg .who b[data-p]:hover { text-decoration: underline dotted; text-underline-offset: 2px; }
  .pcard { position: fixed; z-index: 20; width: 290px; padding: 12px 14px; font-size: 12.5px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.3); }
  .pcard[hidden] { display: none; }
  .pcard .top { display: flex; gap: 11px; align-items: center; }
  .pcard .top > div { min-width: 0; }
  .pcard .av { width: 44px; height: 44px; font-size: 15px; border-radius: 11px; }
  .pcard .nm { font-size: 14px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pcard .ttl { color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pcard .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 6px; }
  .pcard .rel { font-size: 11px; font-weight: 650; padding: 1px 8px; border-radius: 9px; color: #fff; }
  .pcard .rel.adobe { background: var(--me); } .pcard .rel.partner { background: #7c3aed; }
  .pcard .rel.customer { background: #c2410c; } .pcard .rel.bot { background: var(--faint); }
  .pcard dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; }
  .pcard dt { color: var(--faint); }
  .pcard dd { margin: 0; min-width: 0; display: flex; gap: 5px; align-items: center; overflow-wrap: anywhere; }
  .pcard dd img { width: 14px; height: 14px; border-radius: 3px; flex: none; }
  .pcard .note { color: var(--mute); font-size: 11.5px; margin-top: 6px; }

  .rv .apply { display: flex; gap: 8px; margin-top: 8px; }
  .rv .apply .send { border-radius: 8px; padding: 3px 12px; background: var(--me); color: #fff; border: 0; }
  .rv .apply .send:disabled { opacity: .45; }
  /* Above a message's quick reactions and the reaction picker, which scroll under it. */
  .rv { position: sticky; top: 0; z-index: 5; box-shadow: 0 6px 16px rgba(0,0,0,.18); margin: 12px 22px 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); font-size: 13px; }
  .rv .q { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 3px 0; }
  .rv .q b { width: 86px; font-weight: 600; }
  .rv button { padding: 1px 8px; font-size: 12px; }
  .rv button.model { border-color: var(--accent); }
  .rv button.picked { background: var(--accent); color: #fff; }
  .rv .hist { color: var(--mute); font-size: 12px; margin-top: 4px; }

  /*
   * Design explorations: three ways of setting unread threads apart in the list, picked with
   * ?design=a|b|c (see DESIGNS in inbox.js). Without one, the list stays as above. Each knows
   * read, unread, hovered, selected (also the lifted copy in #lift), unread and selected,
   * resolved, an unread mention of you and critical or hot, in both themes and every width.
   */
  :root[data-design] .t .ok { flex: none; color: var(--green); font-weight: 700; }
  :root[data-design] .t .at { flex: none; min-width: 18px; height: 17px; padding: 0 5px; border-radius: 9px;
    background: var(--red); color: #fff; font: 650 11px/17px system-ui, sans-serif; text-align: center; }
  :root[data-design] .t .urg { margin-right: 4px; font-size: 12px; }
  :root[data-design] .t .org { display: none; }

  /* A: the smallest change. Unread rows are white (lighter in the dark theme), read rows keep
     a tint a shade deeper than now; unread titles are bold, the time blue. The second line:
     the customer (unless the filters pick one), "Y replies, X mentions", then the latest reply
     as far as it fits before the reactions, grey in unread rows too, so the bold title leads. */
  :root[data-design="a"] { --row-read: #121519; --row-unread: #1f242b; }
  @media (prefers-color-scheme: light) {
    :root[data-design="a"] { --row-read: #eff1f4; --row-unread: #fff; }
  }
  :root[data-design="a"] #threads { background: var(--row-read); }
  :root[data-design="a"] .t { --row-bg: var(--row-read); background: var(--row-bg); }
  :root[data-design="a"] .t.unread { --row-bg: var(--row-unread); }
  :root[data-design="a"] .t:hover { background: color-mix(in srgb, var(--accent) 7%, var(--row-bg)); }
  :root[data-design="a"] .t.sel, :root[data-design="a"] .t.sel:hover { --row-bg: var(--sel); background: var(--sel); }
  :root[data-design="a"] .t .title { font-weight: 400; }
  :root[data-design="a"] .t.unread .title { font-weight: 700; }
  :root[data-design="a"] .t.resolved:not(.unread) .title { color: var(--mute); }
  :root[data-design="a"] .t.unread .when { color: var(--accent); font-weight: 650; }
  :root[data-design="a"] .t .replies { flex: none; white-space: nowrap; }
  :root[data-design="a"] .t .replies .men { color: var(--red); font-weight: 650; }
  :root[data-design="a"] .t .snip { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: var(--mute); }
  :root[data-design="a"] .t .tags { flex: none; }
  :root[data-design="a"] .t .faces .av, :root[data-design="a"] .t .moods .em { border-color: var(--row-bg); }
  :root[data-design="a"] .t .dot.ring { box-shadow: 0 0 0 2px var(--row-bg), 0 0 0 3.5px var(--ring); }

  /* B: after iMessage. A white list without row borders (separators start at the text), the
     customer's logo, the title over two lines of the latest message, the time and a chevron;
     a blue dot at the leading edge for unread. The open thread is solid blue, as in Messages. */
  :root[data-design="b"] { --row-h: 78px; --list-bg: var(--col); --sel-solid: #1f6feb; }
  @media (prefers-color-scheme: light) { :root[data-design="b"] { --list-bg: #fff; } }
  :root[data-design="b"] #threads, :root[data-design="b"] #threads .count { background: var(--list-bg); }
  :root[data-design="b"] .t { --row-bg: var(--list-bg); position: relative; padding-top: 10px; border-bottom: 0;
    grid-template-columns: 16px 42px minmax(0, 1fr) auto; grid-template-rows: 20px 38px; row-gap: 1px; }
  :root[data-design="b"] .t.hit { height: 98px; grid-template-rows: 20px 38px 18px; contain-intrinsic-size: auto 98px; }
  :root[data-design="b"] .t::after { content: ""; position: absolute; right: 0; bottom: 0; height: 1px;
    left: calc(18px + 16px + 42px + 12px); background: var(--line); }
  :root[data-design="b"] .t .l1, :root[data-design="b"] .t .l2 { display: contents; }
  :root[data-design="b"] .t:hover { --row-bg: var(--hover); background: var(--hover); }
  :root[data-design="b"] .t .ud { grid-area: 1 / 1 / 3 / 2; align-self: center; width: 10px; height: 10px;
    margin-left: -3px; border-radius: 50%; background: var(--accent); visibility: hidden; }
  :root[data-design="b"] .t.unread .ud { visibility: visible; }
  :root[data-design="b"] .t .ava { grid-area: 1 / 2 / 3 / 3; align-self: center; width: 42px; height: 42px;
    border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 14px; font-weight: 600;
    position: relative; overflow: hidden; }
  :root[data-design="b"] .t .ava img { position: absolute; inset: 0; width: 100%; height: 100%; padding: 10px;
    object-fit: contain; background: #fff; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); border-radius: 50%; }
  :root[data-design="b"] .t .st { grid-area: 1 / 2 / 3 / 3; align-self: center; justify-self: end; z-index: 1;
    width: 14px; height: 14px; margin: 26px -3px 0 0; border-radius: 50%; border: 2.5px solid var(--row-bg); }
  :root[data-design="b"] .t .st.ring { outline: 1.5px solid var(--ring, var(--accent)); outline-offset: 0; }
  :root[data-design="b"] .t .st.c-critical { --ring: #8e1b1b; } :root[data-design="b"] .t .st.c-hot { --ring: var(--red); }
  :root[data-design="b"] .t .st.c-you { --ring: var(--accent); } :root[data-design="b"] .t .st.c-waiting { --ring: var(--yellow); }
  :root[data-design="b"] .t .title { grid-area: 1 / 3; align-self: center; margin-left: 12px; font-weight: 500;
    font-size: 14.5px; line-height: 20px; }
  :root[data-design="b"] .t.unread .title { font-weight: 700; }
  :root[data-design="b"] .t .side { grid-area: 1 / 4; display: flex; align-items: center; gap: 5px; margin-left: 8px;
    color: var(--mute); font-size: 12.5px; }
  :root[data-design="b"] .t .when { color: inherit; font-size: inherit; }
  :root[data-design="b"] .t .chev { color: var(--faint); font-size: 19px; line-height: 1; margin-top: -2px; }
  :root[data-design="b"] .t .pv { grid-area: 2 / 3 / 3 / 5; margin-left: 12px; font-size: 13px; line-height: 18px;
    color: var(--mute); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2;
    overflow: hidden; overflow-wrap: anywhere; }
  :root[data-design="b"] .t.unread .pv { color: color-mix(in srgb, var(--ink) 72%, var(--mute)); }
  :root[data-design="b"] .t .pv .org { display: inline; font-weight: 600; color: var(--ink); }
  :root[data-design="b"] .t .pv .org::after { content: " \00b7"; font-weight: 400; color: var(--mute); }
  :root[data-design="b"] .t .pv .drafted { margin-right: 4px; color: var(--red); font-size: inherit; }
  :root[data-design="b"] .t .pv .drafted::after { content: ":"; }
  :root[data-design="b"] .t .l3 { grid-area: 3 / 3 / 4 / 5; margin-left: 12px; padding-left: 0; }
  :root[data-design="b"] .t.resolved:not(.unread) .title { color: var(--mute); }
  :root[data-design="b"] .t.sel, :root[data-design="b"] .t.sel:hover, :root[data-design="b"] #lift .t {
    --row-bg: var(--sel-solid); background: var(--sel-solid); color: #fff; }
  :root[data-design="b"] .t.sel::after, :root[data-design="b"] #lift .t::after { display: none; }
  :root[data-design="b"] .t.sel .pv, :root[data-design="b"] .t.sel .side, :root[data-design="b"] .t.sel .chev,
  :root[data-design="b"] .t.sel .pv .org, :root[data-design="b"] .t.sel .pv .org::after,
  :root[data-design="b"] .t.sel .ok, :root[data-design="b"] .t.sel .pv .drafted, :root[data-design="b"] .t.sel.sel .title { color: #fff; }
  :root[data-design="b"] .t.sel .pv { color: rgba(255,255,255,.85); }
  :root[data-design="b"] .t.sel .ud { background: #fff; }
  :root[data-design="b"] .t.sel .at { background: #fff; color: var(--sel-solid); }
  :root[data-design="b"] #lift .t { border-color: var(--sel-solid); padding-top: calc(10px + var(--lv) - 1px); }
  @media (max-width: 699px) {
    :root[data-design="b"] .t::after { left: calc(14px + 16px + 42px + 12px); }
  }

  /* C: dense, and what is read recedes. A white list without borders; a thread this page has
     shown unread gets two lines in full ink (bold title, blue time, who wrote last); a read one
     is one greyed line: title, customer, time. Rows keep their height once read. */
  :root[data-design="c"] { --row-h: 60px; --row-short: 36px; --list-bg: var(--col); }
  @media (prefers-color-scheme: light) { :root[data-design="c"] { --list-bg: #fff; } }
  @media (pointer: coarse) { :root[data-design="c"] { --row-short: 44px; } }
  :root[data-design="c"] #threads, :root[data-design="c"] #threads .count { background: var(--list-bg); }
  :root[data-design="c"] .t { --row-bg: var(--list-bg); padding-top: 9px; border-bottom: 0;
    grid-template-rows: 22px 20px; row-gap: 1px; }
  :root[data-design="c"] .t.short { --row-h: var(--row-short); padding-top: calc((var(--row-short) - 22px) / 2);
    grid-template-rows: 22px; }
  :root[data-design="c"] .t.hit { height: 80px; grid-template-rows: 22px 20px 18px; contain-intrinsic-size: auto 80px; }
  :root[data-design="c"] .t.short .l2 { display: none; }
  :root[data-design="c"] .t:hover { --row-bg: var(--hover); background: var(--hover); }
  :root[data-design="c"] .t.sel, :root[data-design="c"] .t.sel:hover { --row-bg: var(--sel); background: var(--sel); }
  :root[data-design="c"] .t .title { font-weight: 400; color: var(--mute); }
  :root[data-design="c"] .t.unread .title { font-weight: 650; color: var(--ink); }
  :root[data-design="c"] .t.sel.sel .title { color: var(--ink); }
  :root[data-design="c"] .t .when { color: var(--faint); }
  :root[data-design="c"] .t.unread .when { color: var(--accent); font-weight: 650; }
  :root[data-design="c"] .t.short .org { display: block; flex: none; max-width: 30%; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; color: var(--faint); font-size: 12px; }
  :root[data-design="c"] .t:not(.unread) .dot { opacity: .5; }
  :root[data-design="c"] .t.short .dot { width: 7px; height: 7px; margin: 0 1px; }
  :root[data-design="c"] .t .dot.ring { box-shadow: 0 0 0 2px var(--row-bg), 0 0 0 3.5px var(--ring); }
  :root[data-design="c"] .t .l2 { gap: 6px; color: var(--faint); }
  :root[data-design="c"] .t.unread .l2 { color: var(--mute); }
  :root[data-design="c"] .t .l2 .last::before, :root[data-design="c"] .t .l2 .replies::before { content: "\00b7"; margin-right: 6px; }
  :root[data-design="c"] .t.unread .l2 .replies { color: var(--accent); font-weight: 600; }
  :root[data-design="c"] .t:not(.unread) .cust img { filter: grayscale(1); opacity: .6; }
  :root[data-design="c"] .t.resolved .title { color: var(--faint); }
  :root[data-design="c"] .t.resolved.unread .title { color: var(--ink); }
  :root[data-design="c"] .t.short .drafted, :root[data-design="c"] .t.short .ok { font-size: 11px; }
  :root[data-design="c"] #lift .t.short { padding-top: calc((var(--row-short) - 22px) / 2 + var(--lv) - 1px); }

  /*
   * Narrower screens. The thread list's heading has a Filters button there, and an open thread
   * a back button; both are hidden while there is room for all three columns.
   *
   * Under 1100px (a phone on its side, an unfolded iPhone Duo, a tablet upright) the filter
   * cards move into a drawer over the page's left edge, opened from the list's heading or by a
   * swipe to the right over the list, and closed by a swipe to the left (or a tap beside it); the
   * list and the open thread share the width. Under 700px (phones, a folded iPhone Duo) the
   * list and the open thread take turns: opening a thread slides it in over the list, and its
   * back button, or the browser's Back, slides it out again. Both stay laid out (visibility,
   * not display), so the list keeps its scroll position and a thread opens scrolled to where
   * it should.
   */
  .menu { max-width: calc(100vw - 24px); max-height: calc(100dvh - var(--head) - 8px); overflow-y: auto;
    overscroll-behavior: contain; }
  .toast { max-width: calc(100vw - 24px); }
  #threads .count .filt, .ph .close { display: none; }
  #threads .count .filt { align-items: center; gap: 5px; height: 22px; padding: 0 8px; margin-right: 10px;

<body>
<header>
  <h1><img src="/apple-touch-icon.png" alt="">opspile</h1>
  <nav class="pages" id="pages" hidden aria-label="Admin pages"><a id="inbox" href="/inbox" aria-current="page">Inbox</a><a id="kb" href="/inbox/kb" title="Thread agents: their knowledge bases, channels, MCP servers and instructions (admin team and team managers): the open thread's customer, else this team">Agents</a><a id="adminPage" href="/inbox/admin" title="Teams, members, rules, and customers, partners and vendors (admin team)">Admin</a></nav>

  </div>
</header>
<main>
  <section id="filters" aria-label="Filters"></section>
  <section id="threads" aria-label="Threads"><div class="empty">Loading…</div></section>
  <section id="pane" aria-label="Messages"><div class="empty">Pick a thread.</div></section>
  <div id="lift" inert aria-hidden="true" hidden></div>
