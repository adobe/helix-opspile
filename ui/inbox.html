<!doctype html>
<html lang="en" class="spectrum">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Enterprise Support</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="rgb(17, 17, 17)" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="rgb(255, 255, 255)" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Support">
<!-- Spectrum 2 (README, "Spectrum 2"): its typefaces, the tokens the stylesheets use, what every
     page shares (the header too), and this page's own: its layout, then its look. -->
<link rel="stylesheet" href="spectrum-fonts.css">
<link rel="stylesheet" href="spectrum-tokens.css">
<link rel="stylesheet" href="spectrum.css">
<link rel="stylesheet" href="spectrum-inbox.css">
</head>
<body>
<header>
  <h1><a data-page="inbox" href="/inbox"><img src="/icon.svg" alt="Adobe"><span>Enterprise Support</span></a></h1>
  <nav class="pages" id="pages" hidden aria-label="Pages"></nav>
  <span class="divider" id="toolsep" hidden></span>
  <button id="review" class="tool" hidden title="Review Clef labels (admin team)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2.5h5.6l6.4 6.4-5.1 5.1L2.5 7.6V2.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="5.2" cy="5.7" r="1.2" fill="currentColor"/></svg>Review labels</button>
  <span class="spacer"></span>
  <span id="offline" class="note" hidden title="Live updates stopped; trying again">Reconnecting…</span>
  <button id="reviewing" class="mode review" hidden title="Reviewing Clef labels. Click to stop."><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2.5h5.6l6.4 6.4-5.1 5.1L2.5 7.6V2.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="5.2" cy="5.7" r="1.2" fill="currentColor"/></svg><span class="lbl">Reviewing labels</span><span class="x" aria-hidden="true">✕</span></button>
  <button id="viewing" class="mode as" hidden title="Read-only. Click to see your own inbox again."></button>
  <button id="user" popovertarget="menu" aria-haspopup="true" aria-expanded="false" aria-label="Account, team and shortcuts">
    <span class="av" id="userAv"></span>
    <span class="who"><span class="nm" id="me"></span><span class="sub" id="userSub"></span></span>
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div id="menu" class="menu" popover>
    <div class="id"><span class="av" id="menuAv"></span><div><div class="nm" id="menuName"></div><div class="sub" id="menuEmail"></div></div></div>
    <section id="asBox" hidden><h4><label for="as">View as</label></h4><select id="as"></select>
      <p class="hint">See the inbox as someone else, read-only.</p></section>
    <section id="notifyBox" hidden><h4>Notifications</h4>
      <button class="item" id="notifyMentions" role="switch" aria-checked="true"><span class="ck">✓</span>When someone mentions me</button>
      <button class="item" id="notifyThreads" role="switch" aria-checked="true" title="Threads you posted in, were mentioned in or put 👀 on"><span class="ck">✓</span>When someone writes in my threads</button>
      <button class="item" id="notifySound" role="switch" aria-checked="true" title="On this device: a chime with each notification"><span class="ck">✓</span>Play a sound</button>
      <div id="bells"></div>
      <p class="hint" id="notifyHint"></p>
      <button class="item allow" id="notifyAllow" hidden>Allow notifications in this browser</button></section>
    <section id="tracesBox" hidden><h4>Thread Agent</h4>
      <button class="item" id="tracesAll" role="switch" aria-checked="true"><span class="ck">✓</span>Show its thinking under threads</button>
      <div id="tracesHere" hidden><label class="hint" for="tracesChannel" id="tracesChannelLabel"></label><select id="tracesChannel">
        <option value="">As everywhere</option><option value="on">Shown</option><option value="off">Hidden</option></select></div>
      <p class="hint" id="tracesHint"></p></section>
    <section><h4>Keyboard</h4><dl class="keys">
      <dt>Search, on every platform</dt><dd><kbd>/</kbd></dd>
      <dt>Next / previous thread</dt><dd><kbd>j</kbd> <kbd>k</kbd></dd>
      <dt title="with ✅ on its first message, or take your ✅ off again">Resolve the open thread</dt><dd><kbd>e</kbd></dd>
      <dt title="in the reply box: your team sees it">Save the reply as a draft</dt><dd><kbd>⌘S</kbd></dd>
      <dt title="or the ≠ beside it; click it again to stop excluding">Exclude a filter value</dt><dd><kbd>⇧</kbd> click</dd>
    </dl></section>
    <section><a class="item" id="logout" href="/cdn-cgi/access/logout"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5H3.5v11H6M10 5l3 3-3 3M13 8H6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Log out</a></section>
  </div>
</header>
<script src="header.js"></script>
<main>
  <section id="filters" aria-label="Filters"></section>
  <section id="threads" aria-label="Threads"><div class="empty">Loading…</div></section>
  <section id="pane" aria-label="Messages"><div class="empty">Pick a thread.</div></section>
  <div id="lift" inert aria-hidden="true" hidden></div>
</main>
<script src="markdown.js"></script>
<script src="rank.js"></script>
<script src="table.js"></script>
<script type="module" src="inbox.js"></script>
<script src="app.js"></script>
</body>
</html>
