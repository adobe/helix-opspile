<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>opspile</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #0f1114; --col: #15181c; --card: #1a1e23; --line: #2a2f36; --hover: #20252b;
    --ink: #e8eaed; --mute: #8b929b; --faint: #5d646d;
    --accent: #5aa2ff; --link: #7cc0ff; --sel: #1f2a38;
    --red: #e5534b; --yellow: #d4a72c; --green: #57ab5a; --purple: #a371f7;
    --me: #2f7cf6; --me-ink: #fff; --me-link: #fff;
    --them: #2b3037; --them-ink: #e8eaed; --them-code: rgba(0,0,0,.25);
    --pane: #0f1114;
    --code: #0b0d10;
    font: 14px/1.45 "Adobe Clean", adobe-clean, "Source Sans 3", "Source Sans Pro",
      -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eceef1; --col: #f6f7f9; --card: #fff; --line: #dfe2e6; --hover: #eef1f5;
      --ink: #1d2025; --mute: #616a75; --faint: #9aa1aa; --accent: #1f6feb; --link: #0b5cc4;
      --sel: #dde9fb; --purple: #8250df; --them: #e1e5ea; --them-ink: #1d2025; --code: #f3f4f6;
      /* A white pane, so customer bubbles stand out (1.27:1) as Adobe's blue ones do. */
      --pane: #fff; --them-code: rgba(0,0,0,.08); --them-link: #0a4fa8;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { margin: 0; background: var(--bg); display: flex; flex-direction: column; }
  button, select { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line);
    border-radius: 7px; padding: 3px 9px; cursor: pointer; }
  /* The toolbar: pages and label review on the left; on the right, whoever is signed in, with a
     menu for the team, "View as" (admin team), the keyboard shortcuts and logging out. */
  header { display: flex; gap: 10px; align-items: center; height: 50px; padding: 0 12px 0 14px; flex: none;
    background: var(--col); border-bottom: 1px solid var(--line); }
  header h1 { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; margin: 0 8px 0 0;
    letter-spacing: .01em; }
  header h1 img { width: 22px; height: 22px; border-radius: 6px; }
  header .spacer { flex: 1; }
  header .tool { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 11px; color: var(--mute); }
  header .tool:hover { color: var(--ink); background: var(--hover); }
  header .tool svg { width: 14px; height: 14px; flex: none; }
  #review[aria-pressed="true"] { color: var(--ink); background: var(--sel); border-color: var(--accent); }
  /* Inbox ↔ knowledge bases, for the admin team: the same switch in both pages' header. */
  nav.pages { display: inline-flex; height: 30px; background: var(--card); border: 1px solid var(--line); border-radius: 7px;
    overflow: hidden; }
  nav.pages[hidden] { display: none; }
  nav.pages a { display: flex; align-items: center; color: var(--mute); text-decoration: none; padding: 0 11px; }
  nav.pages a + a { border-left: 1px solid var(--line); }
  nav.pages a:hover { color: var(--ink); background: var(--hover); }
  nav.pages a[aria-current="page"] { color: var(--ink); background: var(--sel); cursor: default;
    box-shadow: inset 0 0 0 1px var(--accent); border-radius: 6px; }
  nav.pages a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* Live updates are only worth a word when they stop. */
  #offline { color: var(--yellow); font-size: 12.5px; }
  /* Read-only "View as": loud enough not to be forgotten, and one click to leave. */
  #viewing { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 6px 0 11px; font-size: 13px;
    color: var(--ink); background: color-mix(in srgb, var(--yellow) 18%, var(--card));
    border-color: color-mix(in srgb, var(--yellow) 55%, var(--line)); border-radius: 15px; }
  #viewing[hidden] { display: none; }
  #viewing .x { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; color: var(--mute); }
  #viewing:hover .x { color: var(--ink); background: color-mix(in srgb, var(--yellow) 30%, transparent); }
  #user { display: flex; align-items: center; gap: 9px; height: 38px; padding: 0 8px 0 4px; border-color: transparent;
    background: none; border-radius: 10px; text-align: left; }
  #user:hover, #user[aria-expanded="true"] { background: var(--hover); border-color: var(--line); }
  #user .av, .menu .av { width: 28px; height: 28px; border-radius: 50%; font-size: 11px; }
  #user .who { display: flex; flex-direction: column; line-height: 1.2; }
  #user .nm { font-weight: 600; font-size: 13px; white-space: nowrap; }
  #user .sub { color: var(--mute); font-size: 11.5px; white-space: nowrap; }
  #user svg { width: 12px; height: 12px; color: var(--mute); }
  .menu { position: fixed; inset: 46px 12px auto auto; margin: 0; width: 290px; padding: 6px; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0,0,0,.22), 0 2px 6px rgba(0,0,0,.12); font-size: 13px; }
  .menu .id { display: flex; gap: 10px; align-items: center; padding: 8px 8px 10px; }
  .menu .id .av { width: 36px; height: 36px; font-size: 13px; }
  .menu .id .nm { font-weight: 650; font-size: 14px; }
  .menu .id .sub { color: var(--mute); font-size: 12px; overflow-wrap: anywhere; }
  .menu section { border-top: 1px solid var(--line); padding: 6px 0; }
  .menu section[hidden] { display: none; }
  .menu h4 { margin: 4px 8px 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--faint); }
  .menu .item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 8px; border: 0; border-radius: 7px;
    background: none; color: inherit; text-decoration: none; text-align: left; cursor: pointer; }
  .menu .item:hover, .menu .item:focus-visible { background: var(--hover); outline: none; }
  .menu .item .ck { width: 14px; color: var(--accent); flex: none; visibility: hidden; }
  .menu .item[aria-checked="true"] { font-weight: 600; }
  .menu .item[aria-checked="true"] .ck { visibility: visible; }
  .menu .item svg { width: 14px; height: 14px; flex: none; }
  .menu select { width: calc(100% - 16px); margin: 2px 8px 4px; padding: 4px 8px; }
  .menu .hint { margin: 0 8px 4px; color: var(--mute); font-size: 11.5px; }
  .menu .keys { display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; margin: 2px 8px 4px; color: var(--mute); }
  .menu .keys dd { margin: 0; text-align: right; }
  main { flex: 1; display: grid; grid-template-columns: 270px minmax(380px, 34%) 1fr; min-height: 0; }
  main > section { overflow: auto; min-height: 0; overscroll-behavior: contain; }

  /* Filters: one card per facet, as in klickhaus. */
  #filters { padding: 12px; background: var(--bg); display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 8px; }
  .card h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 14px; }
  .card h3::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .card h3 .clear { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--mute); cursor: pointer; }
  .card h3 .clear:hover { color: var(--ink); }
  .fr { display: grid; grid-template-columns: 4px 18px 1fr auto 56px; gap: 6px; align-items: center;
    padding: 4px 4px; border-radius: 6px; cursor: pointer; }
  .fr:hover { background: var(--hover); }
  .fr.on { background: var(--sel); }
  .fr .ind { width: 3px; height: 16px; border-radius: 2px; background: var(--faint); }
  .fr .ico { width: 16px; height: 16px; border-radius: 3px; }
  .fr .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fr .lab.dim { color: var(--faint); }
  .fr .n { font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--mute); text-align: right; }
  .fr .bar { height: 7px; border-radius: 4px; background: var(--faint); min-width: 2px; }
  .fr .bar.stack { display: flex; overflow: hidden; background: none; gap: 1px; }
  .fr .bar.stack i { display: block; height: 100%; min-width: 2px; }
  .c-red { background: var(--red) !important; } .c-yellow { background: var(--yellow) !important; }
  .c-green { background: var(--green) !important; } .c-none { background: var(--faint) !important; }
  .c-critical { background: #8e1b1b !important; } .c-hot { background: var(--red) !important; }
  .c-you { background: var(--accent) !important; } .c-waiting { background: var(--yellow) !important; }
  .c-silent { background: var(--purple) !important; }
  .c-team { background: var(--green) !important; } .c-quiet { background: var(--faint) !important; }
  .fr .ico.em { font-size: 13px; line-height: 16px; text-align: center; }
  .c-accent { background: var(--accent) !important; }

  /* Threads: fixed-height rows, two lines, as in Apple Mail. */
  #threads { background: var(--col); border-left: 1px solid var(--line); border-right: 1px solid var(--line);
    scrollbar-width: none; }
  /* The open thread's lifted row (#lift) is drawn across the list's right edge: no scrollbar there. */
  #threads::-webkit-scrollbar { display: none; }
  #threads .count { padding: 8px 14px; color: var(--mute); font-size: 12px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--col); z-index: 1; }
  .t { height: 64px; padding: 9px 14px 0 12px; border-bottom: 1px solid var(--line); cursor: pointer;
    display: grid; grid-template-rows: 22px 24px; row-gap: 2px; }
  .t:hover { background: var(--hover); }
  .t.sel { background: var(--sel); }
  .t .l1, .t .l2 { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .t .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; }
  .t .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t.unread .title { font-weight: 650; }
  .t .when { flex: none; color: var(--mute); font-size: 12px; }
  .t .l2 { padding-left: 17px; font-size: 12px; color: var(--mute); }
  .t .cust { display: flex; align-items: center; gap: 5px; max-width: 34%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .t .cust img { width: 14px; height: 14px; border-radius: 3px; flex: none; }
  .faces { display: flex; flex: none; }
  .faces .av { width: 20px; height: 20px; font-size: 9px; margin-left: -5px; border: 2px solid var(--col); border-radius: 50%; }
  .faces .av:first-child { margin-left: 0; }
  .t .replies { flex: none; }
  .moods { display: flex; flex: none; }
  .moods .em { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px;
    background: var(--card); border: 2px solid var(--col); margin-left: -5px; }
  .moods .em:first-child { margin-left: 0; }
  #threads .count { display: flex; align-items: center; }
  #threads .count .sort { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  /* Smart and Recent: one switch, the active side highlighted. */
  #threads .count .order { display: flex; padding: 1px; border-radius: 9px; font-size: 11px; }
  #threads .count .order span { padding: 1px 8px; border-radius: 7px; color: var(--mute); }
  #threads .count .order span.on { background: var(--sel); color: var(--ink); box-shadow: inset 0 0 0 1px var(--accent); }
  /* Unread only: an icon, filled with the accent colour while it filters. */
  #threads .count .unread { display: grid; place-items: center; width: 26px; height: 22px; padding: 0;
    border-radius: 7px; color: var(--mute); }
  #threads .count .unread svg { width: 15px; height: 15px; }
  #threads .count .unread:hover { color: var(--ink); }
  #threads .count .unread[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .t .tags { margin-left: auto; display: flex; gap: 4px; overflow: hidden; flex-shrink: 1; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 9px; border: 1px solid var(--line); white-space: nowrap; color: var(--mute); }
  .tag.hot { color: var(--red); border-color: var(--red); }
  .tag.us { color: var(--yellow); border-color: var(--yellow); }
  .t .dot { --ring: var(--faint); }
  .t .dot.c-critical { --ring: #8e1b1b; } .t .dot.c-hot { --ring: var(--red); } .t .dot.c-you { --ring: var(--accent); }
  .t .dot.c-waiting { --ring: var(--yellow); } .t .dot.c-silent { --ring: var(--purple); }
  .t .dot.c-team { --ring: var(--green); }
  .t .dot.ring { box-shadow: 0 0 0 2px var(--col), 0 0 0 3.5px var(--ring); }
  .t.sel .dot.ring { box-shadow: 0 0 0 2px var(--sel), 0 0 0 3.5px var(--ring); }
  .t .dot.ring:not([class*="c-"]) { background: transparent; }

  /*
   * Depth: the messages pane is lowest, the thread list above it, the filter cards on top.
   * The filter cards stick out of the page's left edge and hang over the thread list by a
   * third of their corner radius, two thirds while one of their filters is on, all of it
   * under the pointer. They need room to do so (and to cast their shadow): the filter
   * column reaches into the thread list by --fg, and lets the pointer through where it has
   * no card. The open thread's row is lifted out of its column, over the pane, by a copy
   * of it in #lift (see syncLift), since the list's scroller would clip it. It floats over
   * the list's heading and the open thread's header, and the list shows no scrollbar for it
   * to cover.
   */
  :root { --r: 14px; --fg: 48px;
    --card-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.7);
    --lift-shadow: 0 0 0 1px rgba(0,0,0,.4), 8px 6px 24px 2px rgba(0,0,0,.8); }
  @media (prefers-color-scheme: light) {
    :root { --card-shadow: 0 1px 3px rgba(20,30,50,.10), 0 8px 22px rgba(20,30,50,.16);
      --lift-shadow: 0 2px 4px rgba(20,30,50,.12), 8px 6px 22px 2px rgba(20,30,50,.24); }
  }
  main { position: relative; background: var(--bg); }
  #filters { position: relative; z-index: 3; background: transparent; pointer-events: none;
    margin-right: calc(-1 * var(--fg)); padding: 12px calc(var(--fg) - var(--r) / 3) 12px 0;
    overflow-x: hidden; scrollbar-width: none; }
  #filters::-webkit-scrollbar { display: none; }
  #filters .card { pointer-events: auto; margin-left: calc(-1 * var(--r)); padding-left: calc(var(--r) + 18px);
    border-left: 0; border-radius: 0 var(--r) var(--r) 0; box-shadow: var(--card-shadow);
    transition: transform .18s ease-out; }
  #filters .card.active { transform: translateX(calc(var(--r) / 3)); }
  #filters .card:hover { transform: translateX(calc(var(--r) * 2 / 3)); }
  #filters .card.active:hover { transform: translateX(var(--r)); }
  @media (prefers-reduced-motion: reduce) { #filters .card { transition: none; } }
  /* Room for the filter cards' overhang, so they never cover a status dot. */
  .t { padding-left: 18px; }
  #threads .count { padding-left: 18px; }
  #lift { position: absolute; z-index: 2; overflow: hidden; pointer-events: none; }
  #lift .t { position: absolute; margin: 0; border: 1px solid var(--accent); border-radius: 10px;
    background: var(--sel); box-shadow: var(--lift-shadow);
    padding: calc(9px + var(--lv) - 1px) calc(14px + var(--lr) - 1px) 0 calc(18px + var(--ll) - 1px); }
  #lift .t .faces .av { border-color: var(--sel); }
  .t.enter { animation: push-in .35s ease-out; overflow: hidden; }
  @keyframes push-in { from { height: 0; padding-top: 0; opacity: 0; } to { height: 64px; opacity: 1; } }
  .msg.enter, .sys.enter { animation: rise .35s ease-out; }
  @keyframes rise { from { transform: translateY(18px); opacity: 0; } to { transform: none; opacity: 1; } }
  .msg.pending .bubble { opacity: .55; }
  .post { display: flex; align-items: center; gap: 8px; color: var(--mute); font-size: 12px; margin: 18px 0 4px; }
  .post::before, .post::after { content: ""; flex: 1; border-top: 1px dashed var(--line); }
  .composer { flex: none; border-top: 1px solid var(--line); padding: 10px 22px 12px; display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea { flex: 1; resize: none; min-height: 38px; max-height: 180px; font: inherit; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 19px; padding: 8px 14px; outline: none; }
  .composer textarea:focus { border-color: var(--accent); }
  .composer button.send { border-radius: 19px; padding: 7px 16px; background: var(--me); color: #fff; border: 0; }
  .composer button.send:disabled { opacity: .5; cursor: default; }
  .composer { position: relative; }
  .mentions { position: absolute; left: 22px; bottom: calc(100% - 4px); min-width: 260px; max-width: 360px; margin: 0; padding: 4px;
    list-style: none; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.25); z-index: 5; }
  .mentions li { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 7px; cursor: pointer; }
  .mentions li.on { background: var(--sel); }
  .mentions .av { width: 22px; height: 22px; font-size: 9px; border-radius: 6px; }
  .mentions .hint { margin-left: auto; color: var(--faint); font-size: 11px; }
  .composer .connect { color: var(--mute); font-size: 13px; }
  .composer .connect a { color: var(--link); }
  dialog.confirm { max-width: min(560px, 92vw); background: var(--card); color: var(--ink); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 18px; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  dialog.confirm::backdrop { background: rgba(0,0,0,.35); }
  dialog.confirm p { margin: 0 0 10px; }
  dialog.confirm .bubble { max-height: 40vh; overflow: auto; }
  dialog.confirm .apply { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  dialog.confirm .send { border-radius: 8px; padding: 4px 14px; background: var(--me); color: #fff; border: 0; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 14px; font-size: 13px; z-index: 10; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--mute); }
  .back { color: var(--link); text-decoration: none; font-size: 12px; white-space: nowrap; }
  .back:hover { text-decoration: underline; }

  .av { width: 36px; height: 36px; border-radius: 9px; flex: none; display: grid; position: relative;
    place-items: center; font-size: 13px; font-weight: 600; color: #fff; overflow: hidden; }
  .av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* Messages: bubbles, customers left, Adobe right. */
  #pane { display: flex; flex-direction: column; overflow: hidden; background: var(--pane); }
  #pane .scroller { flex: 1; overflow: auto; overscroll-behavior: contain; }
  .ph { padding: 12px 22px; border-bottom: 1px solid var(--line); background: var(--pane); flex: none; }
  .ph h2 { margin: 0 0 3px; font-size: 17px; display: flex; gap: 10px; align-items: baseline; }
  .ph .sub { color: var(--mute); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .ph .sub img { width: 14px; height: 14px; border-radius: 3px; }
  .ph .sub.stack { margin-top: 4px; }
  .tag.tech { color: var(--ink); }
  .feed { padding: 8px 22px 40px; }
  .day { text-align: center; margin: 18px 0 8px; }
  .day span { font-size: 12px; font-weight: 600; color: var(--mute); border: 1px solid var(--line); border-radius: 12px; padding: 3px 12px; }
  .divider { display: flex; align-items: center; gap: 10px; color: var(--mute); font-size: 12px; margin: 14px 0 6px; }
  .divider::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .msg { display: flex; gap: 10px; align-items: flex-end; margin-top: 10px; }
  .msg.cont { margin-top: 3px; }
  .msg .face { position: relative; flex: none; width: 36px; }
  .msg .face .badge-ico { position: absolute; right: -4px; bottom: -4px; width: 16px; height: 16px; border-radius: 4px;
    background: #fff; border: 2px solid var(--pane); }
  .msg.cont .face { visibility: hidden; height: 0; }
  .msg.adobe { flex-direction: row-reverse; }
  .msg .col { max-width: min(74%, 760px); display: flex; flex-direction: column; align-items: flex-start; }
  .msg.adobe .col { align-items: flex-end; }
  .msg .who { font-size: 12px; color: var(--mute); margin: 0 12px 3px; }
  .msg .who b { color: var(--ink); font-weight: 600; }
  .msg.cont .who { display: none; }
  .bubble { background: var(--them); color: var(--them-ink); padding: 8px 13px; border-radius: 18px;
    border-bottom-left-radius: 5px; overflow-wrap: anywhere; line-height: 1.5; }
  .msg.adobe .bubble { background: var(--me); color: var(--me-ink); border-bottom-left-radius: 18px; border-bottom-right-radius: 5px; }
  .bubble a { color: var(--them-link, var(--link)); text-decoration: underline; text-underline-offset: 2px; }
  .msg.adobe .bubble a { color: var(--me-link); }
  .bubble p { margin: 0; }
  .bubble p + p { margin-top: 8px; }
  .bubble code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--them-code); padding: 1px 4px; border-radius: 4px; }
  .msg.adobe .bubble code { background: rgba(0,0,0,.25); }
  .bubble pre { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); color: var(--ink);

  /* Lightbox: an image full screen, dismissed by a click anywhere, the close button or Escape. */

    border-radius: 8px; padding: 4px 10px; font-size: 13px; text-decoration: none; cursor: pointer; }
  dialog.lightbox .bar a:hover, dialog.lightbox .bar button:hover { background: rgba(255,255,255,.15); }
  body:has(dialog.lightbox[open]) .scroller { overflow: hidden; }
  .bubble .mention { font-weight: 600; }

  .msg .meta { font-size: 11px; color: var(--faint); margin: 3px 12px 0; min-height: 15px; }
  .msg .meta a { visibility: hidden; }
  .msg:hover .meta a { visibility: visible; }
  .msg .meta a { color: inherit; }
  .rx { display: flex; gap: 4px; flex-wrap: wrap; margin: 4px 6px 0; }

  .ph .resolved { color: var(--green); }

  .toast button, .toast a { margin-left: 10px; font-size: 12px; padding: 1px 8px; color: var(--link); }
  .sys { text-align: center; color: var(--faint); font-size: 12px; margin: 8px 0; }

  /* Profile cards: who someone is to us, on hover, focus or tap of a name or avatar. */

<script>/* MARKDOWN */</script>
<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const state = {
  me: null, team: null, data: null, open: null, ws: null, review: null, answers: null,
  sel: { type: new Set(['conversation']) },
  order: [], prevKeys: null, shownIds: null, sending: [], sort: 'smart', unread: false, keep: new Set(), scores: new Map(),
  cache: new Map(), staged: {}, profiles: new Map(), composers: new Map(),
};

// ---------------------------------------------------------------- helpers
async function get(path) {
  const res = await fetch(path, { credentials: 'same-origin', headers: state.as ? { 'x-opspile-as': String(state.as) } : {} });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.status);
  return res.json();
}
function ago(iso) {
  if (!iso) return '';
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 60) return 'now';
  if (s < 3600) return `${Math.floor(s / 60)}m`;
  if (s < 86400) return `${Math.floor(s / 3600)}h`;
  if (s < 7 * 86400) return `${Math.floor(s / 86400)}d`;
  return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}
const clock = (iso) => new Date(iso).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
function dayLabel(iso) {
  const d = new Date(iso);
  const today = new Date(); const y = new Date(Date.now() - 86400000);
  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
}
const platform = (t) => (t.source === 'slack' ? 'Slack' : 'Teams');
const lastOf = (t) => (t.kind === 'alert' ? t.any_at : t.last_at);
const favicon = (domain) => (/^https:\/\//.test(domain) ? domain
  : `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64`);
// An org as the admin team set it up (/inbox/admin): its name and icon, else the slug and
// the favicon of the customer's usual mail domain. `favicon()` takes either.
const orgName = (t) => t.org_name || t.org;
const orgIcon = (t) => t.org_icon || t.customerDomain || null;
const ORG_TYPE = { partner: 'Partner', vendor: 'Vendor' };
const backlink = (t, label) => (t.permalink
  ? `<a class="back" href="${esc(t.permalink)}" target="_blank" rel="noopener" title="Open in ${platform(t)}">${esc(label || `↗ ${platform(t)}`)}</a>` : '');

const COLORS = ['#c2410c', '#0f766e', '#7c3aed', '#be185d', '#1d4ed8', '#4d7c0f', '#a16207', '#0e7490'];
function hue(name) { let h = 0; for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
const initials = (name) => String(name || '?').replace(/\(.*?\)/g, '').split(/[\s,]+/).filter(Boolean).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
// Initials underneath, the picture on top: while a picture loads (or when Gravatar has
// none and answers 404), the initials show instead of a blank.
// With a profile key the avatar opens the person's card (`tab`: also by keyboard) instead of
// a plain title tooltip.
function avatar(name, url, cls = '', { key = null, tab = false } = {}) {
  const img = url ? `<img src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
  const who = key
    ? ` data-p="${esc(key)}" role="button" aria-label="${esc(name)}"${tab ? ' tabindex="0"' : ''}`
    : ` title="${esc(name)}"`;
  return `<span class="av ${cls}" style="background:${hue(name)}"${who}>${esc(initials(name))}${img}</span>`;
}

// ---------------------------------------------------------------- profile cards
// Cards come with the inbox and thread payloads (`profiles`, keyed by platform account), so
// hovering costs no request. People without one (no account in D1) get a card from what the
// message says about them.
function mergeProfiles(cards) {
  for (const [k, v] of Object.entries(cards || {})) state.profiles.set(k, v);
}
function profileKey(key, { name, staff, kind, domain, avatar: url, platform: source } = {}) {
  const k = key || `local:${kind || 'person'}:${staff ? 1 : 0}:${domain || ''}:${name}`;
  if (!state.profiles.has(k)) {
    state.profiles.set(k, {
      name, avatar: url || null, platform: source || null, kind: kind || 'person', domain: domain || null,
      relation: kind === 'bot' ? 'bot' : (staff ? 'adobe' : 'customer'), teams: [], local: true,
    });
  }
  return k;
}
const RELATION_LABEL = { adobe: 'Adobe', partner: 'Partner', customer: 'Customer', bot: 'Bot' };
const RELATION_HINT = {
  adobe: 'Adobe staff',
  partner: 'Works for a partner of Adobe (their mail domain is a known partner domain)',
  customer: 'Not Adobe staff and not from a known partner domain',
  bot: 'An app or integration posting automatically',
};

/** The thread a name or avatar belongs to: its row in the list, or the open thread. */
function cardContext(el) {
  const key = el.closest('.t')?.dataset.thread || state.open;
  const t = state.data?.threads.find((x) => x.thread === key) || {};
  const th = state.cache.get(key)?.data?.thread || {};
  return {
    org: orgName(t.org ? t : th), icon: orgIcon(t.org ? t : th), customerDomain: t.customerDomain || null, channel: t.channel_name || th.channel_name,
  };
}

function cardHtml(p, ctx) {
  const role = [p.title, p.company].filter(Boolean).join(' · ');
  const rel = p.relation || 'customer';
  const label = rel === 'partner' && p.partner ? `Partner · ${p.partner}` : RELATION_LABEL[rel];
  const where = p.platform === 'slack' ? 'Slack account' : p.platform === 'teams' ? 'Teams account' : '';
  const rows = [];
  const ico = (d) => (d ? `<img src="${esc(favicon(d))}" alt="" loading="lazy" onerror="this.remove()">` : '');
  if (p.domain) rows.push(['Mail', `${ico(p.domain)}${esc(p.domain)}`]);
  if (p.teams?.length) rows.push(['Ops teams', esc(p.teams.join(', '))]);
  if (ctx.org) {
    rows.push(['Channel', `${ico(ctx.icon)}${esc(ctx.org)}${ctx.channel ? ` <span style="color:var(--faint)">· ${esc(ctx.channel)}</span>` : ''}`]);
  }
  // A customer from another domain than the channel's customer may be a partner nobody listed.
  const other = rel === 'customer' && p.domain && ctx.customerDomain && p.domain !== ctx.customerDomain;
  return `<div class="top">${avatar(p.name || '?', p.avatar)}<div>
      <div class="nm">${esc(p.name || 'unknown')}</div>${role ? `<div class="ttl">${esc(role)}</div>` : ''}</div></div>
    <div class="chips"><span class="rel ${esc(rel)}" title="${esc(RELATION_HINT[rel] || '')}">${esc(label)}</span>
      ${where ? `<span class="tag">${where}</span>` : ''}</div>
    ${rows.length ? `<dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>` : ''}
    ${other ? `<div class="note">Not the usual customer domain in this channel (${esc(ctx.customerDomain)}).</div>` : ''}
    ${p.local ? '<div class="note">No account details known yet.</div>' : ''}`;
}

const card = { el: null, target: null, showTimer: 0, hideTimer: 0, pointer: 'mouse' };
function cardEl() {
  if (card.el) return card.el;
  const el = document.createElement('div');
  el.id = 'pcard';
  el.className = 'pcard';
  el.setAttribute('role', 'tooltip');
  el.hidden = true;
  el.addEventListener('pointerenter', () => clearTimeout(card.hideTimer));
  el.addEventListener('pointerleave', (e) => { if (e.pointerType !== 'touch') hideCardSoon(); });
  document.body.append(el);
  card.el = el;
  return el;
}
function showCard(target) {
  clearTimeout(card.showTimer);
  clearTimeout(card.hideTimer);
  const p = state.profiles.get(target.dataset.p);
  if (!p || !target.isConnected) return;
  const el = cardEl();
  if (card.target && card.target !== target) card.target.removeAttribute('aria-describedby');
  el.innerHTML = cardHtml(p, cardContext(target));
  el.hidden = false;
  card.target = target;
  target.setAttribute('aria-describedby', 'pcard');
  // Below the name or avatar, or above it when there is no room; always on screen.
  const r = target.getBoundingClientRect();
  const w = el.offsetWidth;
  const h = el.offsetHeight;
  let top = r.bottom + 6;
  if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
  el.style.top = `${top}px`;
  el.style.left = `${Math.max(8, Math.min(r.left, window.innerWidth - w - 8))}px`;
}
function hideCard() {
  clearTimeout(card.showTimer);
  clearTimeout(card.hideTimer);
  if (card.el) card.el.hidden = true;
  card.target?.removeAttribute('aria-describedby');
  card.target = null;
}
function hideCardSoon() {
  clearTimeout(card.hideTimer);
  card.hideTimer = setTimeout(hideCard, 160);
}
/** After a re-render: a card whose name or avatar is gone goes too. */
function cardGone() { if (card.target && !card.target.isConnected) hideCard(); }

function wireCards() {
  const hovering = (e) => e.pointerType === 'mouse' || e.pointerType === 'pen';
  document.addEventListener('pointerdown', (e) => { card.pointer = e.pointerType; }, true);
  document.addEventListener('pointerover', (e) => {
    if (!hovering(e)) return;
    const t = e.target.closest('[data-p]');
    if (t) {
      clearTimeout(card.hideTimer);
      if (card.target === t) return;
      clearTimeout(card.showTimer);
      // Quick when moving from one person to the next, a pause before the first.
      card.showTimer = setTimeout(() => showCard(t), card.target ? 60 : 350);
    }
  });
  document.addEventListener('pointerout', (e) => {
    if (!hovering(e)) return;
    const t = e.target.closest('[data-p]');
    if (!t || (e.relatedTarget && t.contains(e.relatedTarget))) return;
    clearTimeout(card.showTimer);
    if (card.target) hideCardSoon();
  });
  // A tap shows the card (and does not open the thread underneath); a tap elsewhere hides it.
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-p]');
    if (t && card.pointer === 'touch') {
      e.preventDefault();
      e.stopPropagation();
      if (card.target === t) hideCard(); else showCard(t);
      return;
    }
    if (card.target && !e.target.closest('#pcard') && t !== card.target) hideCard();
  }, true);
  document.addEventListener('focusin', (e) => {
    const t = e.target.closest?.('[data-p]');
    if (t && t.matches(':focus-visible')) showCard(t);
  });
  document.addEventListener('focusout', (e) => {
    if (card.target && e.target === card.target && !card.el.contains(e.relatedTarget)) hideCard();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && card.target) { hideCard(); return; }
    const t = e.target.closest?.('[data-p]');
    if (t && (e.key === 'Enter' || e.key === ' ')) {

// ---------------------------------------------------------------- facets
// Status: red = nobody at Adobe has seen it, or you were mentioned; yellow = a teammate was
// mentioned, or nobody on the team has seen it; green = only you have not; none = caught up.
const URGENCY = ['low', 'normal', 'high', 'critical'];
// None and low are one bucket.
const urgencyOf = (t) => (t.label && t.label.urgency != null ? URGENCY[Math.min(3, Math.round(t.label.urgency))] : 'low');
const KIND_EMOJI = {
  incident: '🔥', security: '🔒', question: '❓', request: '🙋', access: '🔑', alert: '🚨', other: '💬',
};
const URGENCY_ICON = { critical: '🆘', high: '⚡', normal: '🔹', low: '▫️' };
const kindOf = (t) => (t.kind === 'alert' ? 'alert' : (t.label?.label_kind && t.label.label_kind !== 'other' ? t.label.label_kind : 'other'));
// A staff ✅ on the root decides (until a customer writes again), else Clef does.
const resolvedOf = (t) => t.resolution?.verdict
  || (t.label?.resolved_p == null ? null : (t.label.resolved_p >= 0.5 ? 'resolved' : 'open'));
const checked = (t) => t.resolution?.verdict === 'resolved';
const resolvedP = (t) => (t.resolution?.verdict ? Number(checked(t)) : (t.label?.resolved_p ?? 0));
const viewerId = () => state.data?.me?.id ?? state.me.id;
const teamIds = () => new Set(Object.values(state.data?.teams || {}).flatMap((x) => x.members));
/**
 * Us, Customer (customer or vendor), Nobody. The API works it out (`waitingOn` in
 * src/threads.js): Clef's label, except that a thread where Adobe posted last never waits on
 * us, and without a label, a thread waits on us when the customer posted last.
 */
const waitingOn = (t) => {
  const n = t.waiting_on;
  if (n === 'us') return 'Us';
  if (n === 'customer' || n === 'vendor') return 'Customer';
  return 'Nobody';
};

// How long a thread may wait before it turns yellow, by urgency.
const MIN = 60000;
const WAIT_US = { critical: 15 * MIN, high: 60 * MIN, normal: 180 * MIN, low: 180 * MIN };
const WAIT_THEM = { critical: 30 * MIN, high: 60 * MIN, normal: 1440 * MIN, low: 1440 * MIN };

/**
 * The status pile a thread is in, most pressing first:
 * - critical: critical urgency and nobody at Adobe has seen it (dark red)
 * - hot: high urgency and nobody at Adobe has seen it (red)
 * - you: you are in it (posted or mentioned), and the last word is not Adobe's, or it
 *   mentions you (blue)
 * - waiting: waits on us longer than its urgency allows (yellow); never when Adobe posted last
 * - silent: waits on the customer or vendor longer than its urgency allows (purple)
 * - team: your team is in it, you were not mentioned, all is well (green)
 * - quiet: everything else (grey)
 */
/**
 * What the steering reactions say, for the viewer: `mine` 👀 by the viewer (on it),
 * `others` 👀 by someone else at Adobe since the customer last wrote (someone is on it),
 * `help` 🛟 by someone else at Adobe (they ask the team to look).
 */
function signals(t) {
  const me = viewerId();
  const list = (t.signals || []).filter((x) => x.staff);
  const since = (x) => t.last_staff === 1 || !t.last_at || (x.at && x.at >= t.last_at);
  return {
    mine: list.some((x) => x.signal === 'seen' && x.person === me),
    others: list.some((x) => x.signal === 'seen' && x.person !== me && since(x)),
    help: list.some((x) => x.signal === 'help' && x.person !== me),
  };
}

function statusOf(t) {
  const me = viewerId();
  const u = urgencyOf(t);
  const alert = t.kind === 'alert';
  const sig = signals(t);
  if (!alert && t.unseenByAdobe && u === 'critical') return 'critical';
  if (!alert && t.unseenByAdobe && u === 'high') return 'hot';
  // 🛟: a colleague asks for eyes on it.
  if (!alert && sig.help && !checked(t)) return 'you';
  // 👀 by a colleague: they are on it, so it is theirs, unless it mentions you.
  if (!alert && sig.others && !sig.mine && !t.mentionedMe) return 'team';
  const mine = (t.posters || []).includes(me) || (t.mentioned || []).some((m) => m.person === me)
    || sig.mine;
  // Resolved with ✅ by staff: nobody is waiting, whoever spoke last.
  if (!alert && mine && !checked(t) && (t.last_staff === 0 || t.mentionedMe)) return 'you';
  const age = Date.now() - (Date.parse(lastOf(t)) || Date.now());
  const on = waitingOn(t);
  if (!alert && !checked(t) && on === 'Us' && age > WAIT_US[u]) return 'waiting';
  if (!alert && !checked(t) && on === 'Customer' && age > WAIT_THEM[u]) return 'silent';
  const team = teamIds();
  if ((t.posters || []).some((p) => team.has(p)) && !t.mentionedMe) return 'team';
  return 'quiet';

const STATUS_ORDER = ['critical', 'hot', 'you', 'waiting', 'silent', 'team', 'quiet'];
const STATUS_LABEL = {
  critical: 'Critical, unseen', hot: 'Hot, unseen', you: 'You', waiting: 'Waiting too long', silent: 'Customer silent', team: 'Team on it', quiet: 'Everything else',
};
const STATUS_HINT = {
  critical: 'Critical urgency and nobody at Adobe has seen it',
  hot: 'High urgency and nobody at Adobe has seen it',
  you: 'You posted, were mentioned or put 👀 on it, and the customer spoke last or you were mentioned (not once resolved with ✅); or a colleague asked for help with 🛟',
  waiting: 'Waiting on us for too long (15 min critical, 1 h high, 3 h normal), and Adobe did not post last',
  silent: 'Waiting on the customer or vendor for too long (30 min critical, 1 h high, 1 day normal): follow up or close',
  team: 'Your team is in it (or a colleague put 👀 on it), you were not mentioned, all is well',
  quiet: 'Everything else',
};

/** Who a thread involves, from the viewer's point of view. */
function involvement(t) {
  const me = viewerId();
  const out = [];
  const people = [...(t.posters || []), ...(t.mentioned || []).map((m) => m.person)];
  if (people.includes(me)) out.push('me');
  for (const [slug, team] of Object.entries(state.data?.teams || {})) {
    if (people.some((p) => team.members.includes(p))) out.push(`team:${slug}`);
  }
  for (const p of state.coPeople || []) if (people.includes(p)) out.push(`person:${p}`);
  return out.length ? out : null;
}
/** The ten people the viewer shares the most threads with. */
function coParticipants() {
  const me = viewerId();
  const n = new Map();
  for (const t of state.data?.threads || []) {
    const people = new Set([...(t.posters || []), ...(t.mentioned || []).map((m) => m.person)]);
    if (!people.has(me)) continue;
    for (const p of people) if (p !== me) n.set(p, (n.get(p) || 0) + 1);

/**

    .map((k) => `<i class="c-${k}" style="flex:${m[k]}" title="${m[k]} ${esc(STATUS_LABEL[k])}"></i>`).join('');

function renderFilters() {
  const all = state.data?.threads || [];
  $('filters').innerHTML = FACETS.map((f) => {
    const pool = all.filter((t) => passes(t, f.id));
    const counts = new Map();
    const mix = new Map(); // value -> { red, yellow, green, none }
    for (const t of pool) {
      for (const v of valuesOf(f, t)) {
        counts.set(v, (counts.get(v) || 0) + 1);
        const m = mix.get(v) || {};
        m[statusOf(t)] = (m[statusOf(t)] || 0) + 1;
        mix.set(v, m);

    if (f.multi) counts.delete('(none)');
    for (const v of state.sel[f.id] || []) if (!counts.has(v)) counts.set(v, 0);
    let rows = [...counts];
    const order = typeof f.order === 'function' ? f.order() : f.order;
    if (f.multi) for (const v of order || []) if (!counts.has(v)) counts.set(v, 0);
    rows.sort((a, b) => (order ? (order.indexOf(a[0]) + 1 || 99) - (order.indexOf(b[0]) + 1 || 99) : b[1] - a[1]));

const emojify = (text) => esc(text).replace(EMOJI_CODE, (m, n) => emojiByName(n) || m);

const URGENCY_EMOJI = { critical: '🆘', high: '⚡' };

/** The thread's mood: its kind first, then the reactions people left in it. */

// Smart order: what needs me most, first. Recency always counts; a thread that waits on
// us counts more the longer it waits, the more urgent and unresolved it is, and the closer
// it is to me (mentioned me > I posted > mentioned the team > the team posted).
const STATUS_WEIGHT = {
  critical: 6, hot: 5, you: 4, waiting: 3, silent: 2, team: 1.5, quiet: 1,
};
function smartScore(t) {
  return STATUS_WEIGHT[statusOf(t)] * 100 + baseScore(t);
}
function baseScore(t) {
  const now = Date.now();
  const last = Date.parse(lastOf(t) || t.any_at || 0) || 0;
  const ageH = Math.max(0, (now - last) / 3600000);
  const recency = Math.exp(-ageH / 48);
  const urgency = 1 + (t.label?.urgency ?? 0.5);
  const open = 1 - 0.8 * resolvedP(t);
  const me = viewerId();
  const team = teamIds();
  let near = 1;
  if ((t.mentioned || []).some((m) => m.person === me) || t.mentionedMe) near = 3;
  else if ((t.posters || []).includes(me) || signals(t).mine) near = 2;
  else if ((t.mentioned || []).some((m) => team.has(m.person))) near = 1.5;
  else if ((t.posters || []).some((p) => team.has(p))) near = 1.2;
  const waitsOnUs = t.waiting_on === 'us';
  const waiting = waitsOnUs ? 1 + Math.log2(1 + ageH / 2) : 0.3;
  const unseen = t.unseenByAdobe ? 1.5 : 1;
  const alert = t.kind === 'alert' ? 0.3 : 1;
  const sig = signals(t);
  // 👀 by a colleague lowers it for you; 🛟 by a colleague raises it.
  const steer = (sig.others && !sig.mine ? 0.5 : 1) * (sig.help ? 2 : 1);
  return alert * (2 * recency + urgency * open * waiting * near * unseen * steer);
}

const tpl = document.createElement('template');

// Threads in view are fetched ahead, so opening one is instant.

const FUNNEL = '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4h12M4.5 8h7M7 12h2"/></svg>';

function renderThreads() {

  const recent = state.sort === 'recent';

    const cls = /^<div class="([^"]*)"/.exec(html.trim())[1];

// The open thread's row, lifted out of its column: a copy of it over the real one, wider by
// LIFT on each side and over the pane, in #lift, which spans the list. It floats over the
// list's heading while its row is below it, and slides under it with its row: above the
// heading's lower edge #lift fades out, over its top LIFT.v and shadow (LIFT.shade) at rest,
// over less and less of it as the row goes under, to a hard edge once it has.
const LIFT = { left: 10, right: 16, v: 3, room: 48, shade: 16 };
let liftOf = null;
function syncLift(copy) {
  const list = $('threads');
  const lift = $('lift');
  const sel = list.querySelector('.t.sel');
  lift.hidden = !sel;
  if (!sel) { liftOf = null; return; }
  if (copy || liftOf !== sel) {
    liftOf = sel;
    lift.innerHTML = sel.outerHTML;
    lift.firstElementChild.classList.remove('enter');
  }
  const main = lift.parentElement.getBoundingClientRect();
  const box = list.getBoundingClientRect();
  const head = list.querySelector('.count')?.offsetHeight || 0;
  const r = sel.getBoundingClientRect();
  const over = LIFT.v + LIFT.shade;
  const f = over - Math.min(Math.max(box.top + head - r.top, 0), over);
  const mask = `linear-gradient(transparent ${head - f}px, #000 ${head - (LIFT.v * f) / over}px)`;
  Object.assign(lift.style, {
    left: `${box.left - main.left - LIFT.room}px`,
    top: `${box.top - main.top}px`,
    width: `${box.width + 2 * LIFT.room}px`,
    height: `${box.height}px`,
    maskImage: mask,
    webkitMaskImage: mask,
  });
  const { style } = lift.firstElementChild;
  Object.assign(style, {
    left: `${r.left - box.left + LIFT.room - LIFT.left}px`,
    top: `${r.top - box.top - LIFT.v}px`,
    width: `${r.width + LIFT.left + LIFT.right}px`,
    height: `${r.height + 2 * LIFT.v}px`,
  });
  style.setProperty('--ll', `${LIFT.left}px`);
  style.setProperty('--lr', `${LIFT.right}px`);
  style.setProperty('--lv', `${LIFT.v}px`);
}
{
  let frame = 0;
  let copy = false;
  const later = (again) => {
    copy ||= again;
    if (!frame) {
      frame = requestAnimationFrame(() => { frame = 0; syncLift(copy); copy = false; });
    }
  };
  new MutationObserver(() => later(true)).observe($('threads'), {
    childList: true, subtree: true, attributes: true, characterData: true,
  });
  $('threads').addEventListener('scroll', () => later(false), { passive: true });
  $('threads').addEventListener('animationend', () => later(false));
  new ResizeObserver(() => later(false)).observe(document.querySelector('main'));
}

const nearBottom = (el) => el.scrollHeight - el.scrollTop - el.clientHeight < 80;

async function openThread(key, { live = false, cached = false } = {}) {
  const switching = state.open !== key;
  state.open = key;
  if (switching) prefetchAround(key);
  if (switching) toUrl();
  renderThreads();
  const pane = $('pane');
  const prevScroller = pane.querySelector('.scroller');
  const wasNear = prevScroller ? nearBottom(prevScroller) : true;
  const keepTop = prevScroller ? prevScroller.scrollTop : 0;
  const typed = $('reply')?.value;
  const focused = document.activeElement === $('reply');
  const caret = focused ? [$('reply').selectionStart, $('reply').selectionEnd] : null;
  if (!live && !state.cache.get(key)) pane.innerHTML = '<div class="empty">Loading…</div>';

  } catch (e) {

  }

  if (state.open !== key) return;
  const group = members.length > 1;
  const t = state.data?.threads.find((x) => x.thread === key) || {};
  // Where I was: the last time I had read any member of this entry.
  const myRead = watermarks.filter((w) => w.person === state.me.id).map((w) => w.read_at).sort().pop() || null;
  const ids = new Set(messages.map((m) => `${m.thread}|${m.id}`));
  const fresh = (m) => live && state.shownIds && !state.shownIds.has(`${m.thread}|${m.id}`);
  // Replies I sent that have not arrived yet.

    ...p, author: { kind: 'person', name: state.me.name, staff: true }, pending: true,
  }))];
  setMentionNames([
    ...shown.map((m) => m.author?.name),
    ...Object.values(state.data?.people || {}).map((p) => p.name),
    ...mention.names,
  ]);
  let feed = '';
  let prev = null;
  let day = null;
  shown.forEach((m, i) => {
    if (dayLabel(m.at) !== day) { day = dayLabel(m.at); feed += `<div class="day"><span>${esc(day)}</span></div>`; prev = null; }
    if (group && prev && prev.thread !== m.thread) { feed += `<div class="post">new post · ${clock(m.at)}</div>`; prev = null; }
    if (!group && i === 1 && thread.root_at && messages.length > 1) { feed += `<div class="divider">${messages.length - 1} ${messages.length === 2 ? 'reply' : 'replies'}</div>`; prev = null; }
    feed += message(m, prev, fresh(m));

    const [org, site] = f.value.split('/');
    const host = `main--${site}--${org}.aem.live`;
    return `<a class="back" href="https://${esc(host)}/" target="_blank" rel="noopener">${esc(host)}</a>`;
  }).join(' ');
  const chips = facts.filter((f) => f.field === 'ticket' || f.field === 'cve').map((f) => `<span class="tag">${esc(f.value)}</span>`).join('');
  const stack = (data.tech || []).map((x) => `<span class="tag tech" title="${Math.round(x.p * 100)}%">${esc(TECH_LABEL[x.tech] || x.tech)}</span>`).join('');
  pane.innerHTML = `<div class="ph"><h2>${emojify(thread.title || '(no text)')} ${backlink(thread, `Open in ${platform(thread)} ↗`)}</h2>
      <div class="sub">${orgIcon({ ...t, ...thread }) ? `<img src="${esc(favicon(orgIcon({ ...t, ...thread })))}" alt="">` : ''}<span>${esc(orgName(thread))}</span>${ORG_TYPE[thread.org_type] ? ` <span class="tag">${ORG_TYPE[thread.org_type]}</span>` : ''} ·
        <span>${esc(thread.channel_name || '')}</span>

    const el = firstUnread && scroller.querySelector(`[data-id="${CSS.escape(`${firstUnread.thread}|${firstUnread.id}`)}"]`);
