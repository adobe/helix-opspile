<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Enterprise Support · agents</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f1114" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Support">
<link rel="stylesheet" href="header.css">
<style>
  :root {
    --bg: #0f1114; --col: #15181c; --card: #1a1e23; --line: #2a2f36; --hover: #20252b;
    --ink: #e8eaed; --mute: #8b929b; --faint: #5d646d;
    --accent: #5aa2ff; --link: #7cc0ff; --sel: #1f2a38;
    --red: #e5534b; --yellow: #d4a72c; --green: #57ab5a; --purple: #a371f7;
    --code: #0b0d10;
    font: 14px/1.45 "Adobe Clean", adobe-clean, "Source Sans 3", "Source Sans Pro",
      -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eceef1; --col: #f6f7f9; --card: #fff; --line: #dfe2e6; --hover: #eef1f5;
      --ink: #1d2025; --mute: #616a75; --faint: #9aa1aa; --accent: #1f6feb; --link: #0b5cc4;
      --sel: #dde9fb; --purple: #8250df; --code: #f3f4f6;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: var(--app-height, 100%); overflow: hidden; }
  /* Installed as an app on an iPhone (viewport-fit=cover), the page reaches under the home
     indicator and, on the phone's side, under the camera: the sections scroll their ends out
     from under it, and the page keeps clear of the sides. The insets are 0 everywhere else. */
  :root { --safe-bottom: env(safe-area-inset-bottom, 0px); }
  body { padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  /* With the on-screen keyboard open (see the script at the end), the page follows what is left
     above it, and the keyboard covers the home indicator. */
  :root.keyboard { --safe-bottom: 0px; }
  body { translate: 0 var(--app-top, 0px); }
  main > section::after { content: ""; display: block; height: var(--safe-bottom); flex: none; }
  body { margin: 0; background: var(--bg); display: flex; flex-direction: column; }
  button, input, select { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line);
    border-radius: 7px; padding: 3px 9px; }
  button { cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--red); }
  a { color: var(--link); }
  /* The header is every page's (ui/header.css). */
  main { flex: 1; display: grid; grid-template-columns: 260px 320px 1fr; min-height: 0; }
  main > section { overflow: auto; min-height: 0; border-right: 1px solid var(--line); }
  #bases { padding: 12px; background: var(--bg); }
  #files { padding: 12px 10px; background: var(--col); }
  #editor { display: flex; flex-direction: column; min-width: 0; border-right: 0; background: var(--card); }
  h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--mute);
    margin: 14px 4px 6px; }
  h2:first-child { margin-top: 0; }
  #filter { width: 100%; margin-bottom: 8px; }
  .row { display: flex; gap: 8px; align-items: baseline; padding: 5px 8px; border-radius: 7px; cursor: pointer;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .row:hover { background: var(--hover); }
  .row.on { background: var(--sel); }
  .row .sub { color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
  .row.dir { color: var(--mute); cursor: default; font-size: 13px; }
  .row.dir:hover { background: none; }
  .row .tag { font-size: 11px; padding: 0 6px; border-radius: 9px; border: 1px solid var(--line); color: var(--mute); }
  .row .tag.missing { border-style: dashed; }
  .row .n { margin-left: auto; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  /* Customers and vendors: by activity or by name. */
  h2.sorted { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; flex: none; }
  .seg button { border: 0; border-radius: 0; padding: 0 6px; font-size: 11px; font-weight: 500; letter-spacing: 0;
    text-transform: none; color: var(--mute); background: none; }
  .seg button[aria-pressed="true"] { background: var(--sel); color: var(--ink); }
  .tools { display: flex; gap: 6px; margin: 10px 4px 0; flex-wrap: wrap; }
  .empty { color: var(--mute); padding: 24px; }
  .bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar .path { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; flex: 1; min-width: 160px; }
  .bar input.path { padding: 3px 7px; }
  .bar .title { flex: 1; font-weight: 600; }
  .bar .hash { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--faint); }
  .note { padding: 8px 12px; color: var(--mute); border-bottom: 1px solid var(--line); font-size: 13px; }
  /* Nothing to say (a concept that was just opened): no empty strip. */
  .note:empty { display: none; }
  .note.warn { color: var(--yellow); }
  .note.err { color: var(--red); }
  .note.ok { color: var(--green); }
  /* The text field, CodeMirror (src/ui-editor.js), fills what the bar and the note leave. */
  .text { flex: 1; min-height: 0; display: flex; font-size: 13px; }
  .foot { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); }
  .foot input { flex: 1; }
  .log { padding: 4px 12px 12px; }
  .log .c { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .log .c .h { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--faint); }
  .log .c .m { margin-top: 2px; }
  dialog.confirm { max-width: min(520px, 92vw); background: var(--card); color: var(--ink); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px; }
  dialog.confirm::backdrop { background: rgba(0,0,0,.35); }
  dialog.confirm p { margin: 0 0 6px; }
  dialog.confirm .detail { color: var(--mute); font-size: 13px; }
  dialog.confirm .apply { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .note button { margin-left: 6px; padding: 1px 8px; font-size: 13px; }
  .row .tag.agent { color: var(--green); border-color: color-mix(in srgb, var(--green) 45%, transparent); }
  /* Thread agents per channel: one switch per channel. */
  .channels { padding: 4px 12px 12px; overflow: auto; scroll-padding-top: 36px; }
  .ch { display: flex; gap: 12px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .ch .who { flex: 1; min-width: 0; }
  .ch .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch .nm .src { font-weight: 400; font-size: 11px; padding: 0 6px; margin-left: 6px; border-radius: 9px;
    border: 1px solid var(--line); color: var(--mute); }
  .ch .sub { color: var(--mute); font-size: 12px; }
  .ch .sub.by { color: var(--faint); }
  .ch .state { font-size: 12px; color: var(--mute); min-width: 24px; text-align: right; }
  .ch .state.on { color: var(--green); font-weight: 600; }
  .switch { position: relative; flex: none; width: 36px; height: 20px; padding: 0; border: 0; border-radius: 10px;
    background: var(--line); }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .15s; }
  .switch[aria-checked="true"] { background: var(--green); }
  .switch[aria-checked="true"]::after { left: 18px; }
  .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* MCP servers of the agents: one row per server, as the channels above, its form below. */
  .ch .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .ch .tags .src { padding: 0 6px; border-radius: 9px; border: 1px solid var(--line); color: var(--mute);
    font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .ch .tags .src.off { opacity: .45; text-decoration: line-through; }
  .ch .acts { display: flex; gap: 6px; }
  .ch .acts button { padding: 1px 8px; font-size: 12px; }
  .ch .nm .src.ok { color: var(--green); border-color: color-mix(in srgb, var(--green) 45%, transparent); }
  .ch .nm .src.err, .ch .sub.err { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, transparent); }
  .ch .sub.err { overflow-wrap: anywhere; }
  .mono { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .mcpform { display: grid; grid-template-columns: 120px 1fr; gap: 8px 12px; align-items: center; margin: 14px 2px 0; }
  .mcpform h3 { grid-column: 1 / -1; margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--mute); }
  .mcpform label { color: var(--mute); font-size: 13px; }
  .mcpform .pair { display: flex; gap: 6px; }
  .mcpform .pair input:first-child { width: 160px; flex: none; }
  .mcpform .pair input:last-child { flex: 1; min-width: 0; }
  .mcpform .hint { grid-column: 2; color: var(--faint); font-size: 12px; margin-top: -4px; }
  .mcpform .hint.wide { margin-top: 0; }
  .mcpform .hint .mono { overflow-wrap: anywhere; font-size: 11px; }
  .mcpform [hidden] { display: none; }
  .mcpform .apply { grid-column: 2; display: flex; gap: 8px; }
  /* Global MCP servers: opspile's own, switched per team and per channel. */
  .channels h3.group { margin: 14px 2px 2px; font-size: 12px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--mute); }
  .channels h3.group:first-child { margin-top: 6px; }
  .ch.global { flex-wrap: wrap; row-gap: 0; }
  /* What you are switching: its name and switch stay on top of its long list of channels (at
     the edge of the list: a sticky element stays inside the padding of .channels otherwise). */
  .ch.global .head { flex-basis: 100%; min-width: 0; display: flex; gap: 12px; align-items: center;
    position: sticky; top: -4px; z-index: 1; padding: 6px 0; margin-top: -6px; background: var(--card);
    container-type: scroll-state; }
  .ch.global .head::after { content: ""; position: absolute; inset: auto 0 0; height: 1px; }
  @container scroll-state(stuck: top) { .ch.global .head::after { background: var(--line); } }
  .ch.global .head .nm { flex: 1; min-width: 0; }
  .ch.global .per { flex-basis: 100%; margin: 14px 0 0; }
  .ch.global .per summary { cursor: pointer; color: var(--mute); font-size: 12px; }
  .ch.global .per .row2 { display: flex; gap: 10px; align-items: center; padding: 4px 0 4px 14px; font-size: 13px; }
  .ch.global .per .row2 span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch.global .per select { font-size: 12px; }
  .ch.global .per .na { color: var(--faint); font-style: normal; font-size: 12px; }
  .ch.global .per .row2[hidden], .ch.global .per .none[hidden] { display: none; }
  .ch.global .per .find { display: block; width: calc(100% - 14px); max-width: 320px; margin: 6px 0 2px 14px; font-size: 12px; }
  .ch.global .per .none { color: var(--faint); font-size: 12px; padding: 4px 0 4px 14px; }
  /* A customer's: the per-channel switches are all it has, so they are shown, not folded. */
  .ch.global .per.flat { margin-top: 16px; }
  .ch.global .per.flat .row2, .ch.global .per.flat .none { padding-left: 0; }
  .ch.global .per.flat .find { margin-left: 0; width: 100%; }
  /* A team's thread agents by default, above its channels. */
  .ch.default { background: var(--col); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; margin: 8px 0 4px; }
  /* Your own: whether your inbox shows the agent's thinking, everywhere and in each channel. */
  .ch.mine { border-style: dashed; }
  .ch .sub.mine { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; }
  .ch .sub.mine select { font-size: 12px; padding: 1px 6px; }
  /* Opened from a thread's agent in the inbox: its channel, for a moment. */
  .ch { transition: background .6s; }
  .ch.found { background: var(--sel); }
  .empty.ro { color: var(--faint); font-size: 12px; }
  .ch.global .setup { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px;
    margin-top: 16px; }
  .ch.global .setup input { width: 200px; }
  .ch.global .setup a.btn { border: 1px solid var(--line); border-radius: 7px; padding: 3px 9px; background: var(--card);
    color: inherit; text-decoration: none; white-space: nowrap; }
  .ch.global .setup a.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* Extraction rules: one row per rule or technology, as the servers above; the admin team's folded. */
  .ch.rule.off .nm, .ch.rule.replaced .nm { opacity: .55; }
  .ch.rule .sub.pat { overflow-wrap: anywhere; color: var(--mute); }
  .ch .switch-gap { width: 36px; flex: none; }
  details.inherited { margin: 6px 0 2px; }
  details.inherited > summary { cursor: pointer; color: var(--mute); font-size: 12px; padding: 4px 2px; }
  details.inherited .ch { padding-left: 12px; }
  .mcpform textarea { width: 100%; resize: vertical; color: inherit; background: var(--card); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 8px; }
  .mcpform .hint .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .mcpform .hint .tags .src { padding: 0 6px; border-radius: 9px; border: 1px solid var(--line); color: var(--ink);
    font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .mcpform .hint .err { color: var(--red); }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--mute); }

  /*
   * Narrower screens. Under 1100px the two lists get narrower. Under 700px (phones, a folded
   * iPhone Duo) one column at a time, as `main[data-pane]` says: the knowledge bases, one
   * knowledge base's files, or the editor, each with a button back to the one before.
   */
  .up { display: none; }
  .up svg { width: 14px; height: 14px; }
  #files > .up + h2 { margin-top: 0; }
  /* A text field under 16px makes iOS zoom in on it when it is focused. */
  @media (hover: none) and (pointer: coarse) {
    input, select, textarea, .text { font-size: 16px; }
  }
  @media (max-width: 1099px) {
    main { grid-template-columns: minmax(170px, 22%) minmax(200px, 27%) minmax(0, 1fr); }
  }
  @media (max-width: 699px) {
    main { grid-template-columns: 100%; }
    main > section { border-right: 0; }
    main:not([data-pane="bases"]) #bases, main:not([data-pane="files"]) #files,
    main:not([data-pane="editor"]) #editor { display: none; }
    .up { display: inline-flex; align-items: center; gap: 2px; padding: 2px 6px 2px 2px; border: 0; background: none;
      color: var(--link); }
    #files > .up { margin: 0 0 6px; }
    .bar .path { min-width: 0; overflow-wrap: anywhere; }
    .foot input { min-width: 0; }
  }
</style>
</head>
<body>
<header>
  <h1><a data-page="inbox" href="/inbox"><img src="/icon.svg" alt="Adobe"><span>Enterprise Support</span></a></h1>
  <nav class="pages" id="pages" hidden aria-label="Pages"></nav>
  <span class="spacer"></span>
  <button id="user" popovertarget="menu" aria-haspopup="true" aria-expanded="false" aria-label="Account">
    <span class="av" id="userAv"></span>
    <span class="who"><span class="nm" id="me"></span><span class="sub" id="userSub"></span></span>
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div id="menu" class="menu" popover>
    <div class="id"><span class="av" id="menuAv"></span><div><div class="nm" id="menuName"></div><div class="sub" id="menuEmail"></div></div></div>
    <section><h4>Keyboard</h4><dl class="keys"><dt>Save right away (it also saves as you type)</dt><dd><kbd>⌘S</kbd></dd></dl></section>
    <section><a class="item" href="/cdn-cgi/access/logout"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5H3.5v11H6M10 5l3 3-3 3M13 8H6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Log out</a></section>
  </div>
</header>
<script src="header.js"></script>
<main data-pane="bases">
  <section id="bases"><div class="empty">Loading…</div></section>
  <section id="files"></section>
  <section id="editor"><div class="empty">Pick a knowledge base.</div></section>
</main>
<script src="editor.js"></script>
<script type="module" src="kb.js"></script>
<script src="app.js"></script>
</body>
</html>
